<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Template Official Lesson Plan Kalananti B2C Python Program">
    <title>Template Lesson Plan Python — Kalananti</title>
    <style>
        :root {
            --blue: #265e9b;
            --blue-dark: #173f70;
            --blue-pale: #f0f6fc;
            --blue-light: #e2eef9;
            --yellow: #f9c013;
            --yellow-pale: #fffde6;
            --teal: #339d9d;
            --teal-pale: #e6f5f5;
            --ink: #1e293b;
            --muted: #64748b;
            --line: #cbd5e1;
            --paper: #ffffff;
            --screen: #e2e8f0;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--screen);
            color: var(--ink);
            font-family: "Avenir Next", Avenir, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 9pt;
            line-height: 1.4;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        #document {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10mm;
            padding: 10mm 0 20mm;
        }

        .page {
            position: relative;
            width: 210mm;
            min-height: 297mm;
            height: auto;
            padding: 20mm 16mm 14mm;
            background: var(--paper);
            border: 1px solid rgba(38, 94, 155, .15);
            box-shadow: 0 8px 25px rgba(15, 23, 42, .12);
            break-after: page;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .page:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .page-body {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            position: absolute;
            top: 5mm;
            left: 14mm;
            right: 14mm;
            height: 12mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--blue-pale);
            padding-bottom: 1.5mm;
        }

        .page-header img {
            height: 9.5mm;
            width: auto;
            object-fit: contain;
        }

        .brand-ribbons {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1mm;
        }

        .brand-ribbons .top-stripe {
            width: 60mm;
            height: 3mm;
            background: var(--blue);
            border-radius: 3px 0 0 3px;
            position: relative;
        }

        .brand-ribbons .top-stripe::before {
            content: "";
            position: absolute;
            top: 0;
            left: -8mm;
            width: 8mm;
            height: 3mm;
            background: var(--yellow);
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        .brand-ribbons .dots {
            width: 50mm;
            height: 2mm;
            background-image: radial-gradient(circle, var(--yellow) 1mm, transparent 1.1mm);
            background-size: 4.5mm 2mm;
            background-repeat: repeat-x;
        }

        .page-footer {
            margin-top: 5mm;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .footer-meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 7.5pt;
            font-weight: 600;
            padding-bottom: 1mm;
        }

        .footer-stripe {
            height: 3mm;
            background: var(--blue);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .footer-stripe::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, var(--yellow) 1mm, transparent 1.1mm);
            background-size: 7mm 3mm;
            background-repeat: repeat-x;
        }

        .badge-highlight {
            display: inline-block;
            background: var(--yellow);
            color: #172033;
            font-weight: 800;
            font-size: 9pt;
            padding: 1.5px 10px;
            border-radius: 3px;
            margin-bottom: 2.5mm;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .badge-teal {
            display: inline-block;
            background: var(--teal);
            color: #ffffff;
            font-weight: 800;
            font-size: 9pt;
            padding: 1.5px 10px;
            border-radius: 3px;
            margin-bottom: 2.5mm;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-blue {
            display: inline-block;
            background: var(--blue);
            color: #ffffff;
            font-weight: 800;
            font-size: 9pt;
            padding: 1.5px 10px;
            border-radius: 3px;
            margin-bottom: 2.5mm;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        h1, h2, h3, h4, p { margin-top: 0; }
        h1 { color: var(--blue-dark); font-size: 18pt; font-weight: 800; line-height: 1.2; margin-bottom: 2mm; }
        h2 { color: var(--blue-dark); font-size: 12pt; font-weight: 700; margin-bottom: 2mm; }
        h3 { color: var(--blue-dark); font-size: 10pt; font-weight: 700; margin-bottom: 1.5mm; }
        h4 { color: var(--blue); font-size: 8.8pt; font-weight: 700; margin-bottom: 1mm; }
        p { margin-bottom: 1.8mm; }

        ul, ol { margin: 0.8mm 0 2mm; padding-left: 4.5mm; }
        li { margin-bottom: 0.8mm; }

        code {
            padding: 1px 4px;
            border-radius: 3px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 8pt;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }

        .doc-card {
            padding: 2.5mm 3mm;
            border: 1px solid var(--line);
            border-radius: 2.5mm;
            background: #ffffff;
        }

        .doc-card.yellow-border { border-top: 2mm solid var(--yellow); }
        .doc-card.blue-border { border-top: 2mm solid var(--blue); }
        .doc-card.teal-border { border-top: 2mm solid var(--teal); }

        .callout {
            padding: 2.5mm 3.5mm;
            border-radius: 2.5mm;
            border: 1px solid var(--line);
            background: #f8fafc;
            margin-bottom: 2.5mm;
        }

        .callout.yellow { border-left: 2.5mm solid var(--yellow); background: var(--yellow-pale); }
        .callout.teal { border-left: 2.5mm solid var(--teal); background: var(--teal-pale); }
        .callout.blue { border-left: 2.5mm solid var(--blue); background: var(--blue-pale); }

        table.doc-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5mm;
            margin-bottom: 2.5mm;
            font-size: 8.2pt;
        }

        table.doc-table th, table.doc-table td {
            padding: 1.8mm 2.2mm;
            border: 1px solid var(--line);
            vertical-align: top;
        }

        table.doc-table th {
            background: var(--blue);
            color: #ffffff;
            font-weight: 700;
            font-size: 7.8pt;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            text-align: left;
        }

        table.doc-table tr:nth-child(even) td {
            background: #f8fafc;
        }

        table.doc-table .time-col { width: 15mm; font-weight: 800; color: var(--blue-dark); text-align: center; }
        table.doc-table .activity-col { width: 38mm; }

        .code-box {
            margin: 2mm 0;
            border: 1px solid var(--line);
            border-radius: 2mm;
            background: #f8fafc;
            overflow: hidden;
        }

        .code-box .code-header {
            padding: 1mm 2.5mm;
            background: var(--blue-pale);
            border-bottom: 1px solid var(--line);
            color: var(--blue-dark);
            font-size: 7.5pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .code-box pre {
            margin: 0;
            padding: 2mm 2.5mm;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 7.8pt;
            line-height: 1.35;
            color: #0f172a;
            white-space: pre-wrap;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: 28mm 1fr;
            gap: 1mm;
            margin-top: 1.5mm;
            font-size: 8pt;
        }

        .vocab-grid dt {
            font-weight: 800;
            color: var(--blue-dark);
            background: var(--blue-pale);
            padding: 1mm 1.5mm;
            border-radius: 1.5mm 0 0 1.5mm;
            border-left: 1.5mm solid var(--blue);
        }

        .vocab-grid dd {
            margin: 0;
            padding: 1mm 2mm;
            background: #ffffff;
            border: 1px solid var(--line);
            border-left: none;
            border-radius: 0 1.5mm 1.5mm 0;
        }

        .lesson-learned {
            margin-top: 2mm;
            padding: 2mm 2.5mm;
            border-radius: 2mm;
            background: #f1f5f9;
            border-left: 2mm solid var(--blue);
        }

        .lesson-learned h4 { margin-bottom: 0.8mm; color: var(--blue-dark); }
        .lesson-learned ul { margin-bottom: 0; }

        .checklist { list-style: none; padding-left: 0; }
        .checklist li { position: relative; padding-left: 4.5mm; }
        .checklist li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--blue);
            font-weight: 900;
        }

        .cover-page {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24mm 18mm 16mm;
            background: linear-gradient(180deg, #ffffff 0%, #f4f8fc 100%);
        }

        .cover-page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 9mm;
            background: var(--blue);
            border-bottom: 2.5mm solid var(--yellow);
        }

        .cover-logo {
            width: 70mm;
            height: auto;
            margin-bottom: 20mm;
        }

        .cover-title-group h1 {
            font-size: 28pt;
            color: var(--blue-dark);
            margin-bottom: 2.5mm;
            letter-spacing: -0.02em;
        }

        .cover-kicker {
            color: var(--teal);
            font-size: 10.5pt;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .cover-planet {
            font-size: 14pt;
            color: var(--blue);
            font-weight: 700;
            margin-bottom: 10mm;
        }

        .cover-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5mm;
            max-width: 160mm;
        }

        .cover-meta-card {
            padding: 3mm;
            border: 1px solid var(--line);
            border-top: 1.8mm solid var(--yellow);
            border-radius: 2mm;
            background: #ffffff;
        }

        .cover-meta-card span {
            display: block;
            font-size: 7.5pt;
            font-weight: 800;
            color: var(--blue);
            text-transform: uppercase;
            margin-bottom: 0.8mm;
        }

        @page { size: A4 portrait; margin: 0; }

        @media print {
            html, body { width: 210mm; background: #fff; }
            #document { padding: 0; gap: 0; }
            .page { border: none; box-shadow: none; min-height: 297mm; height: auto; }
        }
    </style>
</head>
<body>
    <main id="document">
        <!-- Template Dynamic Meeting Pages Container -->
        <div id="meetingPages"></div>
    </main>

    <script>
        // Insert meetingData & teacherSupport arrays here when generating a level lesson plan
        const meetingData = [];
        const teacherSupport = {};

        function headerMarkup() {
            return `<div class="page-header" aria-hidden="true">
                <img src="../marketing/kalananti_logo.png" alt="Kalananti Logo">
                <div class="brand-ribbons"><span class="top-stripe"></span><span class="dots"></span></div>
            </div>`;
        }

        function footerMarkup(label) {
            return `<div class="page-footer" aria-hidden="true"><div class="footer-meta"><span>${label}</span><span data-page-number></span></div><div class="footer-stripe"></div></div>`;
        }

        function sessionHeading(m, partLabel) {
            return `<div style="margin-bottom:2.5mm">
                <p style="color:var(--teal); font-weight:800; font-size:8pt; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:0.5mm">${m.unit} · ${partLabel}</p>
                <h1>Pertemuan ${m.id} · ${m.title}</h1>
                <p style="color:var(--muted); font-size:8.5pt; font-weight:600">${m.focus} · Durasi: 90 Menit</p>
            </div>`;
        }

        function escapeText(val) {
            return String(val)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function timelineMarkup(rows) {
            return `<table class="doc-table">
                <thead><tr><th class="time-col">Durasi</th><th class="activity-col">Tahap</th><th>Aktivitas Pengajar &amp; Siswa</th><th>Checkpoint Pengajar</th></tr></thead>
                <tbody>${rows.map(row => `<tr><td class="time-col">${row[0]}</td><td><strong>${row[1]}</strong></td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join("")}</tbody>
            </table>`;
        }

        function meetingPages(m) {
            const support = teacherSupport[m.id] || { questions: [], demo: [], review: "" };
            const objectives = m.objectives.map(x => `<li>${x}</li>`).join("");
            const prep = m.preparation.map(x => `<li>${x}</li>`).join("");
            const studentPrep = m.studentPrep.map(x => `<li>${x}</li>`).join("");
            const technical = m.technical.map(x => `<li>${x}</li>`).join("");
            const vocab = m.vocab.map(x => `<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("");
            const misconceptions = m.misconceptions.map(x => `<li>${x}</li>`).join("");
            const learned = m.learned.map(x => `<li>${x}</li>`).join("");

            return `
                <!-- Meeting ${m.id} Page 1: Overview & Technical Notes -->
                <section class="page" id="meeting-${m.id}-p1">
                    <div class="page-body">
                        ${headerMarkup()}
                        ${sessionHeading(m, "Persiapan & Catatan Teknis")}
                        
                        <span class="badge-highlight">Objektif Pembelajaran</span>
                        <div style="background:var(--yellow-pale); border-left:2.5mm solid var(--yellow); padding:2mm 3mm; border-radius:2mm; margin-bottom:2.5mm">
                            <ol style="margin:0; padding-left:4mm">${objectives}</ol>
                        </div>

                        <div class="grid-2">
                            <div class="doc-card yellow-border">
                                <h4>Bekal Prasyarat Siswa</h4>
                                <p><strong>Sebelumnya:</strong> ${m.prior}</p>
                                <ul class="checklist">${studentPrep}</ul>
                            </div>
                            <div class="doc-card blue-border">
                                <h4>Target Hasil Pertemuan</h4>
                                <p>${m.product}</p>
                                <p><strong>Bukti:</strong> File berjalan, siswa paham konsep, &amp; checkpoint terpenuhi.</p>
                            </div>
                        </div>

                        <div style="margin-top:2.5mm" class="grid-2">
                            <div class="doc-card teal-border">
                                <h4>Persiapan Pengajar</h4>
                                <ul class="checklist">${prep}</ul>
                            </div>
                            <div class="doc-card blue-border">
                                <h4>Perlengkapan &amp; File</h4>
                                <ul class="checklist">
                                    ${m.materials.map(x => `<li>${escapeText(x)}</li>`).join("")}
                                    <li>File demo sebelum/sesudah perbaikan bug.</li>
                                    <li>Screenshot expected result.</li>
                                </ul>
                            </div>
                        </div>

                        <span style="margin-top:3mm" class="badge-highlight">Catatan Teknis &amp; Konsep Utama</span>
                        <div class="doc-card">
                            <ul style="margin:0; padding-left:4mm">${technical}</ul>
                        </div>

                        <div class="code-box">
                            <div class="code-header">Pola Kode Penjelasan / Referensi Pengajar</div>
                            <pre>${escapeText(m.code)}</pre>
                        </div>

                        <div class="callout teal" style="margin-bottom:0">
                            <strong>Expected Behavior / Output:</strong> ${m.expected}
                        </div>
                    </div>
                    ${footerMarkup(`Pertemuan ${m.id} · Persiapan &amp; Catatan Teknis`)}
                </section>

                <!-- Meeting ${m.id} Page 2: Teaching Flow & Assessment -->
                <section class="page" id="meeting-${m.id}-p2">
                    <div class="page-body">
                        ${headerMarkup()}
                        ${sessionHeading(m, "Alur Mengajar 90 Menit &amp; Asesmen")}

                        <span class="badge-highlight">Main Activity · Pemanasan &amp; Konsep (40 Menit)</span>
                        ${timelineMarkup(m.part1)}

                        <span class="badge-highlight">Main Activity · Latihan &amp; Praktek (50 Menit)</span>
                        ${timelineMarkup(m.part2)}

                        <div class="grid-2" style="margin-top:1.5mm">
                            <div class="doc-card yellow-border">
                                <h4>Istilah Kunci (Glossary)</h4>
                                <dl class="vocab-grid">${vocab}</dl>
                            </div>
                            <div class="doc-card blue-border">
                                <h4>Miskonsepsi &amp; Diagnosis Bug</h4>
                                <ul style="margin:0; padding-left:3.5mm">${misconceptions}</ul>
                            </div>
                        </div>

                        <div class="lesson-learned" style="margin-top:2mm">
                            <h4>Poin Kunci Pembelajaran (Lesson Learned)</h4>
                            <ul style="margin:0; padding-left:3.5mm">${learned}</ul>
                        </div>

                        <div class="grid-2" style="margin-top:2mm">
                            <div class="doc-card">
                                <h4>Bukti Asesmen &amp; Diferensiasi</h4>
                                <p><strong>Bukti:</strong> ${m.assess}</p>
                                <p><strong>Diferensiasi:</strong> ${m.differentiation}</p>
                            </div>
                            <div class="doc-card">
                                <h4>Aktivitas &amp; Penutup</h4>
                                <p><strong>Kunci Review:</strong> ${support.review || "Evaluasi dengan active recall."}</p>
                                <p><strong>Tindak Lanjut:</strong> ${m.home}</p>
                            </div>
                        </div>
                    </div>

                    ${footerMarkup(`Pertemuan ${m.id} · Alur Mengajar &amp; Asesmen`)}
                </section>
            `;
        }

        const meetingPagesHost = document.getElementById("meetingPages");
        meetingPagesHost.innerHTML = meetingData.map(meetingPages).join("");

        document.querySelectorAll(".page").forEach((page, index) => {
            page.querySelectorAll("[data-page-number]").forEach(node => {
                node.textContent = String(index + 1);
            });
        });
    </script>
</body>
</html>
