        "title": "Sistem Cahaya RGB \ud83d\udca1",
        "subtitle": "Red, Green, Blue",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Layar Laptop/HP tidak menggunakan cat air pelangi, melainkan jutaan lampu LED super kecil yang terdiri dari 3 warna dasar:\n        </p>\n        <div class=\"flex gap-4 items-center\">\n            <div class=\"w-10 h-10 bg-red-500 rounded-full shadow-[0_0_15px_red]\"></div>\n            <p class=\"font-bold font-mono text-red-600 text-xl\">RED</p>\n        </div>\n        <div class=\"flex gap-4 items-center\">\n            <div class=\"w-10 h-10 bg-green-500 rounded-full shadow-[0_0_15px_lime]\"></div>\n            <p class=\"font-bold font-mono text-green-600 text-xl\">GREEN</p>\n        </div>\n        <div class=\"flex gap-4 items-center\">\n            <div class=\"w-10 h-10 bg-blue-500 rounded-full shadow-[0_0_15px_blue]\"></div>\n            <p class=\"font-bold font-mono text-blue-600 text-xl\">BLUE</p>\n        </div>\n        <p class=\"text-sm text-slate-500 italic mt-4\">*Semua jutaan warna di dunia digital adalah gabungan dari terang-redupnya ketiga lampu tersebut!</p>\n    </div>\n    \n    <div class=\"bg-slate-900 h-64 rounded-xl border-4 border-slate-700 relative overflow-hidden shadow-2xl flex items-center justify-center mix-blend-screen isolate\">\n        <div class=\"w-32 h-32 bg-red-500 rounded-full absolute mix-blend-screen transform -translate-y-6 blur-[2px]\"></div>\n        <div class=\"w-32 h-32 bg-green-500 rounded-full absolute mix-blend-screen transform translate-x-8 translate-y-6 blur-[2px]\"></div>\n        <div class=\"w-32 h-32 bg-blue-500 rounded-full absolute mix-blend-screen transform -translate-x-8 translate-y-6 blur-[2px]\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Meteran Skala RGB \ud83c\udf9a\ufe0f",
        "subtitle": "Dari 0 Sampai 255",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative text-center\">\n        <p class=\"text-xl text-slate-700 mb-6 font-bold\">\n            Setiap lampu (Red, Green, Blue) memiliki tingkat kecerahan dari <span class=\"bg-slate-200 px-2 rounded\">0 (Mati Gelap)</span> hingga <span class=\"bg-slate-800 text-white px-2 rounded\">255 (Nyala Maksimal)</span>.\n        </p>\n        \n        <div class=\"space-y-4 max-w-xl mx-auto font-mono bg-slate-50 p-6 rounded-2xl border border-slate-200 text-left\">\n            <div class=\"flex items-center gap-4\">\n                <p class=\"w-24 text-right\">Merah (R):</p>\n                <div class=\"h-4 flex-1 bg-gradient-to-r from-black to-red-500 rounded-full\"></div>\n                <p>255</p>\n            </div>\n            <div class=\"flex items-center gap-4\">\n                <p class=\"w-24 text-right\">Hijau (G):</p>\n                <div class=\"h-4 flex-1 bg-gradient-to-r from-black to-green-500 rounded-full\"></div>\n                <p>255</p>\n            </div>\n            <div class=\"flex items-center gap-4\">\n                <p class=\"w-24 text-right\">Biru (B):</p>\n                <div class=\"h-4 flex-1 bg-gradient-to-r from-black to-blue-500 rounded-full\"></div>\n                <p>255</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Laboratorium RGB \ud83e\uddea",
        "subtitle": "Racik Warnamu Sendiri",
        "content": "<div class=\"max-w-4xl mx-auto mt-2 bg-slate-900 p-8 rounded-3xl border-4 border-slate-700\">\n    <div class=\"grid grid-cols-2 gap-8\">\n        <div class=\"flex flex-col gap-6 justify-center text-white font-mono\">\n            <div>\n                <label>R: <span id=\"r-val\" class=\"text-red-400\">255</span></label>\n                <input type=\"range\" id=\"r-slider\" min=\"0\" max=\"255\" value=\"255\" class=\"w-full accent-red-500\" oninput=\"updateRGB()\">\n            </div>\n            <div>\n                <label>G: <span id=\"g-val\" class=\"text-green-400\">0</span></label>\n                <input type=\"range\" id=\"g-slider\" min=\"0\" max=\"255\" value=\"0\" class=\"w-full accent-green-500\" oninput=\"updateRGB()\">\n            </div>\n            <div>\n                <label>B: <span id=\"b-val\" class=\"text-blue-400\">0</span></label>\n                <input type=\"range\" id=\"b-slider\" min=\"0\" max=\"255\" value=\"0\" class=\"w-full accent-blue-500\" oninput=\"updateRGB()\">\n            </div>\n            <p class=\"text-xs text-slate-400 mt-2\">*Coba nyalakan R:255 dan G:255 secara bersamaan!</p>\n        </div>\n        <div class=\"flex flex-col items-center justify-center\">\n            <div id=\"rgb-box\" class=\"w-40 h-40 rounded-3xl shadow-[0_0_30px_rgba(255,0,0,0.5)] bg-[rgb(255,0,0)] transition-colors duration-100 border-4 border-slate-500\"></div>\n            <p id=\"rgb-text\" class=\"mt-6 text-xl font-mono text-white bg-slate-800 px-4 py-2 rounded-xl border border-slate-600\">t.color(255, 0, 0)</p>\n        </div>\n    </div>\n    <script>\n        function updateRGB() {\n            let r = document.getElementById('r-slider').value;\n            let g = document.getElementById('g-slider').value;\n            let b = document.getElementById('b-slider').value;\n            \n            document.getElementById('r-val').innerText = r;\n            document.getElementById('g-val').innerText = g;\n            document.getElementById('b-val').innerText = b;\n            \n            let colorStr = `rgb(${r}, ${g}, ${b})`;\n            document.getElementById('rgb-box').style.backgroundColor = colorStr;\n            document.getElementById('rgb-box').style.boxShadow = `0 0 30px rgba(${r},${g},${b},0.5)`;\n            document.getElementById('rgb-text').innerText = `t.color(${r}, ${g}, ${b})`;\n        }\n    <\/script>\n</div>"
    },
    {
        "title": "Syntax: Aktifkan RGB \ud83d\udd13",
        "subtitle": "colormode(255)",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-red-50 p-6 rounded-2xl border border-red-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\u26a0\ufe0f</div>\n        <p class=\"text-md text-red-900 font-bold\">Penting: Secara default, turtle tidak mengenali angka RGB 0-255. Kita harus membukakan gerbang fiturnya terlebih dahulu!</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-pink-400 font-bold\">import</span> turtle<br>\n<br>\n<span class=\"text-slate-500\"># 1. Wajib aktifkan mode RGB (0 sampai 255)</span><br>\nturtle.<span class=\"text-yellow-400 font-bold\">colormode</span>(255)<br><br>\nt = turtle.Turtle()<br>\n<span class=\"text-slate-500\"># 2. Sekarang kalian bebas mencampur warna! (R, G, B)</span><br>\nt.<span class=\"text-yellow-400 font-bold\">color</span>(255, 0, 255) <span class=\"text-slate-500\"># Menjadi Magenta ungu</span>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 1 \ud83d\udd34",
        "subtitle": "Nyala Merah",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-red-600 shadow-[0_0_40px_red]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-red-400 font-bold mb-4\">t.color(255, 0, 0)</h4>\n            <p class=\"text-slate-400\">Merah menyala penuh. Hijau dan Biru mati total.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 2 \ud83d\udfe2",
        "subtitle": "Nyala Hijau",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-green-500 shadow-[0_0_40px_lime]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-green-400 font-bold mb-4\">t.color(0, 255, 0)</h4>\n            <p class=\"text-slate-400\">Hijau menyala penuh. Merah dan Biru mati total.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 3 \ud83d\udd35",
        "subtitle": "Nyala Biru",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-blue-600 shadow-[0_0_40px_blue]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-blue-400 font-bold mb-4\">t.color(0, 0, 255)</h4>\n            <p class=\"text-slate-400\">Biru menyala penuh. Merah dan Hijau mati total.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 4 \ud83d\udfe1",
        "subtitle": "Kuning (Yellow)",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-yellow-400 shadow-[0_0_40px_yellow]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-yellow-400 font-bold mb-4\">t.color(255, 255, 0)</h4>\n            <p class=\"text-slate-400\">Campuran Merah + Hijau di dunia cahaya akan menghasilkan Kuning Terang!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 5 \ud83d\udfe3",
        "subtitle": "Ungu (Magenta)",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-fuchsia-500 shadow-[0_0_40px_fuchsia]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-fuchsia-400 font-bold mb-4\">t.color(255, 0, 255)</h4>\n            <p class=\"text-slate-400\">Campuran Merah + Biru menghasilkan warna Ungu / Magenta.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 6 \ud83e\uddca",
        "subtitle": "Cyan (Biru Muda)",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-cyan-400 shadow-[0_0_40px_cyan]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-cyan-400 font-bold mb-4\">t.color(0, 255, 255)</h4>\n            <p class=\"text-slate-400\">Campuran Hijau + Biru menghasilkan warna Cyan segar!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kombinasi RGB 7 \u26aa",
        "subtitle": "Putih Menyilaukan",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"bg-slate-900 p-8 rounded-3xl shadow-xl flex gap-8 items-center border-4 border-slate-700\">\n        <div class=\"w-48 h-48 rounded-full bg-white shadow-[0_0_60px_white]\"></div>\n        <div class=\"text-left font-mono\">\n            <h4 class=\"text-3xl text-white font-bold mb-4\">t.color(255, 255, 255)</h4>\n            <p class=\"text-slate-400\">Jika SEMUA lampu dinyalakan ke tingkat maksimal, layarmu akan putih menyilaukan!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Tebak Warna Campuran \ud83e\udde0",
        "subtitle": "Mini Quiz RGB",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <p class=\"font-bold text-slate-700 text-xl mb-4\"><code>t.color(0, 0, 0)</code></p>\n        <p class=\"text-md text-slate-600 mb-6\">Jika merah mati, hijau mati, dan biru mati. Warna apa yang terbentuk?</p>\n        <div class=\"grid grid-cols-2 gap-4\">\n            <button onclick=\"showMiniFeedback('qmrgb1', 'Salah! Jika lampu redup/mati semua, warnanya adalah hitam pekat.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl text-slate-400\">Putih Bersih</button>\n            <button onclick=\"showMiniFeedback('qmrgb1', 'BENAR! 0,0,0 adalah kode mutlak untuk warna HITAM.', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl text-black bg-slate-200\">Hitam Pekat</button>\n        </div>\n        <div id=\"qmrgb1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Mewarnai Layar Layar \ud83c\udf0c",
        "subtitle": "bgcolor()",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Tidak hanya pena kura-kura, warna kertas layarnya juga bisa diubah! Sangat berguna untuk menggambar Luar Angkasa (background hitam) atau Dasar Laut (biru gelap).</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-pink-400 font-bold\">import</span> turtle<br>\nturtle.colormode(255)<br><br>\n<span class=\"text-slate-500\"># Merubah warna layar utama (Langit Malam)</span><br>\nlayar = turtle.Screen()<br>\nlayar.<span class=\"text-yellow-400 font-bold\">bgcolor</span>(\"black\")<br>\n<span class=\"text-slate-500\"># Atau pakai RGB: layar.bgcolor(10, 10, 50)</span><br>\n    </div>\n</div>"
    },
    {
        "title": "Garis & Isi Berbeda! \ud83d\udd8c\ufe0f",
        "subtitle": "Trik 2 Parameter",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200\">\n        <p class=\"text-lg text-amber-900 font-medium\">Selama ini <code>t.color(\"red\")</code> merubah spidol dan ember cat menjadi merah sekaligus. Bagaimana jika kita ingin tepi garisnya merah, tapi isinya biru?</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># color(warna_tepi_garis, warna_isi_dalam)</span><br>\nt.<span class=\"text-yellow-400 font-bold\">color</span>(<span class=\"text-green-400\">\"red\"</span>, <span class=\"text-blue-400\">\"blue\"</span>)<br>\nt.pensize(5)<br><br>\nt.begin_fill()<br>\nt.circle(50)<br>\nt.end_fill()\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi 2 Parameter Color \ud83c\udfac",
        "subtitle": "Tepi Merah, Isi Biru",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-white h-[250px] border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex items-center justify-center\">\n        \n        <div class=\"text-left font-mono text-sm font-bold text-slate-500 mr-12 bg-slate-100 p-4 rounded-xl border border-slate-200 shadow\">\n            t.color(<span class=\"text-red-500\">\"red\"</span>, <span class=\"text-blue-500\">\"blue\"</span>)<br>\n            t.pensize(10)<br>\n            t.begin_fill()<br>\n            t.circle(50)<br>\n            t.end_fill()\n        </div>\n        \n        <div class=\"w-32 h-32 rounded-full border-[10px] border-red-500 bg-blue-500 shadow-xl relative animate-[spin_4s_linear_infinite]\">\n            <div class=\"absolute -top-6 left-1/2 -translate-x-1/2 text-2xl drop-shadow transform rotate-90\">\ud83d\udc22</div>\n        </div>\n        \n    </div>\n</div>"
    },
    {
        "title": "Jurus Menghilang \ud83e\udd77",
        "subtitle": "hideturtle()",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Terkadang, bentuk kura-kura yang diam di tengah layar sangat mengganggu hasil akhir lukisan kita. Singkirkan saja!</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># Setelah lukisan selesai...</span><br>\nt.end_fill()<br><br>\n<span class=\"text-slate-500\"># Sembunyikan ikon Kura-kura/Panahnya</span><br>\nt.<span class=\"text-yellow-400 font-bold\">hideturtle()</span><br><br>\n<span class=\"text-slate-500 text-sm\"># Note: Meski sembunyi, dia tetap bisa jalan dan nyoret!</span><br>\n<span class=\"text-slate-500 text-sm\"># Untuk memunculkannya lagi: t.showturtle()</span>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Langit Malam Berbintang",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83c\udf03</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kakak Pengajar akan memandu menggambar sebuah bintang kuning terang bersinar di tengah malam yang gelap pekat. <br><br>Buka IDE kalian sekarang!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Ikuti Kodenya! \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Langkah 1: Suasana Malam",
        "subtitle": "Setup Environment",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\nimport turtle<br>\nturtle.colormode(255)<br><br>\n<span class=\"text-slate-400\"># 1. Gelapkan langit layar</span><br>\nlayar = turtle.Screen()<br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">layar.bgcolor(\"black\")</span><br>\n<br>\nt = turtle.Turtle()<br>\nt.speed(0)<br>\n<span class=\"text-slate-400\"># 2. Garis kuning, Isi kuning</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.color(255, 255, 0)</span>\n    </div>\n    <div class=\"bg-black h-full border-2 border-slate-600 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center\">\n        <div class=\"text-4xl opacity-50 drop-shadow-[0_0_10px_yellow]\">\ud83d\udc22</div>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 2: Cahaya Bintang",
        "subtitle": "For loop bintang",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\n<span class=\"text-slate-400\"># Lanjutan kode tadi...</span><br><br>\nt.begin_fill()<br>\n<br>\n<span class=\"text-slate-400\"># Bintang 5 Sudut</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">for i in range(5):</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded pl-4\">&nbsp;&nbsp;t.forward(150)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded pl-4\">&nbsp;&nbsp;t.right(144)</span><br>\n<br>\nt.end_fill()<br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded mt-2\">t.hideturtle()</span>\n    </div>\n    <div class=\"bg-black h-full border-2 border-slate-600 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center\">\n        <!-- SVG Star simulation -->\n        <svg class=\"w-32 h-32 fill-yellow-400 drop-shadow-[0_0_20px_yellow]\" viewBox=\"0 0 24 24\"><path d=\"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z\"/></svg>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Target Panahan (Archery)",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm flex items-start gap-6\">\n        <div class=\"text-5xl\">\ud83c\udfaf</div>\n        <div>\n            <h4 class=\"font-black text-xl text-red-700 mb-2\">Misi Pemanah Jitu:</h4>\n            <p class=\"text-slate-600 font-medium leading-relaxed\">\n                Buatlah 3 lingkaran yang saling menumpuk dari yang BESAR di belakang, mengecil di depan layaknya papan target panahan!\n            </p>\n            <ul class=\"list-disc pl-5 mt-4 text-sm text-slate-700 space-y-2 font-bold bg-slate-50 p-4 rounded-xl border border-slate-200\">\n                <li>Lingkaran luar: <code>circle(100)</code> dengan warna <b>Merah (255,0,0)</b>.</li>\n                <li>Lingkaran tengah: <code>circle(75)</code> dengan warna <b>Putih (255,255,255)</b>.</li>\n                <li>Lingkaran dalam (Mata sapi): <code>circle(40)</code> dengan warna <b>Merah</b>.</li>\n                <li><span class=\"text-red-500\">Trik Kunci:</span> Lingkaran digambar mulai dari pinggir luar. Agar bentuknya pas bertumpuk konsentris di tengah, setiap menggambar kamu harus angkat pena `penup()`, geser maju/ke atas `goto(0, y)`, lalu turunkan lagi!</li>\n            </ul>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Jurus Kloning Bayangan \ud83e\udd77",
        "subtitle": "t.stamp()",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Selain garis lurus pena, Turtle bisa \"Meninggalkan Stempel\" dari wujud badannya sendiri di atas kertas. Sangat berguna untuk membuat pola titik-titik tapak kaki!</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\nt.shape(\"turtle\")<br>\nt.penup() <span class=\"text-slate-500\"># Angkat spidol agar garis tak kelihatan</span><br><br>\n<span class=\"text-yellow-400 font-bold\">for</span> i <span class=\"text-yellow-400 font-bold\">in</span> range(5):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.forward(50)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.<span class=\"text-yellow-400 font-bold\">stamp()</span> <span class=\"text-slate-500\"># Ngecap badan kura-kura persis!</span>\n    </div>\n</div>"

        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 text-left mt-6\">\n    <div class=\"bg-blue-50 p-8 rounded-3xl shadow-sm border border-blue-200\">\n        <h4 class=\"font-black text-xl text-blue-800 mb-4 font-mono\">t.clear()</h4>\n        <p class=\"text-md text-blue-900 leading-relaxed font-medium\">Hanya menghapus semua coretan spidol (seperti mengelap papan tulis). Turtle <b class=\"text-red-500\">TETAP</b> berada di posisinya saat ini dan modifikasi warnanya tidak hilang.</p>\n    </div>\n    <div class=\"bg-red-50 p-8 rounded-3xl shadow-sm border border-red-200\">\n        <h4 class=\"font-black text-xl text-red-800 mb-4 font-mono\">t.reset()</h4>\n        <p class=\"text-md text-red-900 leading-relaxed font-medium\">Reset total pabrik! Layar bersih, Turtle <b>terlempar kembali</b> ke titik tengah `(0,0)`, dan semua warna/bentuknya ter-reset ke panah hitam tipis standar.</p>\n    </div>\n</div>"

        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <p class=\"text-lg text-slate-700\">Jika kita memasukkan <code>random.randint(0, 255)</code> ke dalam colormode RGB, kura-kura akan berganti warna secara gacha tanpa bisa kita tebak!</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-2\">\nimport turtle<br>\nimport random<br>\nturtle.colormode(255)<br><br>\n<span class=\"text-slate-500\"># Meracik warna r, g, b acak masing-masing 0 - 255</span><br>\nr = random.randint(0, 255)<br>\ng = random.randint(0, 255)<br>\nb = random.randint(0, 255)<br><br>\nt.color(r, g, b) <span class=\"text-slate-500\"># Voila! Warnanya tak terprediksi!</span>\n    </div>\n</div>"

        "subtitle": "For Loop 100 & Gacha Warna",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-2\">\n    <div class=\"bg-slate-900 text-white p-4 rounded-2xl font-mono text-xs h-[380px] shadow-2xl border border-slate-700 leading-relaxed overflow-y-auto\">\nimport turtle, random<br>\nturtle.colormode(255)<br>\nt = turtle.Turtle()<br>\nt.speed(0)<br>\nt.penup() <span class=\"text-slate-400\"># Penting agar tidak ada garis</span><br><br>\nfor i in range(100):<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># 1. Warna Gacha</span><br>\n&nbsp;&nbsp;r = random.randint(0,255)<br>\n&nbsp;&nbsp;g = random.randint(0,255)<br>\n&nbsp;&nbsp;b = random.randint(0,255)<br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 bg-yellow-400/10 block w-max p-1 rounded mt-1\">t.color(r, g, b)</span><br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-blue-700 mb-2\">Fase 1: Warna</h4>\n        <p class=\"text-sm text-slate-600\">Di dalam loop 100 putaran, setiap kali berputar, kura-kura akan mengeksekusi random randint untuk mencari warna RGB baru yang fresh!</p>\n    </div>\n</div>"

        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-k-blue h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Sistem RGB & Warna</h4>\n            <ul class=\"text-sm font-mono text-slate-600 space-y-2 leading-relaxed mt-2\">\n                <li><span class=\"text-blue-500 font-bold\">turtle.colormode(255)</span><br><span class=\"text-xs font-sans italic opacity-70\">Wajib untuk akses rgb gacha</span></li>\n                <li><span class=\"text-blue-500 font-bold\">t.color(r, g, b)</span> atau <span class=\"text-blue-500 font-bold\">color(\"red\", \"blue\")</span></li>\n                <li><span class=\"text-blue-500 font-bold\">turtle.bgcolor(\"black\")</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200 flex flex-col justify-center\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Gacha & Manipulasi</h4>\n            <ul class=\"text-sm font-mono text-slate-600 space-y-2 leading-relaxed mt-2\">\n                <li><span class=\"text-blue-500 font-bold\">random.randint(0, 255)</span><br><span class=\"text-xs font-sans italic opacity-70\">Angka acak dari modul import random</span></li>\n                <li><span class=\"text-blue-500 font-bold\">t.stamp()</span> <span class=\"text-xs font-sans opacity-70 inline-block ml-2\">Cap clone kursor</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200 col-span-2\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Utilitas & Tulisan</h4>\n            <ul class=\"text-sm font-mono text-slate-600 space-y-2 mt-2 flex justify-between\">\n                <li><span class=\"text-red-500 font-bold\">t.clear() / t.reset()</span> <span class=\"text-xs font-sans opacity-70\">Hapus coretan</span></li>\n                <li><span class=\"text-blue-500 font-bold\">t.hideturtle()</span> <span class=\"text-xs font-sans opacity-70\">Sembunyi</span></li>\n                <li><span class=\"text-purple-500 font-bold\">t.write(\"Teks\", font=...)</span> <span class=\"text-xs font-sans opacity-70\">Nulis</span></li>\n            </ul>\n        </div>\n    </div>\n</div>"

        "title": "Flashback 1: Kode Pembuka \ud83d\udd13",
        "subtitle": "Aktifkan RGB",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Sebelum menggunakan angka 0-255 untuk RGB, kode apa yang WAJIB kita jalankan pertama kali?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb1', 'Salah! Tidak ada mode rgb_mode.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold font-mono hover:bg-slate-50\">turtle.rgb_mode(True)</button>\n            <button onclick=\"showMiniFeedback('fb1', 'BENAR! colormode 255 membuka pintu sihir angka warna!', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold font-mono hover:bg-slate-50\">turtle.colormode(255)</button>\n        </div>\n        <div id=\"fb1\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 2: Tebak Warna \ud83d\udca1",
        "subtitle": "Merah, Hijau, Biru",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-xl font-mono text-xl shadow-lg border border-slate-700 text-center font-bold\">\nt.color(255, 255, 0)\n    </div>\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Jika Merah menyala penuh (255), Hijau menyala penuh (255), dan Biru mati (0). Warna cahaya apa yang tercipta?</p>\n        <div class=\"grid grid-cols-2 gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb2', 'BENAR! Cahaya Merah + Hijau menghasilkan Kuning Terang!', 'success')\" class=\"p-3 border-2 border-yellow-400 rounded-lg font-bold hover:bg-yellow-50 text-xl text-yellow-600\">Kuning</button>\n            <button onclick=\"showMiniFeedback('fb2', 'Salah! Biru dicampur merah barulah menghasilkan Ungu/Magenta.', 'error')\" class=\"p-3 border-2 border-purple-400 rounded-lg font-bold hover:bg-purple-50 text-xl text-purple-600\">Ungu</button>\n        </div>\n        <div id=\"fb2\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 3: Dadu Gacha \ud83c\udfb2",
        "subtitle": "Memilih Angka Acak",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Fungsi apa dari library `random` yang kita gunakan untuk mengocok angka acak?</p>\n        <div class=\"grid grid-cols-2 gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb3', 'BENAR! randint adalah singkatan dari Random Integer.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-xl font-mono\">random.randint(1, 10)</button>\n            <button onclick=\"showMiniFeedback('fb3', 'Salah! Fungsi choice digunakan untuk memilih isi List, bukan angka jarak.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-xl font-mono\">random.choice(1, 10)</button>\n        </div>\n        <div id=\"fb3\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 4: Latar Belakang Layar \ud83c\udf0c",
        "subtitle": "Warna Kanvas",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Bagaimana cara kita membuat langit malam yang gelap gulita di kanvas Turtle?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb4', 'Salah! background_color tidak ada di fungsi bawaan python.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">turtle.background_color(\"black\")</button>\n            <button onclick=\"showMiniFeedback('fb4', 'BENAR! singkatan dari background color adalah bgcolor.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">turtle.Screen().bgcolor(\"black\")</button>\n        </div>\n        <div id=\"fb4\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 5: Kloning Tubuh \ud83e\udd77",
        "subtitle": "Meninggalkan Jejak",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Apa fungsi dari perintah <code>t.stamp()</code>?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb5', 'BENAR! t.stamp() akan mengecap/mengkloning bentuk kura-kura persis di posisi kakinya berpijak.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-left\">Mencetak jejak gambar kura-kura di layar.</button>\n            <button onclick=\"showMiniFeedback('fb5', 'Salah! Untuk menghapus adalah t.clear().', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-left\">Menghapus layar dengan bersih.</button>\n        </div>\n        <div id=\"fb5\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Capek Nulis Ulang? \ud83d\ude2b",
        "subtitle": "Masalah Kuli Koding",
        "content": "<div class=\"max-w-4xl mx-auto text-center space-y-6 mt-6\">\n    <div class=\"text-7xl mb-4\">\ud83e\uddf1</div>\n    <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n        Pernahkah kamu membuat sebuah bentuk segi sepuluh? Bayangkan kamu harus menulis `t.forward(50)` dan `t.right(36)` sebanyak <b>10 kali</b> ke bawah!\n    </p>\n    <div class=\"bg-red-50 border-l-4 border-red-500 p-6 rounded-r-xl text-left shadow-sm mt-8\">\n        <p class=\"text-md text-red-900 font-bold mb-2 font-mono\">Kuli Koding:</p>\n        <div class=\"font-mono text-sm text-red-800 space-y-1 ml-4 opacity-70\">\n            <p>t.forward(50)<br>t.right(36)<br>t.forward(50)<br>t.right(36)<br>t.forward(50)<br>t.right(36)<br>...</p>\n        </div>\n        <p class=\"mt-4 text-sm font-bold text-red-900\">Kode sangat panjang, tidak elegan, dan buang-buang tenaga!</p>\n    </div>\n</div>"
    },
    {
        "title": "Konsep For Loop \ud83e\udd16",
        "subtitle": "Pekerja Pabrik",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-2xl font-black text-slate-800\">For Loop adalah Mesin Fotokopi</h3>\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Di kehidupan nyata, mesin pabrik atau mesin fotokopi dapat menyalin ribuan dokumen dengan satu tombol angka: \"Fotokopi 100x\".\n        </p>\n        <p class=\"text-md text-slate-600 bg-blue-50 p-4 rounded-xl border border-blue-200 mt-4\">\n            Dalam Python, <b>For Loop</b> adalah perintah untuk menyuruh komputer mengulang baris kode yang sama sebanyak yang kita tentukan, secara kilat!\n        </p>\n    </div>\n    <div class=\"bg-slate-100 h-64 rounded-xl border-4 border-slate-300 relative overflow-hidden shadow-inner flex items-center justify-center\">\n        <!-- CSS Animation of copying boxes -->\n        <style>\n            @keyframes boxMove {\n                0% { transform: translateY(-50px) scale(0); opacity: 0; }\n                20% { transform: translateY(0) scale(1); opacity: 1; }\n                80% { transform: translateY(0) scale(1); opacity: 1; }\n                100% { transform: translateY(50px) scale(0); opacity: 0; }\n            }\n            .box-anim { animation: boxMove 2s infinite linear; }\n            .d1 { animation-delay: 0s; }\n            .d2 { animation-delay: 0.5s; }\n            .d3 { animation-delay: 1.0s; }\n            .d4 { animation-delay: 1.5s; }\n        </style>\n        <div class=\"relative w-32 h-32 bg-blue-500 rounded-xl shadow-lg border-[6px] border-blue-700 flex items-center justify-center text-4xl text-white font-bold z-10\">MESIN</div>\n        <div class=\"absolute w-16 h-16 bg-white border-2 border-blue-300 rounded shadow-sm flex items-center justify-center box-anim d1 left-[40%] top-[70%]\">\ud83d\udcc4</div>\n        <div class=\"absolute w-16 h-16 bg-white border-2 border-blue-300 rounded shadow-sm flex items-center justify-center box-anim d2 left-[40%] top-[70%]\">\ud83d\udcc4</div>\n        <div class=\"absolute w-16 h-16 bg-white border-2 border-blue-300 rounded shadow-sm flex items-center justify-center box-anim d3 left-[40%] top-[70%]\">\ud83d\udcc4</div>\n        <div class=\"absolute w-16 h-16 bg-white border-2 border-blue-300 rounded shadow-sm flex items-center justify-center box-anim d4 left-[40%] top-[70%]\">\ud83d\udcc4</div>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Kuli vs Mesin \ud83c\udfac",
        "subtitle": "Loop in Action",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-white h-[250px] border-4 border-red-300 rounded-2xl p-4 shadow-sm flex flex-col items-center\">\n            <h4 class=\"font-bold text-red-600 mb-2\">Manual Koding</h4>\n            <div class=\"font-mono text-xs text-left w-full bg-slate-100 p-2 rounded h-[180px] overflow-y-hidden text-slate-500 border border-slate-200\">\n                t.forward(50)<br>t.right(90)<br>\n                t.forward(50)<br>t.right(90)<br>\n                t.forward(50)<br>t.right(90)<br>\n                t.forward(50)<br>t.right(90)<br>\n            </div>\n        </div>\n        \n        <div class=\"bg-slate-900 h-[250px] border-4 border-green-500 rounded-2xl p-4 shadow-xl flex flex-col items-center group\">\n            <h4 class=\"font-bold text-green-400 mb-2\">FOR LOOP \u26a1</h4>\n            <div class=\"font-mono text-sm text-left w-full bg-black p-4 rounded text-white border border-slate-700\">\n                <span class=\"text-yellow-400 font-bold\">for</span> i <span class=\"text-yellow-400 font-bold\">in</span> range(<span class=\"text-green-400\">4</span>):<br>\n                &nbsp;&nbsp;&nbsp;&nbsp;t.forward(50)<br>\n                &nbsp;&nbsp;&nbsp;&nbsp;t.right(90)\n            </div>\n            <div class=\"mt-4 text-xs font-bold text-green-300 animate-pulse w-full bg-green-900/50 p-2 rounded\">Cuma butuh 3 baris kode! Sangat efisien!</div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Syntax: For Loop \ud83d\udcdc",
        "subtitle": "Bahasa Robot",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-xl shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-yellow-400 font-bold\">for</span> i <span class=\"text-yellow-400 font-bold\">in</span> range(<span class=\"text-green-400 font-bold text-2xl\">X</span>)<span class=\"text-red-500 font-bold\">:</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.forward(100)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.right(90)\n    </div>\n    <div class=\"grid grid-cols-3 gap-4 mt-6\">\n        <div class=\"bg-blue-50 p-4 rounded-xl border border-blue-200 text-sm\">\n            <p><span class=\"font-bold text-blue-800\">for i in range</span><br>Ini adalah kata kunci sakti untuk memutar mesin Loop.</p>\n        </div>\n        <div class=\"bg-green-50 p-4 rounded-xl border border-green-200 text-sm\">\n            <p><span class=\"font-bold text-green-800\">X (Angka)</span><br>Berapa kali kamu ingin kode di bawahnya diulang secara otomatis?</p>\n        </div>\n        <div class=\"bg-red-50 p-4 rounded-xl border border-red-200 text-sm\">\n            <p><span class=\"font-bold text-red-800\">Titik Dua (:)</span><br>WAJIB ada di akhir baris Loop. Tanpa ini, Python akan error (SyntaxError).</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Aturan Emas: Indentasi \ud83d\udccf",
        "subtitle": "Tab = Bawahan",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\u26a0\ufe0f</div>\n        <p class=\"text-md text-amber-900 font-medium\">Bagaimana cara Python membedakan kode mana yang HARUS DIULANG dan mana yang TIDAK? Jawabannya adalah <b class=\"font-black\">Indentasi (Menjorok ke dalam / tombol Tab)</b>.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-4\">\nfor i in range(4):<br>\n<div class=\"bg-green-500/20 px-2 rounded -ml-2\"><span class=\"text-green-400\">----</span>t.forward(100) <span class=\"text-slate-400\"># Masuk Loop (Diulang)</span></div>\n<div class=\"bg-green-500/20 px-2 rounded -ml-2\"><span class=\"text-green-400\">----</span>t.right(90) &nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Masuk Loop (Diulang)</span></div>\n<br>\nt.color(\"red\") &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Tidak Diulang! (Berada di luar/kiri)</span>\n    </div>\n</div>"
    },
    {
        "title": "Tebak Error Indentasi \ud83d\udd75\ufe0f\u200d\u2642\ufe0f",
        "subtitle": "Manakah yang Benar?",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <p class=\"text-md text-slate-600 mb-6 font-bold\">Di antara 2 penulisan kode ini, mana yang akan menyebabkan pesan merah `IndentationError`?</p>\n        <div class=\"grid grid-cols-2 gap-8 text-left font-mono\">\n            <button onclick=\"showMiniFeedback('qi1', 'Salah! Kode A benar secara penulisan indentasi.', 'error')\" class=\"p-6 border-2 border-slate-200 rounded-xl hover:bg-slate-50\">\n                <p class=\"font-sans font-bold text-center mb-2 border-b pb-2\">KODE A</p>\n                for i in range(3):<br>\n                &nbsp;&nbsp;&nbsp;&nbsp;t.forward(50)<br>\n                &nbsp;&nbsp;&nbsp;&nbsp;t.circle(20)\n            </button>\n            <button onclick=\"showMiniFeedback('qi1', 'BENAR! Kode B error karena perintah forward tidak menjorok ke dalam (Tab).', 'success')\" class=\"p-6 border-2 border-slate-200 rounded-xl hover:bg-slate-50\">\n                <p class=\"font-sans font-bold text-center mb-2 border-b pb-2\">KODE B</p>\n                for i in range(3):<br>\n                t.forward(50)<br>\n                t.circle(20)\n            </button>\n        </div>\n        <div id=\"qi1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold text-xl\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Masalah Indentasi Lainnya \ud83d\udc1b",
        "subtitle": "Menjorok Tanggung",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-red-50 p-6 rounded-2xl border border-red-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udea8</div>\n        <p class=\"text-md text-red-900 font-medium\">Hati-hati! Python sangat sensitif terhadap spasi. Jika kamu mencampur spasi dan tab, atau spasinya kurang rata, program akan mogok!</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-4\">\nfor i in range(2):<br>\n<span class=\"text-red-500 bg-red-900/30 px-2 rounded -ml-2\">--t.forward(100) <span class=\"text-slate-400\"># Cuma 2 spasi</span></span><br>\n<span class=\"text-green-500 bg-green-900/30 px-2 rounded -ml-2\">----t.right(90) <span class=\"text-slate-400\"># Tab 4 spasi (BENAR)</span></span><br>\n<br>\n<span class=\"text-yellow-400 font-bold\"># Solusi IDE/VSCode: Gunakan tombol TAB, jangan spasi manual!</span>\n    </div>\n</div>"
    },
    {
        "title": "Kesimpulan Struktur Blok \ud83e\uddf1",
        "subtitle": "Satu Blok Kode",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <p class=\"text-lg text-slate-700 font-medium\">Dalam pemrograman modern, \"Indentasi\" sama artinya dengan \"Kelompok / Blok\". Semua baris yang menjorok sejajar di bawah For Loop dianggap sebagai satu kelompok kerja yang akan diulang bersama-sama.</p>\n        <div class=\"mt-6 border-l-4 border-blue-500 pl-4\">\n            <p class=\"font-mono text-blue-600 font-bold\">Kelompok Diulang (Loop Body)</p>\n            <p class=\"text-sm text-slate-500 mt-2\">Duduk santai biarkan komputer berputar.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Matematika Bentuk Dasar \ud83d\udcd0",
        "subtitle": "Segi-Empat",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-2xl font-black text-slate-800\">Membentuk Poligon</h3>\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Untuk membuat kotak (Segi empat), kita menggunakan Loop sebanyak 4 kali, dengan tikungan siku-siku 90 derajat.\n        </p>\n        <div class=\"bg-slate-900 text-white p-4 rounded-xl font-mono text-sm border border-slate-700 leading-loose\">\nfor i in range(<span class=\"text-green-400 font-bold text-lg\">4</span>):<br>\n&nbsp;&nbsp;t.forward(100)<br>\n&nbsp;&nbsp;t.right(<span class=\"text-yellow-400 font-bold text-lg\">90</span>)\n        </div>\n    </div>\n    <div class=\"bg-slate-100 h-64 rounded-xl border-4 border-slate-300 relative shadow-inner flex items-center justify-center p-8\">\n        <div class=\"w-32 h-32 border-4 border-blue-600 rounded\"></div>\n        <div class=\"absolute mt-16 mr-16 text-3xl\">\ud83d\udc22</div>\n    </div>\n</div>"
    },
    {
        "title": "Matematika Bentuk Dasar \ud83d\udcd0",
        "subtitle": "Segi-Lima (Pentagon)",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-2xl font-black text-slate-800\">Menambah Sisi</h3>\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Jika kita ingin Segi-Lima, kita putar 5 kali. Tapi berapa derajat tikungannya?\n        </p>\n        <div class=\"bg-slate-900 text-white p-4 rounded-xl font-mono text-sm border border-slate-700 leading-loose\">\nfor i in range(<span class=\"text-green-400 font-bold text-lg\">5</span>):<br>\n&nbsp;&nbsp;t.forward(100)<br>\n&nbsp;&nbsp;t.right(<span class=\"text-yellow-400 font-bold text-lg\">72</span>) <span class=\"text-slate-500\"># Kok 72?</span>\n        </div>\n    </div>\n    <div class=\"bg-slate-100 h-64 rounded-xl border-4 border-slate-300 relative shadow-inner flex items-center justify-center p-8\">\n        <!-- CSS Pentagon -->\n        <svg class=\"w-32 h-32 text-blue-600 drop-shadow\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" viewBox=\"0 0 100 100\"><polygon points=\"50,5 95,38 78,95 22,95 5,38\"/></svg>\n    </div>\n</div>"
    },
    {
        "title": "Rumus Rahasia Poligon \ud83d\udddd\ufe0f",
        "subtitle": "360 Derajat",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-gradient-to-r from-blue-600 to-indigo-700 p-8 rounded-3xl shadow-xl text-center text-white border-4 border-indigo-900\">\n        <p class=\"text-xl mb-6 font-medium\">Rahasia menggambar bangun datar sempurna yang ujungnya tertutup (kembali ke tempat asal) adalah:</p>\n        \n        <div class=\"bg-white text-indigo-900 px-8 py-6 rounded-2xl max-w-xl mx-auto shadow-inner transform rotate-1\">\n            <p class=\"text-3xl font-black mb-2\">360 : Jumlah Sisi</p>\n            <p class=\"text-md font-bold text-indigo-500\">= Derajat Belokan (Right / Left)</p>\n        </div>\n        \n        <div class=\"grid grid-cols-2 gap-4 mt-8 text-sm font-mono max-w-lg mx-auto text-left\">\n            <p>Segi-3 &nbsp;\u27a1\ufe0f 360 / 3 = <span class=\"text-yellow-300 font-bold\">120\u00b0</span></p>\n            <p>Segi-4 &nbsp;\u27a1\ufe0f 360 / 4 = <span class=\"text-yellow-300 font-bold\">90\u00b0</span></p>\n            <p>Segi-5 &nbsp;\u27a1\ufe0f 360 / 5 = <span class=\"text-yellow-300 font-bold\">72\u00b0</span></p>\n            <p>Segi-6 &nbsp;\u27a1\ufe0f 360 / 6 = <span class=\"text-yellow-300 font-bold\">60\u00b0</span></p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kuis Matematika Visual \ud83e\udde0",
        "subtitle": "Hitung Segi Delapan",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <p class=\"font-bold text-slate-700 text-lg mb-6\">Berdasarkan Rumus Sakti <code class=\"bg-slate-100 px-2 rounded\">360 / sisi</code>, berapa derajat putaran untuk membuat <b>Segi Delapan (Octagon)</b> mirip rambu STOP?</p>\n        <div class=\"grid grid-cols-3 gap-4\">\n            <button onclick=\"showMiniFeedback('qs1', 'Salah! 360 dibagi 8 bukan 30.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl font-mono\">30</button>\n            <button onclick=\"showMiniFeedback('qs1', 'BENAR! 360 dibagi 8 adalah 45 derajat.', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl font-mono\">45</button>\n            <button onclick=\"showMiniFeedback('qs1', 'Salah! 80 derajat akan menghasilkan gambar acak.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl font-mono\">80</button>\n        </div>\n        <div id=\"qs1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold text-xl\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Animasi Segi-N \ud83c\udfac",
        "subtitle": "Loop in Action",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-slate-900 h-[250px] border-4 border-slate-700 rounded-2xl relative shadow-xl overflow-hidden flex items-center justify-center\">\n        <div class=\"absolute left-10 text-left font-mono text-sm text-green-400 bg-black p-4 rounded-xl border border-slate-800 z-10\">\n            sisi = <span class=\"text-yellow-400\">8</span><br>\n            for i in range(<span class=\"text-yellow-400\">sisi</span>):<br>\n            &nbsp;&nbsp;t.forward(50)<br>\n            &nbsp;&nbsp;t.right(360 / <span class=\"text-yellow-400\">sisi</span>)\n        </div>\n        <!-- Octagon CSS -->\n        <div class=\"w-32 h-32 border-[6px] border-green-500 rounded-full flex items-center justify-center relative spin-slow opacity-80\" style=\"clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);\">\n            <div class=\"absolute -top-4 text-2xl\">\ud83d\udc22</div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Bagaimana dengan Lingkaran? \u2b55",
        "subtitle": "Rahasia Circle",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-blue-50 p-6 rounded-2xl border border-blue-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udca1</div>\n        <p class=\"text-lg text-blue-900 font-medium\">Fungsi <code>t.circle(50)</code> sebenarnya di balik layar hanyalah sebuah For Loop yang menjalankan maju 1 langkah, belok 1 derajat, dan diulang 360 kali sangat cepat!</p>\n    </div>\n</div>"
    },
    {
        "title": "Misteri Huruf 'i' \ud83d\udd75\ufe0f",
        "subtitle": "Apa itu `i`?",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-blue-50 p-6 rounded-2xl border border-blue-200 shadow-sm\">\n        <p class=\"text-lg text-blue-900 font-medium mb-4\">Kamu sadar tidak, di dalam kata kunci <code>for i in range(5):</code>, selalu ada huruf <b class=\"font-black text-xl\">i</b>. Apakah itu?</p>\n        <p class=\"text-md text-blue-800 leading-relaxed\">Huruf <code>i</code> adalah sebuah variabel (kotak penyimpanan) yang secara otomatis mengingat <b>putaran ke-berapa</b> Loop tersebut sedang berjalan.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700\">\nfor i in range(3):<br>\n&nbsp;&nbsp;print(i)<br>\n<br>\n<span class=\"text-slate-400\"># Output:</span><br>\n<span class=\"text-green-400\">0</span> <span class=\"text-slate-500\">&lt;-- Komputer mulai dari 0</span><br>\n<span class=\"text-green-400\">1</span><br>\n<span class=\"text-green-400\">2</span>\n    </div>\n</div>"
    },
    {
        "title": "Menggunakan 'i' \ud83d\udcc8",
        "subtitle": "Menggambar Dinamis",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <p class=\"text-lg text-slate-700 font-medium\">Karena nilai `i` terus berubah setiap putaran (0, 1, 2, 3...), kita bisa memasukkan huruf `i` ke dalam gerakan kura-kura! <br>Misal: <code>forward(i)</code>. Kura-kura akan melangkah makin lama makin panjang!</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose mt-4\">\nt.speed(0)<br>\nfor i in range(50):<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># Putaran awal: maju(0). Putaran akhir: maju(49*5)</span><br>\n&nbsp;&nbsp;t.<span class=\"text-yellow-400 font-bold\">forward</span>(<span class=\"text-green-400 font-bold text-lg\">i * 5</span>)<br>\n&nbsp;&nbsp;t.right(90)\n    </div>\n</div>"
    },
    {
        "title": "Hasil forward(i * 5) \ud83c\udf00",
        "subtitle": "Kotak Spiral!",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-white h-[300px] border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex items-center justify-center p-4\">\n        <p class=\"absolute top-4 left-6 font-bold text-slate-500\">Makin lama makin membesar!<br>Inilah cara membuat bentuk <b>Spiral</b>!</p>\n        <!-- CSS Box Spiral approximation using borders -->\n        <div class=\"w-4 h-4 border-t-2 border-r-2 border-black absolute border-opacity-20\"></div>\n        <div class=\"w-8 h-8 border-b-2 border-l-2 border-black absolute border-opacity-40 translate-x-2 translate-y-2\"></div>\n        <div class=\"w-16 h-16 border-t-2 border-r-2 border-black absolute border-opacity-60 -translate-x-2 -translate-y-2\"></div>\n        <div class=\"w-24 h-24 border-b-2 border-l-2 border-black absolute border-opacity-80 translate-x-2 translate-y-2\"></div>\n        <div class=\"w-32 h-32 border-t-4 border-r-4 border-black absolute -translate-x-2 -translate-y-2\"></div>\n        <div class=\"w-40 h-40 border-b-4 border-l-4 border-black absolute translate-x-2 translate-y-2\"></div>\n        \n        <div class=\"absolute bottom-6 right-1/4 text-2xl rotate-45\">\ud83d\udc22\ud83d\udca8</div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Spiral Jaring Laba-laba",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-spin-slow\">\ud83d\udd78\ufe0f</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kakak Pengajar akan memandu menggunakan Variabel `i` dari For Loop untuk membuat kotak spiral yang melengkung menjadi bentuk Jaring Laba-laba! <br><br>Buka IDE kalian sekarang!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Ikuti Kodenya! \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Langkah 1: Setup Spider",
        "subtitle": "Loop Spiral Dasar",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\nimport turtle<br>\nt = turtle.Turtle()<br>\nt.speed(0)<br>\nt.color(\"black\")<br>\n<br>\n<span class=\"text-slate-400\"># 1. Ulang sebanyak 100 kali</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">for i in range(100):</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded pl-4\">&nbsp;&nbsp;t.forward(i * 3)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded pl-4\">&nbsp;&nbsp;t.right(90)</span><br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-slate-700 mb-2\">Hasil Sementara</h4>\n        <p class=\"text-sm text-slate-500\">Kode ini hanya menghasilkan kotak spiral kaku biasa. Kita butuh sebuah ilusi agar melengkung seperti jaring.</p>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 2: Ilusi Jaring \ud83d\udd77\ufe0f",
        "subtitle": "Sudut Tidak Genap",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\n<span class=\"text-slate-400\"># UBAH SUDUT KANANNYA!</span><br>\n<br>\nfor i in range(100):<br>\n&nbsp;&nbsp;t.forward(i * 3)<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># Ganti 90 menjadi 91 atau 89</span><br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.right(91)</span><br>\n<br>\nt.hideturtle()\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-red-600 mb-2\">Trik Masterclass!</h4>\n        <p class=\"text-sm text-slate-600\">Dengan mengubah sudut berbelok meleset sedikit dari 90 derajat, garisnya tidak akan menimpa siku yang lurus, melainkan terus berputar miring membentuk jaring yang cantik!</p>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Bunga Sederhana (Tumpukan Lingkaran)",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm flex items-start gap-6\">\n        <div class=\"text-5xl\">\ud83c\udf38</div>\n        <div>\n            <h4 class=\"font-black text-xl text-pink-600 mb-2\">Misi Bunga Teratai:</h4>\n            <p class=\"text-slate-600 font-medium leading-relaxed\">\n                Buatlah bentuk menyerupai bunga yang terbentuk dari lingkaran yang saling bertumpuk melingkar di tengah layar.\n            </p>\n            <ul class=\"list-disc pl-5 mt-4 text-sm text-slate-700 space-y-2 font-bold bg-pink-50 p-4 rounded-xl border border-pink-200\">\n                <li>Gunakan <code>t.circle(80)</code>.</li>\n                <li>Ulangi penggambaran lingkaran sebanyak <b class=\"text-pink-600\">6 kali</b> dengan For Loop.</li>\n                <li>Setiap lingkaran selesai dibuat, kura-kura harus berputar <code>right(...)</code> sebelum membuat lingkaran berikutnya.</li>\n                <li><span class=\"text-pink-600\">Hint Logika:</span> Berapa rotasi total lingkaran? (360). Dibagi jumlah kelopak bunga (6). Masukkan angkanya ke dalam `right()`.</li>\n            </ul>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Menggabung Loop & Gacha \ud83c\udfb0",
        "subtitle": "Warni-Warni Otomatis",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <p class=\"text-lg text-slate-700 font-medium\">Bentuk tumpukan yang baru kita pelajari akan sangat indah jika setiap bentuknya memiliki warna berbeda! Mari gabungkan `random` ke dalam `for` loop!</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose mt-4\">\nimport random<br>\nturtle.colormode(255)<br><br>\nfor i in range(36):<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># Ganti cat di SETIAP putaran loop!</span><br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 font-bold\">t.color(random.randint(0,255), random.randint(0,255), random.randint(0,255))</span><br>\n&nbsp;&nbsp;t.circle(80)<br>\n&nbsp;&nbsp;t.right(10) <span class=\"text-slate-400\"># 360 dibagi 36 kelopak = 10 derajat</span>\n    </div>\n</div>"
    },
    {
        "title": "Animasi Visual RGB Loop \ud83c\udfac",
        "subtitle": "Spirograph Lingkaran",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-black h-[300px] border-4 border-slate-700 rounded-2xl relative shadow-xl overflow-hidden flex items-center justify-center p-4 isolate\">\n        <!-- CSS Illusion of random colored overlapping rings -->\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-red-500 opacity-60 transform translate-x-4 mix-blend-screen\"></div>\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-blue-500 opacity-60 transform -translate-x-4 mix-blend-screen\"></div>\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-green-500 opacity-60 transform translate-y-4 mix-blend-screen\"></div>\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-yellow-500 opacity-60 transform -translate-y-4 mix-blend-screen\"></div>\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-purple-500 opacity-60 transform translate-x-3 translate-y-3 mix-blend-screen\"></div>\n        <div class=\"absolute w-32 h-32 rounded-full border-2 border-cyan-500 opacity-60 transform -translate-x-3 -translate-y-3 mix-blend-screen\"></div>\n        \n        <p class=\"absolute bottom-4 text-slate-400 font-mono text-xs\">t.circle() + random RGB Color</p>\n    </div>\n</div>"
    },
    {
        "title": "Ekspansi Karya Seni \ud83c\udfa8",
        "subtitle": "Tidak Hanya Lingkaran",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udca1</div>\n        <p class=\"text-lg text-amber-900 font-medium\">Bentuk dasar yang digabungkan dan diputar berulang kali akan membentuk geometri yang indah. Cobalah ganti `circle` dengan bentuk Kotak `forward-right` secara manual.</p>\n    </div>\n</div>"
    },
    {
        "title": "Inception: Loop Bersarang \ud83e\uddc5",
        "subtitle": "Nested Loop",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83e\uddc5</div>\n        <p class=\"text-lg text-indigo-900 font-bold mb-4\">Level Tertinggi Mesin Otomatisasi: <br>Menyuruh mesin Loop untuk menyalakan mesin Loop lainnya! (Loop di dalam Loop).</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-400\"># Loop LUAR (Ibu) berjalan 3 kali</span><br>\nfor i in range(3):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(\"Siapkan Kertas\")<br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Loop DALAM (Anak) berjalan 4 kali di setiap kertas</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;for j in range(4):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;print(\"--- Gambar Garis Kotak\")\n    </div>\n</div>"
    },
    {
        "title": "Analogi Membaca Buku \ud83d\udcd6",
        "subtitle": "Buku = Nested Loop",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-xl font-black text-slate-800\">Cara kerja Nested Loop:</h3>\n        <ul class=\"list-decimal pl-5 text-md text-slate-700 space-y-3 font-medium\">\n            <li>Loop LUAR adalah <b class=\"text-blue-600\">HALAMAN BUKU</b>.</li>\n            <li>Loop DALAM adalah <b class=\"text-red-600\">BARIS KALIMAT</b> di halaman tersebut.</li>\n            <li>Saat kamu berada di halaman 1, kamu harus mengulang baca baris 1 sampai tamat (Loop Dalam selesai).</li>\n            <li>Baru kamu membuka halaman 2 (Loop Luar lanjut putaran), dan mengulang baca baris 1 lagi!</li>\n        </ul>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm\">\n        <div class=\"font-mono text-xs text-left bg-slate-50 p-4 rounded text-slate-600 border border-slate-200\">\n            <span class=\"text-blue-600 font-bold\">Halaman 1</span><br>\n            <span class=\"text-red-500 pl-4\">Baris 1</span><br>\n            <span class=\"text-red-500 pl-4\">Baris 2</span><br>\n            <span class=\"text-blue-600 font-bold\">Halaman 2</span><br>\n            <span class=\"text-red-500 pl-4\">Baris 1</span><br>\n            <span class=\"text-red-500 pl-4\">Baris 2</span><br>\n            <span class=\"text-blue-600 font-bold\">Halaman 3</span><br>\n            ...\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 3: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Bunga Kotak (Spirograph Kotak)",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-spin\">\ud83d\udca0</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kakak Pengajar akan memandu membuat karya seni <b class=\"text-blue-600\">Spirograph Kotak</b>. <br>Kita butuh 1 Loop Dalam untuk menggambar kotak sempurna, dan 1 Loop Luar untuk memutar posisi kotak itu berulang-ulang sampai menjadi pola mandala!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Bedah Kode di IDE \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Kode Bunga Kotak \ud83d\udca0",
        "subtitle": "Spirograph Logic",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-2\">\n    <div class=\"bg-slate-900 text-white p-4 rounded-2xl font-mono text-xs h-[380px] shadow-2xl border border-slate-700 leading-relaxed overflow-y-auto\">\nimport turtle<br>\nt = turtle.Turtle()<br>\nt.speed(0)<br><br>\n<span class=\"text-slate-400\"># Loop LUAR: Buat 36 Kotak</span><br>\nfor i in range(36):<br>\n<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># Loop DALAM: Cara bikin 1 Kotak</span><br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded w-max\">for j in range(4):</span><br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded w-max pl-4\">&nbsp;&nbsp;t.forward(100)</span><br>\n&nbsp;&nbsp;<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded w-max pl-4\">&nbsp;&nbsp;t.right(90)</span><br>\n<br>\n&nbsp;&nbsp;<span class=\"text-slate-400\"># Di luar kotak, tapi di DALAM putaran bunga</span><br>\n&nbsp;&nbsp;t.right(10) <span class=\"text-slate-400\"># 360 / 36 = 10 derajat</span>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-blue-700 mb-2\">Penjelasan</h4>\n        <p class=\"text-sm text-slate-600\">Kode akan menyelesaikan 4 maju-belok (membuat 1 kotak utuh), lalu Loop dalam selesai. Kemudian ia akan `right(10)` bergeser. Barulah Loop luar mengulang ke kotak berikutnya!</p>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi CSS Nested Loop \ud83c\udfac",
        "subtitle": "Kotak Berputar",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-slate-100 h-[300px] border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex items-center justify-center isolate\">\n        <!-- CSS Illusion of rotating boxes -->\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-0 opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[10deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[20deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[30deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[40deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[50deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[60deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[70deg] opacity-50\"></div>\n        <div class=\"absolute w-24 h-24 border-2 border-blue-500 transform rotate-[80deg] opacity-50\"></div>\n        \n        <p class=\"absolute bottom-4 text-slate-500 font-bold text-sm bg-white p-2 rounded shadow\">Keajaiban Spirograph Kotak</p>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 4: Independent \ud83d\udcbb",
        "subtitle": "Spirograph Bintang",

    {
        "title": "Challenge 1 \ud83c\udf00",
        "subtitle": "Pusaran Lubang Hitam (Blackhole)",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-black p-6 rounded-2xl border-2 border-purple-800 flex gap-4 shadow-xl items-center text-white\">\n        <div class=\"text-5xl shrink-0\">\ud83d\udd73\ufe0f</div>\n        <div>\n            <p class=\"font-bold text-purple-400 text-lg\">Misi: Blackhole Spiral</p>\n            <p class=\"text-md text-slate-300 mt-1\">Buatlah pusaran galaksi/spiral yang terbentuk dari lingkaran (bukan garis). Makin lama, ukuran lingkarannya makin membesar!</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Hint Solusi:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Gunakan 1 buah For loop (tanpa nested).</li>\n            <li>Di dalam loop, gambar lingkaran membesar dengan parameter `i`: <code>t.circle(i)</code>.</li>\n            <li>Setelah membuat lingkaran, maju sedikit `t.forward(5)` dan putar sudut miring `t.right(20)`.</li>\n            <li>Warna pen tipis RGB gacha membuat blackhole makin keren!</li>\n        </ul>\n    </div>\n</div>"

    {
        "title": "Challenge 2 \ud83c\udff5\ufe0f",
        "subtitle": "Mandala Art Otomatis",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200 flex gap-4 shadow-sm items-center\">\n        <div class=\"text-5xl shrink-0\">\ud83c\udff5\ufe0f</div>\n        <div>\n            <p class=\"font-bold text-amber-900 text-lg\">Misi: Mandala Seni Penenang</p>\n            <p class=\"text-md text-amber-800 mt-1\">Gabungkan pola Lingkaran, Kotak, dan Segitiga dalam satu tumpukan Spirograph bersarang (Nested) secara bergiliran.</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Hint Solusi:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Di dalam **Loop Luar**, buatlah 1 lingkaran dasar `t.circle(50)`.</li>\n            <li>Di bawahnya, masuk ke **Loop Dalam** pembuat kotak/segitiga.</li>\n            <li>Geser putaran sudut di akhir loop luar. Hasilnya akan menjadi bentuk geometris bertumpuk layaknya mandala India!</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Challenge 3 \ud83c\udf86",
        "subtitle": "Kembang Api Stamp Pro",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-4 mt-2\">\n    <div class=\"bg-slate-900 p-5 rounded-2xl border border-slate-700 flex gap-4 shadow-xl\">\n        <div class=\"text-3xl\">\ud83c\udf86</div>\n        <div>\n            <p class=\"font-bold text-slate-200 text-lg\">Misi Akhir: Ledakan Kembang Api</p>\n            <p class=\"text-sm text-slate-400 mt-1\">Tanpa menggunakan garis tinta (`penup`), ciptakan ilusi stempel warna-warni memancar dari pusat layar ke segala arah secara melingkar!</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Persyaratan Minimum:</p>\n        <ul class=\"list-disc pl-6 text-sm text-slate-700 mt-4 space-y-2 font-medium\">\n            <li>Loop 36 kali memutar 360 derajat.</li>\n            <li>Di setiap putaran: Bergerak maju `forward`, ganti warna gacha, lakukan `stamp()`, lalu kembali ke pusat `backward`.</li>\n            <li>Jika ingin lebih pro: Buat jejak stamp lebih dari 1! (Nested loop maju -> stamp -> maju -> stamp).</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Cheat Sheet Loops 1",
        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-k-blue h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Syntax Sakti For Loop</h4>\n            <div class=\"text-sm font-mono text-slate-600 mt-2 space-y-2 font-bold bg-black p-3 rounded text-white\">\n                for i in range(100):<br>\n                &nbsp;&nbsp;t.forward(10)<br>\n            </div>\n            <p class=\"text-xs text-slate-500 mt-2 italic\">*Hati-hati dengan Titik Dua (:) dan Indentasi Tab yang wajib menjorok!</p>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Kegunaan Variabel \"i\"</h4>\n            <ul class=\"text-sm text-slate-600 space-y-2 leading-relaxed mt-2 list-disc pl-4 font-medium\">\n                <li>Menyimpan nilai putaran saat ini (0, 1, 2, ...).</li>\n                <li>Dapat dimasukkan ke gerakan kura-kura untuk membuat pola bertambah panjang (Spiral). <code class=\"bg-slate-200 px-1 rounded text-red-500\">t.forward(i)</code></li>\n            </ul>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Cheat Sheet Loops 2",
        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-green-500 h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Rumus Poligon Matematika</h4>\n            <p class=\"text-md font-bold text-slate-700 bg-yellow-100 p-3 rounded\">Rotasi (Right/Left) = 360 / Jumlah Sisi</p>\n            <ul class=\"text-sm text-slate-600 space-y-1 mt-3 font-mono\">\n                <li>Kotak = 360 / 4 = 90</li>\n                <li>Segitiga = 360 / 3 = 120</li>\n                <li>Bintang 5 = Spesial (144)</li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Nested Loop (Buku & Hal)</h4>\n            <div class=\"text-xs font-mono text-slate-600 mt-2 space-y-2 font-bold bg-black p-3 rounded text-white\">\n                for luar in range(36):<br>\n                &nbsp;&nbsp;for dalam in range(4):<br>\n                &nbsp;&nbsp;&nbsp;&nbsp;t.forward(50)<br>\n            </div>\n            <p class=\"text-xs text-slate-500 mt-2 italic\">Berguna untuk Spirograph dan Mandala Art.</p>\n        </div>\n    </div>\n</div>"
    },
