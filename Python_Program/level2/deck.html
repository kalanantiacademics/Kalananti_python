        "title": "Nested Loop sebagai Grid \ud83d\uddfa\ufe0f",
        "subtitle": "Row x Column",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-slate-900 h-[250px] border-4 border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center relative overflow-hidden\">\n        <p class=\"text-white font-medium mb-4 z-10 text-lg\">Jika kita memasangkan Loop Luar dan Dalam, komputer secara ajaib membuat pola jaring Grid!</p>\n        <div class=\"font-mono text-sm text-left w-max bg-black p-4 rounded text-white border border-slate-700 z-10 shadow-lg\">\n            <span class=\"text-slate-400\"># Loop Luar: Pindah Baris (Ke bawah)</span><br>\n            <span class=\"text-yellow-400 font-bold\">for</span> baris <span class=\"text-yellow-400 font-bold\">in</span> range(<span class=\"text-red-400\">5</span>):<br>\n            <br>\n            &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Loop Dalam: Cetak Kolom (Ke Kanan)</span><br>\n            &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-yellow-400 font-bold\">for</span> kolom <span class=\"text-yellow-400 font-bold\">in</span> range(<span class=\"text-blue-400\">5</span>):<br>\n            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;gambar_kotak()\n        </div>\n        <div class=\"absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/graphy.png')]\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Robot Pengecat \ud83e\udd16",
        "subtitle": "Mengecat Dinding",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-5xl mt-2\">\ud83d\udd8c\ufe0f</div>\n        <div class=\"flex-1\">\n            <p class=\"text-lg text-slate-800 font-bold mb-2\">Cara kerja Nested Loop Mengecat Grid:</p>\n            <ol class=\"list-decimal pl-5 text-slate-600 space-y-2 font-medium\">\n                <li><b class=\"text-red-500\">Loop Luar</b> memilih baris 1 (paling atas).</li>\n                <li><b class=\"text-blue-500\">Loop Dalam</b> berjalan menyamping mencetak 5 kotak berturut-turut. (Kolom 1, 2, 3, 4, 5).</li>\n                <li>Satu baris selesai! Robot (Kura-kura) harus \"mundur dan turun\" ke baris 2.</li>\n                <li>Loop Luar berganti ke putaran baris 2. Ulangi proses cetak 5 kotak menyamping!</li>\n            </ol>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Tebak Kotak! \ud83d\udfe9",
        "subtitle": "Matematika Matriks",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <div class=\"font-mono text-sm bg-slate-800 text-green-400 p-4 rounded-xl text-left inline-block mb-6 shadow-inner\">\n            for baris in range(<b class=\"text-yellow-400\">8</b>):<br>\n            &nbsp;&nbsp;for kolom in range(<b class=\"text-yellow-400\">8</b>):<br>\n            &nbsp;&nbsp;&nbsp;&nbsp;gambar_kotak()\n        </div>\n        <p class=\"text-lg text-slate-700 font-bold mb-6\">Jika kita menjalankan kode di atas, berapa total kotak yang tergambar di layar (Papan Catur)?</p>\n        <div class=\"grid grid-cols-3 gap-8 text-left font-mono\">\n            <button onclick=\"showMiniFeedback('qa1', 'Salah! Itu baru dua baris.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 text-center font-bold text-xl\">16</button>\n            <button onclick=\"showMiniFeedback('qa1', 'BENAR! 8 baris dikali 8 kolom = 64 kotak (Persis papan catur!).', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 text-center font-bold text-xl\">64</button>\n            <button onclick=\"showMiniFeedback('qa1', 'Salah! Terlalu banyak.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 text-center font-bold text-xl\">128</button>\n        </div>\n        <div id=\"qa1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold text-xl\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Tantangan Kura-Kura \ud83d\udc22",
        "subtitle": "Posisi Awal & Mundur",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-red-50 p-6 rounded-2xl border border-red-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udea8</div>\n        <div class=\"flex-1\">\n            <p class=\"text-lg text-red-900 font-bold mb-2\">Problem Kura-Kura:</p>\n            <p class=\"text-slate-700 font-medium\">Jika kita memakai kura-kura untuk membuat Grid, masalahnya adalah setelah ia selesai mengecat kotak ujung kanan baris 1, kepalanya ada di kanan! Ia tidak otomatis balik ke awal baris 2!</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <p class=\"font-bold text-blue-800 text-lg flex items-center gap-2\"><span>\u2705</span> Solusi: Perintah Goto / Setpos</p>\n        <p class=\"text-slate-600 font-medium mt-2\">Kita harus menghitung koordinat X dan Y secara matematika, lalu memaksa kura-kura terbang (menggunakan `penup()` dan `goto()`) ke setiap titik kotak yang tepat!</p>\n    </div>\n</div>"
    },
    {
        "title": "Persiapan Sistem Koordinat \ud83c\udfaf",
        "subtitle": "Ingat Kartesius",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-2xl font-black text-slate-800\">Sumbu X dan Y</h3>\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Di kanvas Python Turtle:\n        </p>\n        <ul class=\"list-disc pl-5 space-y-3 font-bold text-slate-700\">\n            <li><span class=\"text-red-500 text-xl\">Sumbu X:</span> Kanan (+) dan Kiri (-).</li>\n            <li><span class=\"text-blue-500 text-xl\">Sumbu Y:</span> Atas (+) dan Bawah (-).</li>\n            <li>Tengah-tengah layar adalah `(0, 0)`.</li>\n        </ul>\n    </div>\n    <div class=\"bg-slate-100 h-64 rounded-xl border-4 border-slate-300 relative shadow-inner flex items-center justify-center isolate\">\n        <!-- Axes -->\n        <div class=\"absolute w-full h-[2px] bg-red-400\"></div>\n        <div class=\"absolute h-full w-[2px] bg-blue-400\"></div>\n        <div class=\"absolute bg-white px-2 py-1 border border-slate-300 text-xs font-bold rounded shadow-sm text-slate-600\">(0, 0)</div>\n        <div class=\"absolute top-4 font-bold text-blue-600\">+ Y</div>\n        <div class=\"absolute right-4 font-bold text-red-600\">+ X</div>\n        <div class=\"absolute bottom-4 font-bold text-blue-600\">- Y</div>\n        <div class=\"absolute left-4 font-bold text-red-600\">- X</div>\n    </div>\n</div>"
    },
    {
        "title": "Mengubah (Baris, Kolom) Menjadi (X, Y) \ud83d\udcd0",
        "subtitle": "Pemetaan",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm\">\n        <p class=\"text-lg text-slate-700 font-bold mb-4\">Bagaimana cara memberitahu koordinat layar dari urutan Baris dan Kolom pada Loop?</p>\n        <div class=\"bg-slate-900 text-white p-4 rounded-xl font-mono text-sm border border-slate-700 leading-loose\">\n<span class=\"text-slate-400\"># Misal ukuran per-kotak adalah 20 pixel</span><br>\nsize = 20<br><br>\n<span class=\"text-slate-400\"># Sumbu X (Kanan-Kiri) dikendalikan oleh KOLOM</span><br>\nx = kolom * size<br><br>\n<span class=\"text-slate-400\"># Sumbu Y (Atas-Bawah) dikendalikan oleh BARIS</span><br>\n<span class=\"text-slate-400\"># (Beri minus '-' karena baris turun ke bawah)</span><br>\ny = -baris * size\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Efek Perkalian Size \u2716\ufe0f",
        "subtitle": "Memperbesar Jarak",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udca1</div>\n        <p class=\"text-lg text-indigo-900 font-bold mb-4\">Mengapa dikali \"size\" (misal: 20)? <br>Karena kolom ke-0, 1, 2, 3 letaknya sangat rapat (1 pixel). Jika dikali 20, letaknya menjadi 0, 20, 40, 60. Kura-kura akan loncat berjarak 20 langkah di setiap kotak!</p>\n    </div>\n    <div class=\"flex gap-4 items-center justify-center mt-8\">\n        <div class=\"w-10 h-10 bg-slate-300 rounded border-2 border-slate-400 flex items-center justify-center text-xs font-bold text-slate-500\">x=0</div>\n        <div class=\"w-8 h-px bg-slate-400 border-t border-dashed\"></div>\n        <div class=\"w-10 h-10 bg-slate-300 rounded border-2 border-slate-400 flex items-center justify-center text-xs font-bold text-slate-500\">x=20</div>\n        <div class=\"w-8 h-px bg-slate-400 border-t border-dashed\"></div>\n        <div class=\"w-10 h-10 bg-slate-300 rounded border-2 border-slate-400 flex items-center justify-center text-xs font-bold text-slate-500\">x=40</div>\n    </div>\n</div>"
    },
    {
        "title": "Kuis Matematika Koordinat \ud83e\udde0",
        "subtitle": "Hitung Titik",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <div class=\"bg-slate-100 font-mono text-sm p-4 rounded-xl text-left inline-block mb-6 shadow-inner text-slate-700\">\n            size = 30<br>\n            baris = 2<br>\n            kolom = 4<br>\n            <br>\n            x = kolom * size<br>\n            y = -baris * size\n        </div>\n        <p class=\"text-lg text-slate-700 font-bold mb-6\">Dari kode di atas, berapakah titik `(x, y)` tempat kura-kura akan mengecat kotaknya?</p>\n        <div class=\"grid grid-cols-2 gap-4 text-left font-mono\">\n            <button onclick=\"showMiniFeedback('qm1', 'Salah! X dikendalikan oleh kolom, dan Y oleh baris.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl text-center\">(60, -120)</button>\n            <button onclick=\"showMiniFeedback('qm1', 'BENAR! X = 4*30 (120), Y = -(2*30) (-60).', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xl text-center\">(120, -60)</button>\n        </div>\n        <div id=\"qm1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold text-xl\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Menuju Pixel Art \ud83c\udfa8",
        "subtitle": "Menjadi Artis Digital",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-black h-[250px] border-4 border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center relative overflow-hidden\">\n        <p class=\"text-white font-medium mb-4 z-10 text-xl font-bold tracking-widest uppercase\">Apa itu Pixel Art?</p>\n        <p class=\"text-slate-400 z-10 text-md max-w-xl mx-auto\">Seni digital di mana seniman mewarnai setiap kotak (pixel) satu per satu pada sebuah grid matriks. Minecraft dan Game Retro (Mario, Pokemon jadul) menggunakan teknik ini!</p>\n        \n        <!-- Decoration -->\n        <div class=\"absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-1 z-10\">\n            <div class=\"w-6 h-6 bg-red-500 border border-black shadow\"></div>\n            <div class=\"w-6 h-6 bg-white border border-black shadow\"></div>\n            <div class=\"w-6 h-6 bg-red-500 border border-black shadow\"></div>\n            <div class=\"w-6 h-6 bg-white border border-black shadow\"></div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Menggambar Kotak Sempurna \ud83d\udfe9",
        "subtitle": "Fungsi Draw_Box",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <p class=\"text-lg text-slate-800 font-medium mb-4\">Sebelum membuat grid, pastikan kita punya satu blok kode yang tugasnya hanya MENGGAMBAR 1 BUAH KOTAK, agar nantinya tinggal diulang!</p>\n        <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400\"># Kura-kura sudah berada di (x, y) tujuan</span><br>\nt.pendown()<br>\nt.begin_fill()<br>\nfor i in range(4):<br>\n&nbsp;&nbsp;t.forward(size)<br>\n&nbsp;&nbsp;t.right(90)<br>\nt.end_fill()<br>\nt.penup()\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Kloning dengan Stamp? \ud83e\udd77",
        "subtitle": "Cara Alternatif Super Cepat",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\u26a1</div>\n        <div class=\"flex-1\">\n            <p class=\"text-lg text-amber-900 font-bold mb-2\">Tahukah Kamu?</p>\n            <p class=\"text-slate-700 font-medium\">Menggambar garis kotak 4 kali memakai <code>forward()</code> itu sangat lambat. Kura-kura punya \"bentuk\" kotak bawaan yang bisa langsung dicap (Stempel)! Ini 10x lebih cepat!</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-400\"># Ubah wujud kura-kura menjadi Kotak!</span><br>\nt.shape(\"square\")<br>\n<span class=\"text-slate-400\"># Sesuaikan ukuran stempel dengan pixel kita</span><br>\nt.shapesize(size / 20)<br><br>\n\n<span class=\"text-slate-400\"># Sekarang, untuk menggambar 1 pixel, cukup:</span><br>\n<span class=\"text-yellow-400 font-bold\">t.stamp()</span>\n    </div>\n</div>"
    },
    {
        "title": "Tebak Kecepatan! \ud83c\udfce\ufe0f",
        "subtitle": "Stamp VS Line",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <p class=\"text-lg text-slate-700 font-bold mb-6\">Jika kita membuat Papan Catur 8x8 (64 kotak), mana metode yang paling cepat selesai digambar layaknya printer laser?</p>\n        <div class=\"grid grid-cols-2 gap-8 text-left font-mono\">\n            <button onclick=\"showMiniFeedback('qc1', 'BENAR! Stamp ibarat mengecap 1 stempel, instant jadi kotak hitam!', 'success')\" class=\"p-6 border-2 border-slate-200 rounded-xl hover:bg-slate-50 flex flex-col items-center gap-4\">\n                <span class=\"text-4xl\">\ud83e\udd77</span>\n                <span class=\"font-bold text-xl\">t.stamp()</span>\n            </button>\n            <button onclick=\"showMiniFeedback('qc1', 'Salah! Loop 4 garis sangat lambat meskipun t.speed(0).', 'error')\" class=\"p-6 border-2 border-slate-200 rounded-xl hover:bg-slate-50 flex flex-col items-center gap-4\">\n                <span class=\"text-4xl\">\ud83d\udc22</span>\n                <span class=\"font-bold text-xl\">4x t.forward()</span>\n            </button>\n        </div>\n        <div id=\"qc1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold text-xl\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Membuat Papan Catur",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8\">\ud83c\udfc1</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kakak Pengajar akan memandu menggunakan <b>Nested Loop</b> dan trik <b>Stamp Kotak</b> untuk membuat Grid berukuran 5x5.</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Buka IDE Kalian! \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Langkah 1: Setup Stamp",
        "subtitle": "Siapkan Printer",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\nimport turtle<br>\nt = turtle.Turtle()<br>\nt.speed(0)<br>\nt.penup() <span class=\"text-slate-400\"># Jangan coret kertas!</span><br>\n<br>\nsize = 20<br>\nt.shape(\"square\")<br>\nt.shapesize(size / 20)<br>\nt.color(\"black\")\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-slate-700 mb-2\">Penjelasan</h4>\n        <p class=\"text-sm text-slate-500\">`t.penup()` sangat penting karena kita akan terbang dengan `goto`! Jika tidak penup, akan ada garis corat-coret acak di sepanjang perjalanan.</p>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 2: Kerangka Nested Loop",
        "subtitle": "Row & Col",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\n<span class=\"text-slate-400\"># Grid 5 x 5</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">for baris in range(5):</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded pl-4\">&nbsp;&nbsp;for kolom in range(5):</span><br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># -- Rumus XY (Mundur 100 px ke kiri/atas) --</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;x = -100 + (kolom * size)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;y = 100 - (baris * size)<br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># -- Pindah dan Cap! --</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.goto(x, y)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.stamp()\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-xl text-blue-600 mb-2\">Pusat Layar (0,0)</h4>\n        <p class=\"text-sm text-slate-500\">Agar gambar tidak mulai dari tengah layar dan keluar kanvas kanan bawah, kita geser x mulai dari `-100` (kiri) dan y mulai dari `100` (atas).</p>\n    </div>\n</div>"
    },
    {
        "title": "Hasil Langkah 2 \u2b1b",
        "subtitle": "Matriks Hitam Penuh",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-slate-100 h-[300px] border-4 border-slate-300 rounded-2xl relative shadow-inner flex flex-col items-center justify-center isolate p-8\">\n        <div class=\"grid grid-cols-5 gap-0 border-2 border-black w-32 h-32 bg-black\">\n            <!-- 25 black boxes css trick: solid background -->\n        </div>\n        <p class=\"mt-8 text-slate-600 font-bold\">Boom! Kalian mencetak kotak hitam berukuran 5x5 dengan super cepat!</p>\n        <p class=\"text-sm text-slate-500\">Tunggu, kalau hitam semua, mana papan caturnya?</p>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 3: Logika Catur \u265f\ufe0f",
        "subtitle": "Ganjil Genap",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-5 rounded-2xl font-mono text-xs h-[380px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\nfor baris in range(5):<br>\n&nbsp;&nbsp;for kolom in range(5):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;x = -100 + (kolom * size)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;y = 100 - (baris * size)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.goto(x, y)<br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Uji Ganjil/Genap jumlah baris+kolom</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-yellow-400 font-bold\">if (baris + kolom) % 2 == 0:</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.color(\"black\")<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-yellow-400 font-bold\">else:</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.color(\"white\")<br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.stamp()\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-lg text-purple-600 mb-2\">Modulo / Sisa Bagi `%`</h4>\n        <p class=\"text-xs text-slate-500 mb-4\">Papan catur punya sifat matematis unik: Jika urutan baris ditambah kolom hasilnya Genap, warnanya Hitam. Jika Ganjil, warnanya Putih!</p>\n        <div class=\"grid grid-cols-2 gap-0 border border-slate-300 w-16 h-16\">\n            <div class=\"bg-black text-white flex items-center justify-center text-[8px]\">(0,0)=0</div>\n            <div class=\"bg-white text-black flex items-center justify-center text-[8px]\">(0,1)=1</div>\n            <div class=\"bg-white text-black flex items-center justify-center text-[8px]\">(1,0)=1</div>\n            <div class=\"bg-black text-white flex items-center justify-center text-[8px]\">(1,1)=2</div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Level Up: Gambar Suka-suka \ud83c\udfa8",
        "subtitle": "Menuju Game Dev",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-blue-50 p-6 rounded-2xl border border-blue-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udca1</div>\n        <div class=\"flex-1\">\n            <p class=\"text-lg text-blue-900 font-bold mb-2\">Papan catur menggunakan rumus matematika murni. Tapi bagaimana cara menggambar bentuk Hati \u2764\ufe0f atau pedang Minecraft \ud83d\udde1\ufe0f?</p>\n            <p class=\"text-slate-700 font-medium\">Di dunia Game Dev, kita menyimpan desain Pixel Art di dalam <b class=\"font-black text-indigo-600\">Nested List (List di dalam List)</b> yang disebut *Matrix* atau *2D Array*!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Mendesain dengan List \ud83d\udcdd",
        "subtitle": "Blueprints",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-left\">\n    <p class=\"text-md text-slate-600 mb-4 font-bold\">Kalian cukup membuat List berisi angka rahasia. Misal `0` artinya kosong, `1` artinya Hitam, `2` artinya Merah.</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mx-auto\">\n<span class=\"text-slate-400\"># Peta Hati 5x5</span><br>\npeta = [<br>\n&nbsp;&nbsp;[0, <span class=\"text-red-400 font-bold\">1</span>, 0, <span class=\"text-red-400 font-bold\">1</span>, 0],<br>\n&nbsp;&nbsp;[<span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>],<br>\n&nbsp;&nbsp;[0, <span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>, <span class=\"text-red-400 font-bold\">1</span>, 0],<br>\n&nbsp;&nbsp;[0, 0, <span class=\"text-red-400 font-bold\">1</span>, 0, 0],<br>\n&nbsp;&nbsp;[0, 0, 0, 0, 0]<br>\n]\n    </div>\n</div>"
    },
    {
        "title": "Mengakses Data Matrix \ud83d\uddfa\ufe0f",
        "subtitle": "Indeks Bersarang",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-center\">\n        <p class=\"text-lg text-slate-700 font-bold mb-4\">Untuk melihat isi laci nomor `kolom` pada lemari tingkat `baris`, kita menggunakan dua kurung siku <code class=\"bg-slate-100 px-2\">[ ][ ]</code>.</p>\n        \n        <div class=\"bg-yellow-50 font-mono text-xl p-6 rounded-xl border border-yellow-200 text-center inline-block mb-6 shadow-sm text-yellow-900 font-black\">\n            nilai = peta[baris][kolom]\n        </div>\n        \n        <p class=\"text-md text-slate-600 font-medium\">Lalu kita bisa membuat percabangan If/Else! Jika `nilai == 1`, maka beri warna Merah dan cetak. Jika `0`, hiraukan (kosong).</p>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Proyek Minecraft Block",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8\">\ud83e\uddf1</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Buatlah desain blok bebas ala game *Sandbox* (misal blok rumput, kayu, atau wajah creeper) menggunakan teknik *2D Array Map*!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Kerjakan Sendiri! \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Blueprint Misi 2 \ud83d\udccb",
        "subtitle": "Contoh Creeper Face",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-2\">\n    <div class=\"bg-slate-900 text-white p-4 rounded-2xl font-mono text-xs h-[380px] shadow-2xl border border-slate-700 leading-loose overflow-y-auto\">\npeta = [<br>\n&nbsp;&nbsp;[0, 0, 0, 0, 0, 0],<br>\n&nbsp;&nbsp;[0, 1, 1, 0, 1, 1],<br>\n&nbsp;&nbsp;[0, 1, 1, 0, 1, 1],<br>\n&nbsp;&nbsp;[0, 0, 1, 1, 1, 0],<br>\n&nbsp;&nbsp;[0, 1, 1, 1, 1, 1],<br>\n&nbsp;&nbsp;[0, 1, 0, 0, 0, 1]<br>\n]<br>\nfor baris in range(6):<br>\n&nbsp;&nbsp;for kolom in range(6):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;x = -100 + (kolom*30)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;y = 100 - (baris*30)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.goto(x, y)<br>\n<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-yellow-400\">if peta[baris][kolom] == 1:</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.color(\"green\")<br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.stamp()<br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center p-6 text-center\">\n        <h4 class=\"font-bold text-lg text-slate-800 mb-4\">Tantangan Ekstra:</h4>\n        <ul class=\"text-sm text-slate-600 space-y-2 text-left list-disc pl-4\">\n            <li>Ubah ukuran grid menjadi 8x8 agar makin mirip pixel art sejati.</li>\n            <li>Tambahkan angka <code>2</code> di dalam peta untuk warna coklat kayu/batu! (Tambah kondisi <code>elif</code>).</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "\u26a0\ufe0f FINAL ART CHALLENGE \u26a0\ufe0f",
        "subtitle": "Grid Master",
        "content": "<div class=\"text-center space-y-6 p-10 bg-slate-900 text-white rounded-[3rem] border-4 border-yellow-400 shadow-[0_0_80px_rgba(250,204,21,0.5)] mt-4 max-w-4xl mx-auto relative overflow-hidden\">\n    <div class=\"absolute -top-10 -left-10 text-9xl opacity-10\">\ud83e\udd47</div>\n    <div class=\"absolute -bottom-10 -right-10 text-9xl opacity-10\">\ud83e\udd47</div>\n    <div class=\"text-7xl animate-bounce mb-6 relative z-10\">\ud83c\udfc6</div>\n    <h3 class=\"text-5xl font-display font-black tracking-widest text-yellow-400 uppercase relative z-10\">EXPERT PROJECTS</h3>\n    <p class=\"text-xl text-slate-300 mt-6 leading-relaxed relative z-10 max-w-2xl mx-auto\">\n        Kalian telah menguasai matriks grid dua dimensi (X, Y). Tiba saatnya menciptakan karya seni geometris yang lebih rumit dengan Nested Loop tanpa peta!\n    </p>\n</div>"
    },
    {
        "title": "Challenge 1 \ud83e\ude9c",
        "subtitle": "Tangga Menuju Langit (Staircase)",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-indigo-200 flex gap-4 shadow-xl items-center\">\n        <div class=\"text-5xl shrink-0\">\ud83e\ude9c</div>\n        <div>\n            <p class=\"font-bold text-indigo-700 text-lg\">Misi: Pola Tangga Kanan Bawah</p>\n            <p class=\"text-md text-slate-600 mt-1\">Gunakan Logika If dan variabel `baris` `kolom` untuk menghasilkan kotak yang membentang miring seperti tangga menurun!</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Hint Solusi Matematis:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Jika nilai `baris` sama dengan nilai `kolom` (`if baris == kolom:`), maka berikan cat Hitam. Else, cat putih.</li>\n            <li>Ini akan menciptakan garis diagonal miring persis di tengah matriks!</li>\n            <li>Coba kombinasikan kondisi matematika lainnya, misal `if baris > kolom:` untuk mewarnai setengah bagian layar menjadi segitiga.</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Challenge 2 \ud83c\udf08",
        "subtitle": "Disco Dance Floor",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-black p-6 rounded-2xl border-4 border-fuchsia-600 flex gap-4 shadow-xl items-center text-white isolate overflow-hidden relative\">\n        <!-- CSS Party light illusion -->\n        <div class=\"absolute inset-0 bg-gradient-to-r from-red-500 via-blue-500 to-yellow-500 opacity-20 animate-pulse mix-blend-screen\"></div>\n        <div class=\"text-5xl shrink-0 z-10\">\ud83d\udd7a</div>\n        <div class=\"z-10\">\n            <p class=\"font-bold text-fuchsia-400 text-lg\">Misi: Lantai Disko Kelap-Kelip</p>\n            <p class=\"text-md text-slate-300 mt-1\">Buatlah lantai grid 10x10, dan warnai SETIAP lantainya dengan warna RGB Gacha yang acak!</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Hint Solusi:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Kamu tidak butuh IF/Else dan logika matematika rumit.</li>\n            <li>Tarik import `random` dan pasang `colormode(255)`.</li>\n            <li>Di TEPAT SEBELUM perintah `t.stamp()`, masukan `t.color(random.randint(0,255), ...)`</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Challenge 3 \ud83c\udfae",
        "subtitle": "Game Sprite Character",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-4 mt-2\">\n    <div class=\"bg-green-50 p-5 rounded-2xl border border-green-200 flex gap-4 shadow-xl\">\n        <div class=\"text-3xl\">\ud83d\udc7e</div>\n        <div>\n            <p class=\"font-bold text-green-800 text-lg\">Misi Akhir: Karakter Space Invader</p>\n            <p class=\"text-sm text-green-700 mt-1\">Gunakan teknik 2D Array Map (`peta`) yang besar, sekitar 10x10. Desain karakter Alien/Pesawat luar angkasa dengan detail menggunakan kombinasi warna warni angka 0, 1, 2, 3!</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl shadow-md border-slate-700 border mt-4 text-center font-mono text-sm leading-relaxed\">\n        Buktikan diri kalian pantas menjadi <br>\n        <span class=\"text-yellow-400 font-bold text-xl uppercase tracking-widest block mt-4\">Python Pixel Artis \ud83d\ude80</span>\n    </div>\n</div>"
    },
    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Cheat Sheet Nested Grid",
        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-indigo-500 h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Logika Arah</h4>\n            <ul class=\"text-sm text-slate-600 space-y-2 leading-relaxed mt-2 list-disc pl-4 font-bold\">\n                <li><span class=\"text-blue-500\">Loop Luar (Baris):</span> Bergerak dari Atas ke Bawah (Sumbu Y).</li>\n                <li><span class=\"text-red-500\">Loop Dalam (Kolom):</span> Bergerak dari Kiri ke Kanan (Sumbu X).</li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Trik Kloning Super</h4>\n            <p class=\"text-sm text-slate-600 font-medium\">Bentuk kotak bawaan `shape(\"square\")` dikombinasikan dengan stempel instan `stamp()` adalah cara mutlak paling cepat menggambar pixel art tanpa nge-lag.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Cheat Sheet Matriks & Koordinat",
        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-k-blue h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-2 gap-6\">\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Rumus Titik (x, y)</h4>\n            <div class=\"text-sm font-mono text-slate-600 mt-2 space-y-2 font-bold bg-slate-900 p-3 rounded text-green-400 border border-slate-700\">\n                x = kolom * size<br>\n                y = -(baris * size)<br>\n            </div>\n            <p class=\"text-xs text-slate-500 mt-2 italic\">*Y bernilai minus karena arah sumbu Y turun ke bawah.</p>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Array 2D (Peta)</h4>\n            <div class=\"text-xs font-mono text-slate-600 mt-2 space-y-2 font-bold bg-slate-900 p-3 rounded text-yellow-300 border border-slate-700\">\n                nilai = peta[baris][kolom]<br>\n                if nilai == 1:<br>\n                &nbsp;&nbsp;cetak()\n            </div>\n            <p class=\"text-xs text-slate-500 mt-2 italic\">Akses data laci di dalam lemari.</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Sejarah Game Komputer \ud83d\udd79\ufe0f",
        "subtitle": "Asal Mula Tampilan",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative text-center\">\n        <p class=\"text-xl text-slate-700 mb-6 font-medium leading-relaxed\">\n            Tahukah kalian? Cara kita membuat matriks `0` dan `1` di layar ini adalah <b>persis seperti</b> apa yang dilakukan layar komputer atau TV jadulmu saat merender gambar Super Mario Bros! Di dunia maya digital, semuanya hanyalah angka Array yang diterjemahkan menjadi cahaya warna RGB di titik kartesius (X,Y) tertentu.\n        </p>\n        <div class=\"text-5xl mt-6\">\ud83c\udf44 \ud83d\udcfa \ud83d\udd79\ufe0f</div>\n    </div>\n</div>"
    },
    {
        "title": "Quote of the Day \ud83c\udf1f",
        "subtitle": "Penutup Misi 8",
        "content": "<div class=\"flex flex-col items-center justify-center h-full text-center p-10 max-w-5xl mx-auto mt-4\">\n    <blockquote class=\"text-3xl font-serif italic text-slate-800 mb-8 leading-snug\">\n        \"Programming isn't about what you know; it's about what you can figure out.\"\n    </blockquote>\n    <cite class=\"text-slate-500 font-bold not-italic text-xl tracking-widest uppercase\">\u2014 Chris Pine</cite>\n    \n    <div class=\"w-full h-px bg-slate-200 my-10 relative\">\n        <div class=\"absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[var(--card)] px-4 text-6xl animate-pulse\">\ud83c\udf93</div>\n    </div>\n    \n    <div class=\"inline-block bg-gradient-to-r from-indigo-500 to-purple-600 p-1 rounded-2xl shadow-xl\">\n        <div class=\"bg-white px-8 py-4 rounded-xl\">\n            <p class=\"text-xl font-black text-slate-800 uppercase tracking-widest\">Meeting 8 Completed</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "End of Material \ud83c\udfc1",
        "subtitle": "Good Job!",
        "content": "<div class=\"flex flex-col items-center justify-center h-full text-center p-10 max-w-5xl mx-auto mt-4\">\n    <div class=\"text-9xl mb-8\">\ud83c\udf89</div>\n    <h2 class=\"text-4xl font-black text-slate-800 uppercase tracking-widest\">Kerja Bagus!</h2>\n    <p class=\"text-xl text-slate-600 mt-4 max-w-xl mx-auto\">Kalian telah menyelesaikan Sesi 8. Silakan diskusikan proyek Masterpiece yang paling keren untuk Meeting selanjutnya bersama Kakak Pengajar!</p>\n</div>"

            9: [
    {
        "title": "Meeting 9: Brainstorming & Planning \ud83e\udde0",
        "subtitle": "Review & Perencanaan Proyek",
        "content": "<div class=\"text-center space-y-6 max-w-3xl mx-auto mt-4\">\n    <div class=\"text-7xl mb-6\">\ud83c\udfaf</div>\n    <div id=\"instructor-name-container\"></div>\n    <p class=\"text-xl text-slate-600 mt-4\">Selamat! Kalian telah menyelesaikan seluruh materi teori Level 2! <br><br>Sekarang tiba saatnya **Capstone Project** (Proyek Akhir). Tapi sebelum ngoding, kita harus berpikir layaknya *Software Engineer* profesional: Rencanakan semuanya terlebih dahulu!</p>\n</div>"
    },
    {
        "title": "Mega-Flashback Level 2 \ud83d\udd25",
        "subtitle": "Mengingat Semua Senjata",
        "content": "<div class=\"text-center space-y-6 max-w-3xl mx-auto mt-6\">\n    <div class=\"text-6xl mb-6 animate-pulse\">\u2694\ufe0f</div>\n    <p class=\"text-lg text-slate-600\">Proyek akhir kalian akan membutuhkan gabungan dari List, Dictionary, File Handling, hingga Turtle Graphics. Mari pastikan semua senjata memori kalian masih tajam!</p>\n    <button onclick=\"nextSlide()\" class=\"btn-3d bg-k-blue text-white px-8 py-4 rounded-xl font-bold uppercase tracking-widest mt-8\">Uji Ingatan!</button>\n</div>"
    },
    {
        "title": "Flashback 1: Lemari List \ud83d\uddc4\ufe0f",
        "subtitle": "Senjata Penyimpanan",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <div class=\"font-mono text-sm bg-slate-900 text-white p-4 rounded mb-4 text-left inline-block\">\n            ransel = [\"Pedang\", \"Tameng\", \"Ramuan\"]<br>\n            ransel.append(\"Peta\")\n        </div>\n        <p class=\"font-bold text-slate-700 text-lg\">Apa fungsi dari perintah <code>.append()</code> pada list di atas?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb1', 'BENAR! Append akan menambahkan item baru di rak paling belakang.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold font-mono hover:bg-slate-50 text-left\">Menambahkan \"Peta\" ke urutan paling belakang (akhir list).</button>\n            <button onclick=\"showMiniFeedback('fb1', 'Salah! Itu adalah fungsi .insert(0, ...).', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold font-mono hover:bg-slate-50 text-left\">Menyisipkan \"Peta\" di urutan paling depan (index 0).</button>\n        </div>\n        <div id=\"fb1\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 2: Dictionary \ud83d\udcd6",
        "subtitle": "Kunci dan Jawaban",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <div class=\"font-mono text-sm bg-slate-900 text-green-400 p-4 rounded mb-4 text-left inline-block\">\n            monster = {<br>\n            &nbsp;&nbsp;\"nama\": \"Goblin\",<br>\n            &nbsp;&nbsp;\"hp\": 100<br>\n            }\n        </div>\n        <p class=\"font-bold text-slate-700 text-lg\">Bagaimana cara kita mencetak angka `100` (Nyawa si Goblin)?</p>\n        <div class=\"grid grid-cols-2 gap-4 mt-4\">\n            <button onclick=\"showMiniFeedback('fb2', 'BENAR! Gunakan kata kunci string-nya.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">print(monster[\"hp\"])</button>\n            <button onclick=\"showMiniFeedback('fb2', 'Salah! Dictionary tidak menggunakan nomor indeks urutan.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">print(monster[1])</button>\n        </div>\n        <div id=\"fb2\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 3: String Manipulasi \u2702\ufe0f",
        "subtitle": "Memotong Teks",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <div class=\"font-mono text-xl bg-slate-100 text-blue-700 font-bold p-4 rounded mb-4 text-center border shadow-inner\">\n            pesan = \"KODE RAHASIA\"<br>\n            print(pesan[0:4])\n        </div>\n        <p class=\"font-bold text-slate-700 text-lg\">Apa output (hasil layar) dari operasi pemotongan kata di atas?</p>\n        <div class=\"grid grid-cols-3 gap-4 mt-4\">\n            <button onclick=\"showMiniFeedback('fb3', 'Salah! Tidak sampai huruf E spasi.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-xl\">KODE </button>\n            <button onclick=\"showMiniFeedback('fb3', 'BENAR! Huruf K(0), O(1), D(2), E(3). Batas 4 tidak diikutkan!', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-xl\">KODE</button>\n            <button onclick=\"showMiniFeedback('fb3', 'Salah! Awalnya bukan huruf O.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 text-xl\">ODER</button>\n        </div>\n        <div id=\"fb3\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 4: File Handling \ud83d\udcc1",
        "subtitle": "Baca dan Tulis",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Jika kita ingin MENULIS ulang seluruh isi catatan dari 0 (menghapus yang lama), mode sakelar apa yang kita gunakan di fungsi `open()`?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb4', 'Salah! Mode r (read) hanya untuk membaca.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">open(\"data.txt\", \"r\")</button>\n            <button onclick=\"showMiniFeedback('fb4', 'BENAR! Mode w (write) akan menimpa seluruh file dari awal.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">open(\"data.txt\", \"w\")</button>\n            <button onclick=\"showMiniFeedback('fb4', 'Salah! Mode a (append) menulis DARI BAWAH (melanjutkan).', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono\">open(\"data.txt\", \"a\")</button>\n        </div>\n        <div id=\"fb4\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 5: Turtle Graphics \ud83d\udc22",
        "subtitle": "Posisi Kura-kura",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Agar kura-kura bisa terbang dan berpindah titik (X, Y) <b>tanpa</b> meninggalkan coretan tinta hitam di layar, kombinasi sakti apa yang dipakai?</p>\n        <div class=\"flex flex-col gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb5', 'BENAR! Angkat pena (penup), terbang (goto), turunkan pena (pendown).', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono text-left\">t.penup()  \u27a1\ufe0f  t.goto(x, y)  \u27a1\ufe0f  t.pendown()</button>\n            <button onclick=\"showMiniFeedback('fb5', 'Salah! Speed tidak ada hubungannya dengan tinta.', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50 font-mono text-left\">t.speed(0) \u27a1\ufe0f  t.goto(x, y)</button>\n        </div>\n        <div id=\"fb5\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "The Final Boss: Capstone Project \ud83c\udff0",
        "subtitle": "Proyek Akhir",
        "content": "<div class=\"max-w-4xl mx-auto text-center space-y-6 mt-6\">\n    <div class=\"text-7xl mb-4\">\ud83c\udfc6</div>\n    <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n        Kalian telah melewati 8 minggu latihan yang panjang. <br>Sekarang adalah saatnya <b>Membuktikan Diri</b>!\n    </p>\n    <div class=\"bg-yellow-50 border-l-4 border-yellow-500 p-6 rounded-r-xl text-left shadow-sm mt-8\">\n        <p class=\"text-md text-yellow-900 font-bold mb-2 uppercase tracking-widest text-sm\">Apa itu Capstone Project?</p>\n        <p class=\"text-yellow-800\">Proyek besar mandiri di mana kamu tidak lagi sekadar menyalin kode, melainkan <b>Merancang, Menggabungkan, dan Membangun</b> sebuah aplikasi/game utuh menggunakan semua materi dari Sesi 1 hingga 8!</p>\n    </div>\n</div>"
    },
    {
        "title": "Mengapa Harus Merencanakan? \ud83d\udcdd",
        "subtitle": "Arsitek vs Pekerja",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-2xl font-black text-slate-800\">Jangan Langsung Ngoding!</h3>\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Programmer pemula biasanya langsung membuka IDE dan mengetik kode secara acak, hingga akhirnya <i>stuck</i> (terjebak) dan pusing sendiri.\n        </p>\n        <p class=\"text-md text-slate-600 font-bold mt-4 bg-slate-100 p-4 rounded-lg\">\n            Programmer Pro / Arsitek, selalu membuat cetak biru (Blueprint) dari kertas kosong sebelum meletakkan batu batanya.\n        </p>\n    </div>\n    <div class=\"bg-slate-100 h-64 rounded-xl border-4 border-slate-300 relative overflow-hidden shadow-inner flex flex-col justify-center items-center text-center p-6\">\n        <div class=\"text-6xl mb-4\">\ud83d\udcd0</div>\n        <p class=\"text-red-500 font-bold text-sm\">\"If you fail to plan, you are planning to fail.\"</p>\n        <p class=\"text-slate-500 text-xs mt-2\">- Benjamin Franklin</p>\n    </div>\n</div>"
    },
    {
        "title": "Siklus Software Engineering \ud83d\udd04",
        "subtitle": "SDLC Dasar",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <h3 class=\"text-2xl font-black text-slate-800 mb-6\">4 Tahapan Bikin Game/Aplikasi</h3>\n    <div class=\"flex items-center justify-center gap-4 text-sm font-bold text-slate-700\">\n        <div class=\"bg-blue-100 p-4 rounded-2xl border-2 border-blue-300 flex flex-col items-center gap-2 w-32 shadow-sm\">\n            <span class=\"text-3xl\">\ud83d\udca1</span>\n            <span>1. Ideation</span>\n        </div>\n        <span class=\"text-blue-400 text-2xl\">\u27a1\ufe0f</span>\n        <div class=\"bg-indigo-100 p-4 rounded-2xl border-2 border-indigo-300 flex flex-col items-center gap-2 w-32 shadow-sm\">\n            <span class=\"text-3xl\">\ud83d\uddfa\ufe0f</span>\n            <span>2. Planning</span>\n        </div>\n        <span class=\"text-indigo-400 text-2xl\">\u27a1\ufe0f</span>\n        <div class=\"bg-purple-100 p-4 rounded-2xl border-2 border-purple-300 flex flex-col items-center gap-2 w-32 shadow-sm\">\n            <span class=\"text-3xl\">\ud83d\udcbb</span>\n            <span>3. Coding</span>\n        </div>\n        <span class=\"text-purple-400 text-2xl\">\u27a1\ufe0f</span>\n        <div class=\"bg-pink-100 p-4 rounded-2xl border-2 border-pink-300 flex flex-col items-center gap-2 w-32 shadow-sm\">\n            <span class=\"text-3xl\">\ud83d\udc1b</span>\n            <span>4. Testing</span>\n        </div>\n    </div>\n    <p class=\"mt-8 text-slate-600 bg-slate-100 p-4 rounded-xl border border-slate-200\">\n        Hari ini (Meeting 9) kita akan berfokus menyelesaikan tahap <b>1 (Ideasi)</b> dan <b>2 (Perencanaan)</b>.\n    </p>\n</div>"
    },
    {
        "title": "Tahap 1: Ideation (Curah Gagasan) \ud83d\udca1",
        "subtitle": "Mencari Inspirasi",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-5xl mt-2\">\ud83d\udcad</div>\n        <div class=\"flex-1\">\n            <p class=\"text-xl text-slate-800 font-bold mb-2\">Gagasan Berawal Dari Masalah</p>\n            <p class=\"text-slate-600 font-medium leading-relaxed\">\n                Aplikasi yang hebat adalah aplikasi yang menyelesaikan masalah. <br>Misalnya: \"Aku kesulitan mengingat nilai rapot\" (Buat Aplikasi Data Nilai). Atau \"Aku butuh hiburan tebak-tebakan\" (Buat Game Kuiz).\n            </p>\n            <div class=\"mt-6 border-l-4 border-blue-500 pl-4 bg-blue-50 p-4 rounded-r-xl\">\n                <p class=\"font-bold text-blue-900\">Batasan Sistem Kita:</p>\n                <ul class=\"list-disc pl-5 mt-2 text-sm text-blue-800 space-y-1\">\n                    <li>Hanya menggunakan Python Text (Terminal / Print-Input).</li>\n                    <li>Atau menggunakan Kanvas Visual (Turtle Graphics).</li>\n                    <li>Kita tidak memakai Unity/Roblox di sini! Jadi buat ide yang masuk akal di CLI (Command Line Interface).</li>\n                </ul>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Menu Pilihan Proyek \ud83d\udcdc",
        "subtitle": "Pilih Jalur Ninjamu",
        "content": "<div class=\"max-w-4xl mx-auto space-y-4 mt-2\">\n    <p class=\"text-center text-lg text-slate-700 font-bold mb-4\">Jika kalian kebingungan, kami menyiapkan 3 Templat Ide Besar yang bisa kalian kembangkan!</p>\n    \n    <div class=\"grid grid-cols-1 gap-4\">\n        <div class=\"bg-indigo-50 border-2 border-indigo-200 p-4 rounded-2xl shadow-sm flex gap-4 items-center\">\n            <div class=\"text-4xl\">\ud83d\udd79\ufe0f</div>\n            <div>\n                <p class=\"font-black text-indigo-800 text-lg\">Proyek A: Text-Based RPG / Game Interaktif</p>\n                <p class=\"text-sm text-slate-600 mt-1\">Gunakan List, Dictionary, dan percabangan If/Else untuk membuat petualangan teks yang punya Inventory, Darah (HP), dan Ending berbeda!</p>\n            </div>\n        </div>\n        <div class=\"bg-pink-50 border-2 border-pink-200 p-4 rounded-2xl shadow-sm flex gap-4 items-center\">\n            <div class=\"text-4xl\">\ud83c\udfa8</div>\n            <div>\n                <p class=\"font-black text-pink-800 text-lg\">Proyek B: Turtle Art / Spirograph Generator</p>\n                <p class=\"text-sm text-slate-600 mt-1\">Aplikasi visual menggunakan Turtle. Pengguna bisa mengetik ukuran, warna, dan pola, lalu Kura-Kura akan melukis Mandala menakjubkan di layar.</p>\n            </div>\n        </div>\n        <div class=\"bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl shadow-sm flex gap-4 items-center\">\n            <div class=\"text-4xl\">\ud83d\uddc2\ufe0f</div>\n            <div>\n                <p class=\"font-black text-emerald-800 text-lg\">Proyek C: Aplikasi Kasir / Data Karyawan</p>\n                <p class=\"text-sm text-slate-600 mt-1\">Aplikasi *Dunia Nyata*. Membuat sistem pendataan toko, menu makanan, harga, lalu menyimpan struk/catatan ke dalam sebuah File teks (`.txt`).</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Breakout Diskusi \ud83d\udcac",
        "subtitle": "Tentukan Pilihanmu!",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-center\">\n    <div class=\"bg-white p-8 rounded-3xl border-2 border-slate-200 shadow-lg\">\n        <div class=\"text-7xl mb-6\">\u23f1\ufe0f</div>\n        <h3 class=\"text-3xl font-black text-slate-800 mb-4\">Waktu Penentuan!</h3>\n        <p class=\"text-lg text-slate-600 max-w-xl mx-auto mb-8 font-medium\">\n            Tarik napas dalam-dalam. Apakah kamu ingin menjadi Game Developer (Proyek A), Seniman Digital (Proyek B), atau Software Engineer Bisnis (Proyek C)?\n        </p>\n        <p class=\"text-md text-red-500 font-bold italic mb-4\">Sampaikan Pilihan Proyek kalian kepada Kakak Pengajar sekarang!</p>\n        \n        <div class=\"w-full bg-slate-200 h-2 rounded-full overflow-hidden\">\n            <div class=\"bg-blue-500 h-full animate-pulse w-full\"></div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Tahap 2: Planning (Perencanaan) \ud83d\uddfa\ufe0f",
        "subtitle": "Game Design Document",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl border-4 border-slate-700 shadow-xl flex items-start gap-6\">\n        <div class=\"text-6xl mt-2\">\ud83d\udcdd</div>\n        <div class=\"flex-1\">\n            <h4 class=\"font-black text-2xl text-yellow-400 mb-2\">Game Design Document (GDD)</h4>\n            <p class=\"text-slate-300 font-medium leading-relaxed mb-4\">\n                Setiap game/aplikasi besar punya \"Kitab Suci\" GDD. Dokumen ini mendeskripsikan secara jelas bagaimana game itu dimainkan, apa tujuan akhirnya, dan apa saja alat yang dibutuhkan.\n            </p>\n            <div class=\"bg-slate-800 p-4 rounded-xl border border-slate-600 text-sm space-y-2 text-slate-400 font-bold\">\n                <p>Pertanyaan Utama GDD:</p>\n                <ul class=\"list-disc pl-5 font-normal\">\n                    <li>Siapa karakter/aktor utamanya?</li>\n                    <li>Apa saja input yang diminta dari User?</li>\n                    <li>Apa Output/Hasil akhirnya?</li>\n                </ul>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Bedah Fitur (Contoh Proyek C) \ud83d\uddc2\ufe0f",
        "subtitle": "Sistem Kasir Cafe",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-xl font-black text-emerald-700\">Contoh GDD Kasir:</h3>\n        <ul class=\"list-none text-sm text-slate-700 space-y-3 font-medium bg-emerald-50 p-4 rounded-xl border border-emerald-200\">\n            <li><b>Judul:</b> Cafe Kopi Senja</li>\n            <li><b>Goal:</b> Menghitung harga total pesanan pembeli.</li>\n            <li><b>Senjata Code:</b>\n                <ul class=\"list-disc pl-5 mt-1 text-slate-600 text-xs\">\n                    <li><span class=\"text-purple-600\">Dictionary:</span> Daftar Menu dan Harga.</li>\n                    <li><span class=\"text-blue-600\">While Loop:</span> Terus bertanya \"Pesan apa lagi?\" sampai user mengetik 'selesai'.</li>\n                    <li><span class=\"text-red-600\">List:</span> Menyimpan pesanan dalam troli.</li>\n                    <li><span class=\"text-green-600\">File Handling:</span> Menyimpan Struk total ke .txt.</li>\n                </ul>\n            </li>\n        </ul>\n    </div>\n    <div class=\"bg-slate-900 h-64 rounded-xl border-4 border-emerald-900 relative shadow-xl flex flex-col justify-center items-center text-center p-4\">\n        <div class=\"font-mono text-[10px] text-green-400 text-left bg-black p-3 rounded w-full h-full overflow-y-hidden\">\n            [Sistem] Selamat Datang di Kopi Senja!<br>\n            [Menu] 1. Kopi Hitam (10000)<br>\n            [Menu] 2. Es Teh (5000)<br><br>\n            > Input pesanan: 1<br>\n            [Sistem] Kopi Hitam masuk ke Troli.<br>\n            > Ada lagi? (y/n): n<br>\n            <br>\n            [Sistem] Total: Rp.10.000<br>\n            [Sistem] Menyimpan Struk_123.txt...\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Bedah Fitur (Contoh Proyek A) \u2694\ufe0f",
        "subtitle": "Game RPG Text",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <h3 class=\"text-xl font-black text-indigo-700\">Contoh GDD RPG:</h3>\n        <ul class=\"list-none text-sm text-slate-700 space-y-3 font-medium bg-indigo-50 p-4 rounded-xl border border-indigo-200\">\n            <li><b>Judul:</b> Escape The Dungeon</li>\n            <li><b>Goal:</b> Cari kunci rahasia dan hindari Naga.</li>\n            <li><b>Senjata Code:</b>\n                <ul class=\"list-disc pl-5 mt-1 text-slate-600 text-xs\">\n                    <li><span class=\"text-blue-600\">If/Elif/Else:</span> Menentukan percabangan cerita (Ke kanan ada naga, ke kiri ada peti).</li>\n                    <li><span class=\"text-red-600\">Variabel:</span> HP Player = 100. Kunci = False.</li>\n                    <li><span class=\"text-purple-600\">While Loop:</span> Game tidak akan tamat selama `HP > 0`.</li>\n                    <li><span class=\"text-green-600\">Time Sleep:</span> Membuat teks cerita berjalan dramatis.</li>\n                </ul>\n            </li>\n        </ul>\n    </div>\n    <div class=\"bg-slate-900 h-64 rounded-xl border-4 border-indigo-900 relative shadow-xl flex flex-col justify-center items-center text-center p-4\">\n        <div class=\"font-mono text-[10px] text-indigo-400 text-left bg-black p-3 rounded w-full h-full overflow-y-hidden\">\n            === ESCAPE DUNGEON ===<br>\n            [Story] Kamu terbangun di sel penjara.<br>\n            [Pilihan] A. Dobrak Pintu | B. Cari Lubang<br><br>\n            > Pilihanmu: A<br>\n            [Story] Pintu sangat keras. HP berkurang -10!<br>\n            [Status] HP: 90/100<br>\n            ...\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Apa itu Flowchart? \ud83d\udd00",
        "subtitle": "Diagram Alir Game",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-center\">\n    <h3 class=\"text-2xl font-black text-slate-800\">Flowchart (Diagram Alir)</h3>\n    <p class=\"text-md text-slate-600 max-w-2xl mx-auto font-medium\">\n        Sebelum mengetik *If* dan *While*, kita harus menggambar alur dari Aplikasi/Game kita menggunakan bentuk-bentuk geometris agar logika kita tidak tersesat!\n    </p>\n    <div class=\"flex items-center justify-center gap-6 mt-8\">\n        <div class=\"w-24 h-12 bg-green-200 border-2 border-green-500 rounded-full flex items-center justify-center font-bold text-xs shadow-sm\">Mulai</div>\n        <div class=\"text-xl\">\u27a1\ufe0f</div>\n        <div class=\"w-24 h-16 bg-blue-200 border-2 border-blue-500 rounded flex items-center justify-center font-bold text-xs text-center p-1 shadow-sm\">Pilih Senjata</div>\n        <div class=\"text-xl\">\u27a1\ufe0f</div>\n        <div class=\"w-24 h-24 bg-yellow-200 border-2 border-yellow-500 flex items-center justify-center font-bold text-[10px] text-center transform rotate-45 shadow-sm\">\n            <span class=\"transform -rotate-45 block leading-tight\">Apakah<br>Menang?</span>\n        </div>\n        <div class=\"text-xl\">\u27a1\ufe0f</div>\n        <div class=\"w-24 h-12 bg-red-200 border-2 border-red-500 rounded-full flex items-center justify-center font-bold text-xs shadow-sm\">Tamat</div>\n    </div>\n</div>"
    },
    {
        "title": "Simbol-Simbol Flowchart Dasar \ud83d\udd23",
        "subtitle": "Bentuk Punya Arti",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"grid grid-cols-2 gap-4\">\n        <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4\">\n            <div class=\"w-16 h-8 bg-green-200 border-2 border-green-600 rounded-full flex-shrink-0\"></div>\n            <div>\n                <p class=\"font-bold text-slate-800\">Oval (Terminator)</p>\n                <p class=\"text-xs text-slate-500\">Tanda Mulai (Start) dan Selesai (End) dari sebuah program.</p>\n            </div>\n        </div>\n        \n        <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4\">\n            <div class=\"w-16 h-12 bg-blue-200 border-2 border-blue-600 flex-shrink-0 flex items-center justify-center\"></div>\n            <div>\n                <p class=\"font-bold text-slate-800\">Persegi (Proses)</p>\n                <p class=\"text-xs text-slate-500\">Melakukan perhitungan, mengurangi HP, menetapkan variabel, menambah List.</p>\n            </div>\n        </div>\n        \n        <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4\">\n            <div class=\"w-16 h-10 bg-purple-200 border-2 border-purple-600 skew-x-[-20deg] flex-shrink-0\"></div>\n            <div>\n                <p class=\"font-bold text-slate-800\">Jajar Genjang (I/O)</p>\n                <p class=\"text-xs text-slate-500\">Input dari user (contoh: minta nama), dan Output (Print ke layar).</p>\n            </div>\n        </div>\n        \n        <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4\">\n            <div class=\"w-12 h-12 bg-yellow-200 border-2 border-yellow-600 transform rotate-45 flex-shrink-0 ml-2 mt-2\"></div>\n            <div>\n                <p class=\"font-bold text-slate-800 mt-2\">Belah Ketupat (Decision)</p>\n                <p class=\"text-xs text-slate-500\">Logika IF / Percabangan. Memecah panah menjadi 2 rute (Ya atau Tidak).</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Tebak Bentuk! \ud83e\udde9",

        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 shadow-sm flex items-start gap-4\">\n        <div class=\"text-4xl\">\ud83d\udc7b</div>\n        <div class=\"flex-1\">\n            <p class=\"text-lg text-indigo-900 font-bold mb-2\">Pseudocode (Kode Palsu / Bayangan)</p>\n            <p class=\"text-slate-700 font-medium\">Jika flowchart menggambar alur dengan diagram balok, Pseudocode adalah menulis alur menggunakan bahasa manusia setengah-program! Tujuannya agar kita paham algoritmanya tanpa takut salah Syntax (titik dua, kurung, error indentasi).</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose mt-4 grid grid-cols-2 gap-4\">\n        <div>\n            <p class=\"text-yellow-400 font-bold border-b border-slate-700 pb-2 mb-2\">Pseudocode (Bahasa Manusia)</p>\n            SET nyawa = 100<br>\n            TANYA \"Mau pergi kemana?\"<br>\n            JIKA jawaban == \"Gua\":<br>\n            &nbsp;&nbsp;nyawa KURANGI 50<br>\n            &nbsp;&nbsp;CETAK \"Kena jebakan!\"\n        </div>\n        <div class=\"border-l border-slate-700 pl-4\">\n            <p class=\"text-green-400 font-bold border-b border-slate-700 pb-2 mb-2\">Kode Python Asli</p>\n            nyawa = 100<br>\n            jawaban = input(\"Mau pergi kemana? \")<br>\n            if jawaban == \"Gua\":<br>\n            &nbsp;&nbsp;nyawa -= 50<br>\n            &nbsp;&nbsp;print(\"Kena jebakan!\")\n        </div>\n    </div>\n</div>"

        // --- DOM Elements ---
        const els = {
            meetingNav: document.getElementById('meetingNav'),
            slideContainer: document.getElementById('slideContainer'),
            slideTitle: document.getElementById('slideTitle'),
            slideSubtitle: document.getElementById('slideSubtitle'),
            slideContent: document.getElementById('slideContent'),
            meetingTag: document.getElementById('meetingTag'),
            slideCounter: document.getElementById('slideCounter'),
            progressBar: document.getElementById('progressBar'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            hamburgerBtn: document.getElementById('hamburgerBtn'),
            closeSidebarBtn: document.getElementById('closeSidebarBtn'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            mainScrollArea: document.getElementById('mainScrollArea')
        };

        // --- Initialization ---
        function init() {
            if (typeof checkTeacherName === 'function') {
                checkTeacherName();
            }
            renderSidebar();
            renderSlide();
        }

        // --- Core Functions ---

        // --- Instructor Name Logic ---
        function saveInstructorName() {
            const input = document.getElementById('instructorInput');
            if (input && input.value.trim() !== "") {
                localStorage.setItem('kalananti_instructor_name', input.value.trim());
                renderInstructorName();
            }
        }

        function resetInstructorName() {
            localStorage.removeItem('kalananti_instructor_name');
            renderInstructorName();
        }

        function renderInstructorName() {
            const container = document.getElementById('instructor-name-container');
            if (!container) return;

            const storedName = localStorage.getItem('kalananti_instructor_name');

            if (storedName) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <h3 class="text-3xl font-extrabold text-slate-800 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-green-500">
                            Halo, saya Kak ${storedName}!
                        </h3>
                        <button onclick="resetInstructorName()" class="text-xs text-slate-800/50 hover:text-red-400 underline transition-colors">
                            Ganti Nama
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex flex-col items-center gap-3">
                        <label class="text-slate-600 font-medium">Siapa nama Kakak?</label>
                        <div class="flex gap-2">
                            <input type="text" id="instructorInput" placeholder="Ketik nama di sini..." 
                                class="border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none w-64 text-center"
                                onkeypress="if(event.key === 'Enter') saveInstructorName()">
                            <button onclick="saveInstructorName()" class="bg-blue-600 text-slate-800 px-4 py-2 rounded-lg hover:bg-blue-700 transition-all font-bold shadow-md">
                                Simpan
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function showMiniFeedback(targetId, message, type = 'success') {
            const target = document.getElementById(targetId);
            if (!target) return;

            const styles = {
                success: 'bg-green-50 border-green-200 text-green-800',
                warn: 'bg-yellow-50 border-yellow-200 text-yellow-800',
                error: 'bg-red-50 border-red-200 text-red-800'
            };

            target.className = `rounded-xl border p-3 text-sm font-semibold ${styles[type] || styles.success}`;
            target.textContent = message;
        }

        function toggleReveal(targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;
            target.classList.toggle('hidden');
        }

        function renderSidebar() {
            els.meetingNav.innerHTML = '';
            for (let i = 1; i <= totalMeetings; i++) {
                const btn = document.createElement('button');
                const isActive = (i === currentMeeting);
                
                const isLocked = !meetingData[i];
                
                const baseClasses = "w-full text-left p-4 rounded-2xl transition-all duration-300 flex items-center gap-4 meeting-tab";
                const activeClasses = "active";
                const inactiveClasses = isLocked 
                    ? "opacity-40 cursor-not-allowed bg-transparent text-muted" 
                    : "hover:bg-white/5 text-[var(--text)]";
                
                btn.className = `${baseClasses} ${isActive ? activeClasses : inactiveClasses}`;
                if (!isLocked) btn.onclick = () => switchMeeting(i);
                
                const circleClass = isActive 
                    ? "bg-gradient-to-br from-k-blue to-k-blue-d text-white shadow-lg shadow-k-blue/40 border border-k-blue/50" 
                    : "bg-[var(--bg2)] text-muted border border-[var(--card-b)]";

                const mainSlide = meetingData[i] ? (meetingData[i].find(s => s.title.startsWith(`Meeting ${i}:`)) || meetingData[i][0]) : null;
                
                let topic = "Belum tersedia";
                if (mainSlide) {
                    const titleParts = mainSlide.title.split(': ');
                    if (titleParts.length > 1) {
                         topic = titleParts[1]; 
                    } else {
                        topic = mainSlide.subtitle || "Klik untuk mulai";
                    }
                }

                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-sm font-black transition-all duration-300 ${circleClass} font-display">
                        ${i}
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="text-[14px] font-black truncate uppercase tracking-wider ${isActive ? 'text-[var(--text)]' : (isLocked ? 'text-muted' : 'text-[var(--text)]/80')}">Misi ${i}</div>
                        <div class="text-[10px] font-bold uppercase tracking-widest truncate ${isActive ? 'text-k-blue' : (isLocked ? 'text-muted/60' : 'text-muted')} mt-1">${topic}</div>
                    </div>
                    ${isActive ? '<span class="text-k-yellow font-bold ml-2 text-xl">✦</span>' : ''}
                `;
                
                els.meetingNav.appendChild(btn);
            }
        }

        function switchMeeting(meetNum) {
            currentMeeting = meetNum;
            currentSlide = 1;
            renderSidebar();
            renderSlide();
            closeSidebar(); // On mobile
        }

        function renderSlide() {
             // Animate Out
            els.slideContainer.style.opacity = '0';
            els.slideContainer.style.transform = 'translateY(10px) scale(0.98)';

            setTimeout(() => {
                // Update Content
                const slides = meetingData[currentMeeting];
                const slide = slides[currentSlide - 1];

                els.meetingTag.textContent = `Meeting ${currentMeeting}`; // Update tag
                els.slideTitle.textContent = slide.title;
                els.slideSubtitle.textContent = slide.subtitle;
                els.slideContent.innerHTML = slide.content;

                // Update Footer
                els.slideCounter.textContent = `Slide ${currentSlide} / ${slides.length}`;
                
                // Update Progress Bar
                const progressPercent = (currentSlide / slides.length) * 100;
                els.progressBar.style.width = `${progressPercent}%`;

                // Update Buttons
                els.prevBtn.disabled = (currentSlide === 1);
                els.nextBtn.disabled = (currentSlide === slides.length);

                // Animate In
                els.slideContainer.style.opacity = '1';
                els.slideContainer.style.transform = 'translateY(0) scale(1)';

                // Render Instructor Name if applicable
                if (currentMeeting === 1 && currentSlide === 1) {
                    renderInstructorName();
                }
                
                // Reset Scroll
                els.mainScrollArea.scrollTop = 0;

            }, 300);
        }

        function nextSlide() {
            const slides = meetingData[currentMeeting];
            if (currentSlide < slides.length) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                renderSlide();
            }
        }

        // --- Sidebar Logic ---
        function openSidebar() {
            els.sidebar.classList.remove('-translate-x-full');
            els.sidebarOverlay.classList.remove('hidden');
            setTimeout(() => els.sidebarOverlay.classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            els.sidebar.classList.add('-translate-x-full');
            els.sidebarOverlay.classList.add('hidden');
        }

        // --- Event Listeners ---
        els.nextBtn.addEventListener('click', nextSlide);
        els.prevBtn.addEventListener('click', prevSlide);
        
        els.hamburgerBtn.addEventListener('click', openSidebar);
        els.closeSidebarBtn.addEventListener('click', closeSidebar);
        els.sidebarOverlay.addEventListener('click', closeSidebar);

        // Keyboard Nav
        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement?.tagName?.toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea') return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Start
        init();

    </script>
</body>
