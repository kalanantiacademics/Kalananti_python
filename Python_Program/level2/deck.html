        "subtitle": "Tukar Guling",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6 mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-xl font-mono text-sm shadow-lg border border-slate-700 text-left\">\nteks = \"Hari ini panas\"<br>\nprint(teks.replace(\"panas\", \"hujan\"))\n    </div>\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center shadow-sm\">\n        <p class=\"font-bold text-slate-700 text-lg\">Cukup Jelas! Apa hasil kalimanya?</p>\n        <div class=\"grid grid-cols-2 gap-4 mt-6\">\n            <button onclick=\"showMiniFeedback('fb5', 'BENAR! Kata panas dicari lalu diganti menjadi hujan.', 'success')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50\">Hari ini hujan</button>\n            <button onclick=\"showMiniFeedback('fb5', 'Salah!', 'error')\" class=\"p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-slate-50\">Hari ini panas hujan</button>\n        </div>\n        <div id=\"fb5\" class=\"mt-4 min-h-[40px] flex items-center justify-center\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Masalah Variabel \ud83d\udea8",
        "subtitle": "Amnesia Komputer",
        "content": "<div class=\"text-center space-y-6 mt-4\">\n    <div class=\"text-7xl mb-4\">\ud83e\udd2f</div>\n    <p class=\"text-lg text-slate-700 leading-relaxed max-w-2xl mx-auto\">\n        Variabel yang kita pelajari (seperti List, Dictionary, String) tersimpan di memori yang bernama <b>RAM (Random Access Memory)</b>.\n    </p>\n    <div class=\"bg-red-50 border-l-4 border-red-500 p-6 rounded-r-xl max-w-xl mx-auto text-left shadow-sm\">\n        <p class=\"font-bold text-red-800\">Kelemahan Fatal RAM:</p>\n        <p class=\"text-sm text-red-700 mt-2\">RAM itu bersifat sementara. Jika program Python di-Stop atau listrik mati, <b>semua data variabel kalian akan musnah tanpa sisa!</b></p>\n    </div>\n</div>"
    },
    {
        "title": "Analogi: RAM vs Harddisk \ud83e\udde0",
        "subtitle": "Sementara vs Permanen",
        "content": "<div class=\"grid grid-cols-2 gap-8 items-center max-w-4xl mx-auto mt-6\">\n    <div class=\"text-center bg-slate-50 p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative overflow-hidden\">\n        <div class=\"absolute -right-4 -top-4 text-8xl opacity-10\">\ud83d\udcad</div>\n        <h4 class=\"font-black text-slate-800 text-xl mb-4\">Otak (RAM)</h4>\n        <div class=\"text-6xl mb-4\">\ud83d\udcad</div>\n        <p class=\"text-sm text-slate-600 font-bold\">Variabel (List, Dict)</p>\n        <p class=\"text-xs text-slate-500 mt-2 bg-slate-200 py-1 rounded\">Cepat, tapi cepat lupa</p>\n    </div>\n    <div class=\"text-center bg-blue-50 p-8 rounded-3xl border-2 border-blue-200 shadow-md relative overflow-hidden\">\n        <div class=\"absolute -right-4 -top-4 text-8xl opacity-10\">\ud83d\uddc4\ufe0f</div>\n        <h4 class=\"font-black text-blue-800 text-xl mb-4\">Buku Catatan (Harddisk)</h4>\n        <div class=\"text-6xl mb-4\">\ud83d\uddc4\ufe0f</div>\n        <p class=\"text-sm text-blue-600 font-bold\">File System (.txt, .csv)</p>\n        <p class=\"text-xs text-blue-500 mt-2 bg-blue-200 py-1 rounded\">Lambat dikit, tapi abadi</p>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Listrik Mati \u26a1",
        "subtitle": "Selamatkan Datamu!",
        "content": "<div class=\"relative w-full h-[350px] bg-slate-800 rounded-2xl overflow-hidden border-2 border-slate-700 flex flex-col items-center justify-center mt-2 group\">\n    <style>\n        .ram-data { transition: 1s ease-out; }\n        .hdd-data { transition: 1s ease-out; opacity: 0.3; }\n        .group:hover .ram-data { opacity: 0; filter: blur(10px); transform: translateY(-50px); }\n        .group:hover .hdd-data { opacity: 1; transform: scale(1.1); box-shadow: 0 0 30px #22c55e;}\n        .group:hover { animation: blackout 3s forwards; }\n        @keyframes blackout { 0% {background: #1e293b;} 10% {background: #000;} 15% {background: #1e293b;} 20% {background: #000;} 100% {background: #000;} }\n    </style>\n    \n    <div class=\"flex gap-12 w-full justify-center\">\n        <div class=\"text-center ram-data\">\n            <h3 class=\"text-yellow-400 font-bold mb-4 font-mono\">RAM (Variabel)</h3>\n            <div class=\"bg-yellow-400/20 text-yellow-100 p-6 rounded-xl border border-yellow-500/50 shadow-[0_0_15px_#facc15]\">skor = 999</div>\n        </div>\n        <div class=\"text-center hdd-data\">\n            <h3 class=\"text-green-400 font-bold mb-4 font-mono\">Harddisk (data.txt)</h3>\n            <div class=\"bg-slate-700 text-green-400 p-6 rounded-xl border-2 border-green-500\">skor = 999</div>\n        </div>\n    </div>\n    \n    <p class=\"absolute bottom-6 text-slate-400 text-sm italic z-10 bg-slate-900 px-4 py-1 rounded-full border border-slate-700\">Hover/Sentuh kotak ini untuk mematikan listrik!</p>\n</div>"
    },
    {
        "title": "Solusi: File Handling \ud83d\udcbe",
        "subtitle": "Mencatat ke Harddisk",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-center mt-6\">\n    <div class=\"text-7xl\">\ud83d\udcdd</div>\n    <div class=\"bg-white p-8 border-2 border-slate-200 rounded-3xl shadow-lg text-left\">\n        <p class=\"text-xl text-slate-700 mb-6 leading-relaxed\"><b>File Handling</b> adalah kemampuan program Python untuk memerintahkan komputer membuat, membaca, menulis, atau menghapus File sungguhan (seperti `.txt`, `.csv`) di dalam Harddisk / SSD kita.</p>\n        <p class=\"text-lg text-slate-600\">Dengan begitu, saat komputer mati lalu dinyalakan lagi, data level game, skor, atau password tidak akan hilang!</p>\n    </div>\n</div>"
    },
    {
        "title": "3 Langkah Wajib \ud83c\udf1f",
        "subtitle": "SOP Mengelola File",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"flex justify-between items-center bg-slate-50 p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative\">\n        <div class=\"absolute top-1/2 left-0 w-full h-1 bg-slate-200 -z-0 -translate-y-1/2\"></div>\n        \n        <div class=\"text-center bg-white p-4 rounded-full border-4 border-blue-400 w-32 h-32 flex flex-col justify-center items-center shadow-lg relative z-10\">\n            <div class=\"text-3xl mb-1\">\ud83d\udd13</div>\n            <p class=\"font-bold text-slate-800 text-sm\">1. Buka File</p>\n        </div>\n        \n        <div class=\"text-center bg-white p-4 rounded-full border-4 border-yellow-400 w-32 h-32 flex flex-col justify-center items-center shadow-lg relative z-10\">\n            <div class=\"text-3xl mb-1\">\u270d\ufe0f</div>\n            <p class=\"font-bold text-slate-800 text-sm\">2. Proses (Baca/Tulis)</p>\n        </div>\n        \n        <div class=\"text-center bg-white p-4 rounded-full border-4 border-green-400 w-32 h-32 flex flex-col justify-center items-center shadow-lg relative z-10\">\n            <div class=\"text-3xl mb-1\">\ud83d\udd12</div>\n            <p class=\"font-bold text-slate-800 text-sm\">3. Tutup File</p>\n        </div>\n    </div>\n    <p class=\"text-center mt-6 text-slate-600 font-medium\">Sama seperti lemari arsip: Buka lemarinya, baca kertasnya, lalu TUTUP lagi agar tidak dimakan rayap!</p>\n</div>"
    },
    {
        "title": "Konsep: Parameter Mode \ud83c\udf9b\ufe0f",
        "subtitle": "Hak Akses File",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 text-center shadow-sm\">\n        <p class=\"text-lg text-indigo-900 font-medium\">Saat kita mau membuka file, Python akan bertanya: <b>\"Kamu mau buka file ini untuk apa?\"</b></p>\n    </div>\n    <p class=\"text-md text-slate-600\">Ada 3 mode utama (hak akses) yang harus kita beritahu ke Python:</p>\n    <div class=\"flex justify-center gap-6\">\n        <div class=\"bg-blue-600 text-white font-mono font-bold px-6 py-4 rounded-xl text-2xl shadow-lg\">\"r\"</div>\n        <div class=\"bg-red-600 text-white font-mono font-bold px-6 py-4 rounded-xl text-2xl shadow-lg\">\"w\"</div>\n        <div class=\"bg-green-600 text-white font-mono font-bold px-6 py-4 rounded-xl text-2xl shadow-lg\">\"a\"</div>\n    </div>\n</div>"
    },
    {
        "title": "Mode 'r' (Read) \ud83d\udc53",
        "subtitle": "Hanya Boleh Membaca",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-blue-50 border-2 border-blue-200 rounded-3xl shadow-sm\">\n        <div class=\"text-6xl\">\ud83d\udc53</div>\n        <div>\n            <h4 class=\"font-black text-2xl text-blue-900 mb-2 font-mono\">Mode \"r\" (Read)</h4>\n            <p class=\"text-lg text-blue-800\">Mode default. Digunakan jika kita hanya ingin <b>membaca isi file</b> tanpa merubahnya sama sekali.</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-100 p-4 border-l-4 border-red-500 rounded font-medium text-slate-700\">\n        \u26a0\ufe0f Jika filenya tidak ada, mode ini akan menghasilkan ERROR (FileNotFoundError).\n    </div>\n</div>"
    },
    {
        "title": "Mode 'w' (Write) \u270d\ufe0f",
        "subtitle": "Mode Penghancur",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-red-50 border-2 border-red-200 rounded-3xl shadow-sm relative overflow-hidden\">\n        <div class=\"absolute -right-4 -top-4 text-9xl opacity-10\">\ud83e\udde8</div>\n        <div class=\"text-6xl relative z-10\">\u270d\ufe0f</div>\n        <div class=\"relative z-10\">\n            <h4 class=\"font-black text-2xl text-red-900 mb-2 font-mono\">Mode \"w\" (Write)</h4>\n            <p class=\"text-lg text-red-800\">Membuka file untuk <b>ditulisi data baru</b>.</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-100 p-4 border-l-4 border-red-600 rounded font-bold text-red-700 flex gap-4 items-start shadow-sm\">\n        <span class=\"text-2xl\">\u26a0\ufe0f</span>\n        <p>AWAS HATI-HATI! Jika filenya sudah ada isinya, isinya akan langsung <b>DIHAPUS/DITIMPA DARI AWAL</b>. Jika filenya belum ada, Python akan membuatkannya secara otomatis.</p>\n    </div>\n</div>"
    },
    {
        "title": "Mode 'a' (Append) \u2795",
        "subtitle": "Mode Penambah Aman",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-green-50 border-2 border-green-200 rounded-3xl shadow-sm\">\n        <div class=\"text-6xl\">\u2795</div>\n        <div>\n            <h4 class=\"font-black text-2xl text-green-900 mb-2 font-mono\">Mode \"a\" (Append)</h4>\n            <p class=\"text-lg text-green-800\">Membuka file untuk ditulisi, tapi tulisan barunya akan <b>diselipkan di baris paling bawah</b> (Akhir dokumen).</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-100 p-4 border-l-4 border-green-500 rounded font-medium text-slate-700\">\n        \ud83d\udca1 Sangat cocok untuk membuat fitur Log Aktivitas (Misal: Mencatat orang yang masuk server setiap hari tanpa menghapus catatan kemarin).\n    </div>\n</div>"
    },
    {
        "title": "Mini Quiz: Tebak Mode \u23f1\ufe0f",
        "subtitle": "r, w, atau a?",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-left\">\n        <p class=\"font-bold text-slate-700 text-lg mb-4 text-center\">Kamu ingin menambahkan 1 skor baru di file 'highscores.txt' tanpa menghapus skor pemenang sebelumnya. Mode apa yang dipakai?</p>\n        <div class=\"grid grid-cols-3 gap-4\">\n            <button onclick=\"showMiniFeedback('qm1', 'Salah! Mode r hanya untuk membaca, tidak bisa mengubah data.', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-2xl font-mono text-blue-600\">\"r\"</button>\n            <button onclick=\"showMiniFeedback('qm1', 'Gawat! Mode w akan menghapus semua skor lama dan mereset filenya!', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-2xl font-mono text-red-600\">\"w\"</button>\n            <button onclick=\"showMiniFeedback('qm1', 'BENAR! Mode a (Append) akan menambahkan skor di baris paling bawah secara aman.', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-2xl font-mono text-green-600\">\"a\"</button>\n        </div>\n        <div id=\"qm1\" class=\"mt-4 min-h-[40px] flex items-center justify-center font-bold\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 1: Membuka File \ud83d\udd13",
        "subtitle": "Fungsi open()",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Gunakan fungsi bawaan <code>open()</code> untuk meminta OS (Windows/Mac) membukakan file untuk kita.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># variabel = open(\"nama_file\", \"mode\")</span><br><br>\nbuku = <span class=\"text-yellow-400 font-bold\">open</span>(<span class=\"text-green-400\">\"data.txt\"</span>, <span class=\"text-blue-400 font-bold\">\"r\"</span>)<br>\n<br>\n<span class=\"text-slate-500\"># Saat ini file data.txt sudah TERBUKA di background!</span>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 2: Membaca (.read) \ud83d\udc53",
        "subtitle": "Sedot isi file",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Setelah file berstatus \"terbuka\", gunakan <code>.read()</code> untuk menyedot semua teks yang ada di dalamnya menjadi sebuah String panjang.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nbuku = open(\"data.txt\", \"r\")<br><br>\n<span class=\"text-slate-500\"># Sedot isinya, simpan ke variabel isi_teks</span><br>\nisi_teks = buku.<span class=\"text-yellow-400 font-bold\">read()</span><br>\nprint(isi_teks)<br>\n    </div>\n</div>"
    },
    {
        "title": "Alternatif: .readlines() \ud83d\udcda",
        "subtitle": "Baca jadi List Array",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Jika filenya adalah puisi atau list data berbaris-baris, lebih enak disedot menggunakan <code>.readlines()</code> (Pakai 's').</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nbuku = open(\"data.txt\", \"r\")<br><br>\n<span class=\"text-slate-500\"># Sedot per baris menjadi Array List</span><br>\ndaftar_baris = buku.<span class=\"text-yellow-400 font-bold\">readlines()</span><br>\nprint(daftar_baris)<br>\n<br>\n<span class=\"text-green-400 mt-2 block text-sm font-bold\"># Output: ['Baris 1', 'Baris 2', 'Baris 3']</span>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 3: Menutup File \ud83d\udd12",
        "subtitle": "Sangat Krusial!",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Setelah selesai membaca/menulis, JANGAN LUPA menutup file menggunakan <code>.close()</code>.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nbuku = open(\"data.txt\", \"r\")<br>\nisi_teks = buku.read()<br><br>\n<span class=\"text-slate-500\"># Kunci kembali filenya agar aman!</span><br>\nbuku.<span class=\"text-red-400 font-bold\">close()</span><br>\n    </div>\n</div>"
    },
    {
        "title": "Kenapa Wajib di-close? \ud83d\udea8",
        "subtitle": "Bahaya Memory Leak",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center space-y-6\">\n    <div class=\"text-7xl\">\ud83d\udd25</div>\n    <div class=\"bg-red-50 p-6 rounded-2xl border-2 border-red-200 text-left shadow-sm\">\n        <p class=\"font-bold text-red-900 text-xl mb-4 flex items-center gap-2\"><span>\u26a0\ufe0f</span> Bahaya Fatal:</p>\n        <ul class=\"list-disc pl-6 text-red-800 space-y-3 font-medium leading-relaxed\">\n            <li>File akan terus \"nyangkut\" di RAM komputer (Memory Leak) bikin komputer lemot!</li>\n            <li>Jika kita mencoba menulis ke file tapi lupa `.close()`, seringkali tulisannya gagal tersimpan (belum di-*flush* ke harddisk).</li>\n            <li>Program lain di Windows/Mac tidak akan bisa menghapus file tersebut karena sedang \"in use\" oleh Python.</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Membuat File Biodata",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83d\udcdd</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kakak Pengajar akan mencontohkan cara membuat file TXT baru langsung dari kodingan Python, dan menjejalinya dengan data!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Bedah Kode di Sebelah \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 1: Mode 'w'",
        "subtitle": "Membuat File Kosong",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400 block mb-2\"># Kita minta Python buka file di mode W</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block\">fileku = open(\"biodata.txt\", \"w\")</span><br>\n<span class=\"opacity-20 block\">fileku.write(\"Nama: Koder Cilik\")</span><br>\n<span class=\"opacity-20 block\">fileku.close()</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Karena kita memakai mode <code>\"w\"</code> (Write), Python akan mengecek folder kita. Karena file <code>biodata.txt</code> belum ada, Python otomatis akan <b>menciptakan file baru kosong</b> tersebut!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 2: Menulis isi",
        "subtitle": "Method .write()",

    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Baca File Misteri",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 h-[400px]\">\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col\">\n        <h4 class=\"font-black text-2xl text-slate-800\">Tugasmu:</h4>\n        <p class=\"text-sm text-slate-600 flex-1\">\n            Di program ini, kita sudah menyediakan file <code>\"rahasia.txt\"</code> diam-diam.<br><br>\n            Tulis kode untuk:<br>\n            1. Buka file \"rahasia.txt\" dengan mode baca (\"r\").<br>\n            2. Gunakan <code>.read()</code> dan simpan ke variabel `isi`.<br>\n            3. Tutup file pakai `.close()`.<br>\n            4. Print `isi` untuk melihat pesan rahasianya!\n        </p>\n        <div>\n            <button onclick=\"toggleReveal('ans-ex1')\" class=\"w-full px-4 py-3 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl font-bold text-sm text-slate-700 transition-colors shadow-sm\">Bocoran Jawaban \ud83d\ude48</button>\n            <div id=\"ans-ex1\" class=\"hidden mt-4 bg-green-50 p-4 border border-green-200 rounded-xl text-xs text-green-800 font-mono shadow-inner\">\n                f = open(\"rahasia.txt\", \"r\")<br>isi = f.read()<br>f.close()<br>print(isi)\n            </div>\n        </div>\n    </div>\n    <div class=\"border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative h-full bg-[#1e1e1e]\">\n        <py-repl class=\"h-full w-full text-xs\"># [SETUP RAHASIA - JANGAN DIHAPUS]\nopen(\"rahasia.txt\", \"w\").write(\"Kamu menemukan telur paskah!\")\n# --------------------------------\n\n# 1. Buka File:\n\n\n# 2. Baca isi file:\n\n\n# 3. Tutup File:\n\n\n# 4. Print isi:\n</py-repl>\n    </div>\n</div>"
    },
    {
        "title": "Senjata Rahasia \ud83d\udee1\ufe0f",
        "subtitle": "Solusi Lupa .close()",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center space-y-6\">\n    <div class=\"text-7xl\">\ud83e\uddf2</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Karena *Programmer* juga manusia yang sering lupa mengetik <code>.close()</code>, Python punya syntax modern yang super aman: <b>Context Manager</b> (menggunakan `with`).\n    </p>\n    <div class=\"bg-emerald-50 p-6 rounded-2xl border-2 border-emerald-200 text-emerald-900 font-bold inline-block shadow-sm\">\n        File akan OTOMATIS tertutup sendiri meskipun terjadi Error!\n    </div>\n</div>"
    },
    {
        "title": "Syntax: with open() \ud83d\udee1\ufe0f",
        "subtitle": "Aman Sentosa",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-6\">\n    <p class=\"text-lg text-slate-700\">Mulai hari ini biasakan menggunakan <code>with open(...) as ... :</code></p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># with open(\"nama_file\", \"mode\") as nama_variabel:</span><br><br>\n<span class=\"text-yellow-400 font-bold\">with</span> open(\"data.txt\", \"r\") <span class=\"text-yellow-400 font-bold\">as</span> file_saya<span class=\"text-red-400 font-bold\">:</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;isi = file_saya.read()<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(isi)<br><br>\n<span class=\"text-slate-500\"># Tidak perlu file_saya.close()! Begitu keluar dari spasi menjorok (indentasi), file langsung ditutup otomatis oleh Python!</span>\n    </div>\n</div>"
    },
    {
        "title": "Kenapa 'with' lebih baik? \ud83e\udd14",
        "subtitle": "Mencegah Bencana",
        "content": "<div class=\"grid grid-cols-2 gap-8 items-center max-w-4xl mx-auto mt-6\">\n    <div class=\"text-center bg-red-50 p-6 rounded-3xl border-2 border-red-200 shadow-sm text-left\">\n        <h4 class=\"font-black text-red-800 text-lg mb-4\">Cara Lama</h4>\n        <div class=\"font-mono text-xs text-slate-600 leading-loose\">\n            f = open(\"data.txt\")<br>\n            <span class=\"text-red-500\">print( 10 / 0 ) # PROGRAM ERROR/MATI DISINI</span><br>\n            f.close() <span class=\"text-red-500 font-bold\"><-- TIDAK PERNAH DIJALANKAN (MEMORY LEAK)</span>\n        </div>\n    </div>\n    <div class=\"text-center bg-green-50 p-6 rounded-3xl border-2 border-green-200 shadow-md text-left transform hover:scale-105 transition-transform\">\n        <h4 class=\"font-black text-green-800 text-lg mb-4\">Cara Modern (With)</h4>\n        <div class=\"font-mono text-xs text-slate-600 leading-loose\">\n            with open(\"data.txt\") as f:<br>\n            &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-red-500\">print( 10 / 0 ) # PROGRAM MATI</span><br>\n            <br>\n            <span class=\"text-green-600 font-bold font-sans italic\">**Python mendeteksi error, dan langsung OTOMATIS nge-close file f sebelum crash! Aman!**</span>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan: Menulis Data \u270d\ufe0f",
        "subtitle": "Mode w & enter",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <p class=\"text-lg text-slate-700\">Jika kalian memanggil <code>.write()</code> berkali-kali, teks akan menempel ke samping karena write() tidak otomatis menambahkan \"Enter\".</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nwith open(\"surat.txt\", \"w\") as f:<br>\n&nbsp;&nbsp;&nbsp;&nbsp;f.write(\"Baris Satu \")<br>\n&nbsp;&nbsp;&nbsp;&nbsp;f.write(\"Baris Dua\")<br><br>\n<span class=\"text-green-400 block font-bold text-sm\"># Output di notepad: \"Baris Satu Baris Dua\" (Tidak turun ke bawah)</span>\n    </div>\n</div>"
    },
    {
        "title": "Rahasia Turun Baris: \\n \u21b5",
        "subtitle": "Karakter Newline",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4 text-left\">\n    <div class=\"flex items-center gap-6 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl font-mono font-bold text-blue-500\">\\n</div>\n        <p class=\"text-lg text-slate-700 font-medium\">Dalam bahasa pemrograman, enter (ganti baris) disimbolkan dengan karakter tak kasat mata: <b>\n</b> (singkatan dari <i>newline</i>).</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nwith open(\"surat.txt\", \"w\") as f:<br>\n&nbsp;&nbsp;&nbsp;&nbsp;f.write(\"Baris Satu<span class=\"text-yellow-400 font-bold\">\\n</span>\")<br>\n&nbsp;&nbsp;&nbsp;&nbsp;f.write(\"Baris Dua<span class=\"text-yellow-400 font-bold\">\\n</span>\")<br>\n    </div>\n    <p class=\"text-sm font-bold text-slate-500 italic mt-2\">*Note: Selalu sertakan \n jika ingin menulis format bertumpuk ke bawah.</p>\n</div>"
    },
    {
        "title": "Visualisasi: 'w' vs 'a' \ud83e\udd4a",
        "subtitle": "Write (Timpa) vs Append (Tambah)",
        "content": "<div class=\"max-w-4xl mx-auto text-center mt-6 p-8 bg-slate-800 rounded-3xl border-4 border-slate-700\">\n    <div class=\"flex gap-8 justify-center mb-8\">\n        <button onclick=\"document.getElementById('sim-file').innerHTML = '<span class='text-blue-400'>Data Baru\\n</span>'\" class=\"px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded shadow border-b-4 border-red-700 active:translate-y-1 active:border-b-0 font-mono\">mode \"w\"</button>\n        <button onclick=\"document.getElementById('sim-file').innerHTML += '<span class='text-green-400'>Data Baru\\n</span>'\" class=\"px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded shadow border-b-4 border-green-700 active:translate-y-1 active:border-b-0 font-mono\">mode \"a\"</button>\n    </div>\n    \n    <div class=\"bg-white p-6 rounded text-left font-mono min-h-[150px] whitespace-pre-line text-lg shadow-inner border-2 border-slate-400\" id=\"sim-file\">Teks Asli\n</div>\n    <button onclick=\"document.getElementById('sim-file').innerHTML = 'Teks Asli\\n'\" class=\"mt-4 text-xs text-slate-400 underline\">Reset File</button>\n</div>"

    {
        "title": "Guided Step: Append Log",
        "subtitle": "Mencatat Pengunjung",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400 block mb-2\"># Buka dengan mode A (Append)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">with open(\"buku_tamu.txt\", \"a\") as file_log:</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block pl-4 mt-2\">file_log.write(\"Zeta Telah Hadir\\n\")</span><br>\n<span class=\"text-slate-400 block mt-4\"># Otomatis close di sini</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan Taktik:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Jika kodingan ini dijalankan 3 kali, maka di notepad file `buku_tamu.txt` akan berisi tulisan \"Zeta Telah Hadir\" sebanyak 3 baris bertumpuk.</p>\n            <p class=\"text-sm text-slate-600\">Kerennya, karena pakai <code>with</code> kita tidak usah panik memikirkan <code>.close()</code>.</p>\n        </div>\n    </div>\n</div>"

an class=\"text-xs text-slate-400 block font-sans\">Sedot Array Baris</span></li>\n                <li>.write(\"teks\n\") <span class=\"text-xs text-slate-400 block font-sans\">Menulis (+ enter)</span></li>\n            </ul>\n        </div>\n    </div>\n</div>"

        "subtitle": "Robot Berpena",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6\">\n    <div class=\"bg-white p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative text-center\">\n        <p class=\"text-xl text-slate-700 mb-6 leading-relaxed\">\n            Bayangkan kalian memiliki sebuah papan tulis besar. Lalu di tengahnya, kalian menaruh seekor kura-kura robot. Ekor kura-kura ini diikatkan sebuah <b>Spidol Berwarna</b>.\n        </p>\n        <div class=\"text-8xl my-6 animate-bounce\">\ud83d\udc22\u270f\ufe0f</div>\n        <p class=\"text-lg text-slate-600 font-bold bg-slate-100 p-4 rounded-xl\">\n            Tugas kalian adalah memberikan perintah ke kura-kura itu (\"Maju 100 langkah!\", \"Belok Kanan 90 Derajat!\"). Saat dia berjalan, spidol di ekornya akan mencetak garis!\n        </p>\n    </div>\n</div>"

        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"text-left space-y-4\">\n        <p class=\"text-lg text-slate-700 leading-relaxed font-medium\">\n            Layar kosong Turtle sebenarnya memiliki sistem <b>Koordinat Kartesius</b> layaknya peta Harta Karun.\n        </p>\n        <ul class=\"list-disc pl-6 text-slate-600 space-y-2 mt-4 font-bold text-sm bg-blue-50 p-6 rounded-2xl border border-blue-200\">\n            <li>Titik Tengah (Awal Kura-kura): <b>X=0, Y=0</b></li>\n            <li>Ke Kanan: <b>X Positif</b> (+100)</li>\n            <li>Ke Kiri: <b>X Negatif</b> (-100)</li>\n            <li>Ke Atas: <b>Y Positif</b> (+100)</li>\n            <li>Ke Bawah: <b>Y Negatif</b> (-100)</li>\n        </ul>\n    </div>\n    \n    <div class=\"bg-slate-900 h-64 rounded-xl border-4 border-slate-700 relative overflow-hidden shadow-xl flex items-center justify-center\">\n        <!-- Sumbu X -->\n        <div class=\"absolute w-full h-px bg-slate-500\"></div>\n        <!-- Sumbu Y -->\n        <div class=\"absolute h-full w-px bg-slate-500\"></div>\n        <!-- Titik Pusat -->\n        <div class=\"absolute bg-red-500 w-3 h-3 rounded-full z-10 shadow-[0_0_10px_red]\"></div>\n        <div class=\"absolute text-xs font-mono text-red-400 mt-8\">(0, 0)</div>\n        <div class=\"absolute right-2 text-xs font-mono text-slate-400\">X+</div>\n        <div class=\"absolute left-2 text-xs font-mono text-slate-400\">X-</div>\n        <div class=\"absolute top-2 text-xs font-mono text-slate-400\">Y+</div>\n        <div class=\"absolute bottom-2 text-xs font-mono text-slate-400\">Y-</div>\n    </div>\n</div>"

        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Turtle adalah \"Library Bawaan\" Python, tapi statusnya sedang tidur. Kita harus membangunkannya terlebih dahulu menggunakan perintah <code>import</code>.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># 1. Bangunkan Modul Turtle</span><br>\n<span class=\"text-pink-400 font-bold\">import</span> turtle<br><br>\n<span class=\"text-slate-500\"># 2. Panggil Layar Menggambar</span><br>\nlayar = turtle.<span class=\"text-yellow-400 font-bold\">Screen()</span><br><br>\n<span class=\"text-slate-500\"># 3. Ciptakan Robot Kura-kuranya!</span><br>\nt = turtle.<span class=\"text-yellow-400 font-bold\">Turtle()</span><br>\n    </div>\n    <p class=\"text-sm font-bold text-slate-500 mt-2\">Ketik ini di IDE, maka sebuah Jendela Putih kosong berisikan satu panah hitam akan otomatis terbuka!</p>\n</div>"

    {
        "title": "Menyalakan Mesin! \ud83c\udfce\ufe0f",
        "subtitle": "Maju dan Mundur",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Setelah robot kura-kura tercipta (misal namanya `t`), kita bisa menyuruhnya bergerak lurus mencetak garis hitam.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-pink-400 font-bold\">import</span> turtle<br>\nt = turtle.<span class=\"text-yellow-400 font-bold\">Turtle()</span><br><br>\n<span class=\"text-slate-500\"># Maju sejauh 100 pixel/langkah</span><br>\nt.<span class=\"text-green-400 font-bold\">forward</span>(100)<br><br>\n<span class=\"text-slate-500\"># Mundur sejauh 50 pixel/langkah</span><br>\nt.<span class=\"text-green-400 font-bold\">backward</span>(50)<br>\n    </div>\n</div>"

        "subtitle": "Right dan Left",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-blue-50 p-6 rounded-2xl border border-blue-200\">\n        <p class=\"text-lg text-blue-900 font-medium\">Jika hanya maju mundur, kita cuma bisa membuat Garis Lurus! Kita butuh perintah untuk merubah arah hadap kepala kura-kura.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># Putar kepala kura-kura ke KANAN sebesar X derajat</span><br>\nt.<span class=\"text-yellow-400 font-bold\">right</span>(90)<br><br>\n<span class=\"text-slate-500\"># Putar kepala kura-kura ke KIRI sebesar X derajat</span><br>\nt.<span class=\"text-yellow-400 font-bold\">left</span>(45)<br>\n    </div>\n    <p class=\"text-sm font-bold text-red-500 italic mt-2\">*Catatan: Perintah ini HANYA memutar kepala (seperti mutar stir), tidak membuat kura-kura berjalan!</p>\n</div>"

        "title": "Visualisasi: Belok Kanan \ud83c\udfac",
        "subtitle": "t.right(90)",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-white h-64 border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex items-center justify-center group cursor-pointer\">\n        \n        <style>\n            .turt-turn { transition: all 1s ease-in-out; font-size: 3rem; }\n            .group:hover .turt-turn { transform: rotate(90deg); }\n        </style>\n        \n        <!-- The Line (Arrow indication) -->\n        <div class=\"absolute w-24 h-px border-t-2 border-dashed border-slate-300 transform rotate-0 origin-left translate-x-12\"></div>\n        <div class=\"absolute w-24 h-px border-t-2 border-dashed border-blue-400 transform rotate-90 origin-left translate-x-12 opacity-50\"></div>\n        \n        <!-- The Turtle -->\n        <div class=\"turt-turn absolute z-20\">\ud83d\udc22</div>\n        \n        <p class=\"absolute bottom-4 font-bold text-slate-400 animate-pulse\">Hover Kotak Ini (Tonton Rotasi kepalanya)</p>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Menggambar Kotak Sederhana",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83d\udce6</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Buka IDE kalian! Kakak Pengajar akan memandu cara menggabungkan <code>forward()</code> dan <code>right()</code> untuk membuat persegi presisi!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Siapkan Jendela Thonny/VSCode \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Pola Dasar Kotak",
        "subtitle": "Langkah 1 & 2",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-pink-400\">import</span> turtle<br>\nt = turtle.Turtle()<br><br>\n<span class=\"text-slate-400\"># Sisi Atas</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.forward(100)</span>\n<span class=\"text-slate-400\"># Belok agar membentuk sudut 90 deg</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.right(90)</span><br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden\">\n        <div class=\"absolute top-1/4 left-1/4 w-32 h-1 bg-slate-800\"></div>\n        <div class=\"absolute top-1/4 right-[42%] text-3xl transform rotate-90\">\ud83d\udc22</div>\n        <p class=\"absolute bottom-4 w-full text-center text-sm font-bold text-slate-500\">Turtle jalan lurus, lalu menghadap ke bawah</p>\n    </div>\n</div>"
    },
    {
        "title": "Pola Dasar Kotak",
        "subtitle": "Langkah Lengkap (4 Sisi)",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-4 rounded-2xl font-mono text-xs h-full shadow-2xl border border-slate-700 leading-relaxed overflow-y-auto max-h-[350px]\">\nimport turtle<br>\nt = turtle.Turtle()<br><br>\nt.forward(100)<br>t.right(90)<br><br>\nt.forward(100)<br>t.right(90)<br><br>\nt.forward(100)<br>t.right(90)<br><br>\nt.forward(100)<br>t.right(90)<br><br>\n<span class=\"text-pink-400 font-bold\">turtle.done()</span> <span class=\"text-slate-500\"># Menahan jendela agar tak tertutup</span>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center\">\n        <div class=\"w-32 h-32 border-4 border-slate-800 relative\">\n            <div class=\"absolute -top-3 -left-3 text-2xl\">\ud83d\udc22</div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Misteri Segitiga",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm flex items-start gap-6\">\n        <div class=\"text-5xl\">\ud83d\udd3a</div>\n        <div>\n            <h4 class=\"font-black text-xl text-blue-800 mb-2\">Misi Kalian:</h4>\n            <p class=\"text-slate-600 font-medium\">Buatlah file python baru di IDE. Ubah pola Kotak tadi menjadi bentuk <b>Segitiga Sama Sisi</b> (3 garis saja).</p>\n            <div class=\"bg-amber-100 border border-amber-300 p-4 rounded-lg mt-4\">\n                <p class=\"font-bold text-amber-900 text-sm flex gap-2\"><span>\ud83d\udca1</span> Hint Derajat!</p>\n                <p class=\"text-sm text-amber-800 mt-1\">Banyak yang gagal karena memakai <code>right(60)</code>! Ingat, Kura-kura menghadap luar. Sudut luarnya adalah 180 - 60 = <b>120 derajat!</b></p>\n            </div>\n            <button onclick=\"toggleReveal('ans-sg')\" class=\"mt-4 px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-bold text-sm text-slate-700 shadow\">Lihat Kunci</button>\n            <div id=\"ans-sg\" class=\"hidden font-mono bg-slate-900 text-green-400 p-4 rounded mt-2 text-xs\">\nt.forward(100)<br>t.left(120)<br>t.forward(100)<br>t.left(120)<br>t.forward(100)<br>t.left(120)\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Dandan Turtle \ud83d\udc84",
        "subtitle": "Ubah Bentuk Kursor",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Secara default, kursor kita berbentuk <i>panah hitam membosankan</i>. Ayo kita ubah agar benar-benar menjadi Kura-kura!</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nt = turtle.Turtle()<br><br>\n<span class=\"text-slate-500\"># Merubah ikon panah menjadi kura-kura imut</span><br>\nt.<span class=\"text-yellow-400 font-bold\">shape</span>(<span class=\"text-green-400\">\"turtle\"</span>)<br>\n<br>\n<span class=\"text-slate-500 text-sm\"># Opsi lain: \"arrow\", \"circle\", \"square\", \"triangle\"</span>\n    </div>\n</div>"
    },
    {
        "title": "Tebal & Warna Garis \ud83c\udfa8",
        "subtitle": "Spidol Warna-Warni",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-500\"># Merubah warna kura-kura dan garisnya (Bisa pakai nama inggris / hex code)</span><br>\nt.<span class=\"text-yellow-400 font-bold\">color</span>(<span class=\"text-green-400\">\"red\"</span>)<br>\nt.<span class=\"text-yellow-400 font-bold\">color</span>(<span class=\"text-green-400\">\"blue\"</span>)<br><br>\n<span class=\"text-slate-500\"># Merubah ketebalan spidol (angka semakin besar = semakin tebal)</span><br>\nt.<span class=\"text-yellow-400 font-bold\">pensize</span>(5)<br>\nt.<span class=\"text-yellow-400 font-bold\">pensize</span>(10)<br>\n    </div>\n</div>"
    },
    {
        "title": "Speed Limit \ud83c\udfce\ufe0f",
        "subtitle": "Kecepatan Robot",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"flex items-center gap-6 p-6 bg-red-50 border-2 border-red-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\u26a1</div>\n        <p class=\"text-lg text-slate-700 font-medium\">Bosan melihat kura-kura berjalan lambat? Kita bisa pasang mesin jet ke cangkangnya!</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># Speed normal adalah 3. Paling lambat adalah 1. Paling cepat adalah 10.</span><br>\nt.<span class=\"text-yellow-400 font-bold\">speed</span>(10)<br><br>\n<span class=\"text-slate-500\"># Mode INSTANT TELEPORT (Kecepatan cahaya) -> Pakai angka 0</span><br>\nt.<span class=\"text-yellow-400 font-bold\">speed</span>(0)<br>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Custom \ud83c\udfac",
        "subtitle": "Hasil Modifikasi",
        "content": "<div class=\"max-w-4xl mx-auto mt-6 text-center\">\n    <div class=\"bg-white h-[200px] border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex items-center justify-center\">\n        <!-- Before -->\n        <div class=\"absolute top-8 left-10 text-left\">\n            <p class=\"text-xs font-bold text-slate-400 mb-2 font-mono\">Bawaan Pabrik</p>\n            <div class=\"flex items-center\">\n                <div class=\"w-16 h-px bg-black\"></div>\n                <div class=\"w-0 h-0 border-t-4 border-b-4 border-l-8 border-transparent border-l-black ml-1\"></div>\n            </div>\n        </div>\n        \n        <!-- After -->\n        <div class=\"absolute bottom-8 left-10 text-left w-full pr-20\">\n            <p class=\"text-xs font-bold text-blue-500 mb-2 font-mono\">color(\"red\"), pensize(8), shape(\"turtle\")</p>\n            <div class=\"flex items-center relative group cursor-pointer w-full\">\n                <style>\n                    .cust-turt { transition: 1s linear; }\n                    .cust-line { transition: 1s linear; width: 0px; }\n                    .group:hover .cust-turt { transform: translateX(300px); }\n                    .group:hover .cust-line { width: 300px; }\n                </style>\n                <div class=\"cust-line h-2 bg-red-500 rounded-l-full shadow-md z-10 absolute left-0\"></div>\n                <div class=\"cust-turt text-4xl z-20 absolute drop-shadow-md text-red-500\" style=\"filter: hue-rotate(150deg);\">\ud83d\udc22</div>\n            </div>\n        </div>\n        <p class=\"absolute bottom-2 right-4 text-xs font-bold text-slate-300 animate-pulse\">Hover bagian bawah</p>\n    </div>\n</div>"
    },
    {
        "title": "Trik Melompat: Penup \ud83e\ude82",
        "subtitle": "Angkat Spidolmu",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Pernahkah kamu menggambar mata di wajah? Kamu <b>HARUS MENGANGKAT</b> spidolmu dari kertas, pindah posisi, lalu menaruhnya lagi. Jika tidak diangkat, wajahnya akan penuh coretan garis lurus!</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># Angkat spidol dari layar (Turtle tetap bisa jalan tapi TAK MENINGGALKAN JEJAK)</span><br>\nt.<span class=\"text-yellow-400 font-bold\">penup()</span><br>\n<span class=\"text-slate-500 text-sm\"># Atau disingkat: t.up()</span>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutkan Lukisan: Pendown \u270d\ufe0f",
        "subtitle": "Turunkan Spidol",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Setelah sampai di posisi koordinat yang diinginkan, turunkan kembali spidolnya untuk melanjutkan coretan.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># Turunkan spidol menempel ke layar</span><br>\nt.<span class=\"text-yellow-400 font-bold\">pendown()</span><br>\n<span class=\"text-slate-500 text-sm\"># Atau disingkat: t.down()</span>\n    </div>\n    <div class=\"bg-red-50 border border-red-200 p-4 rounded text-red-800 font-bold text-sm\">\n        \u26a0\ufe0f Sering terjadi bug anak-anak kura-kuranya jalan tapi tidak keluar garis gara-gara lupa memanggil pendown()!\n    </div>\n</div>"
    },
    {
        "title": "Teleportasi: Goto \ud83d\udef8",
        "subtitle": "Koordinat X dan Y",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Memakai maju mundur terkadang sangat melelahkan. Jika kita tahu alamat akurat di layar, suruh saja Turtle kesana langsung dengan <code>.goto(x, y)</code>.</p>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># Pindah ke pojok kanan atas (X=200, Y=200)</span><br>\nt.penup() <span class=\"text-slate-500\"># Wajib diangkat dulu, kalau tidak nanti ada garis nyasar!</span><br>\nt.<span class=\"text-yellow-400 font-bold\">goto</span>(200, 200)<br>\nt.pendown()<br>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi: Penup vs Pendown \ud83c\udfac",
        "subtitle": "Perbedaan Nyata",
        "content": "<div class=\"max-w-4xl mx-auto mt-4 text-center\">\n    <div class=\"bg-slate-100 h-[250px] border-4 border-slate-300 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-around py-4\">\n        <!-- Pendown (Normal) -->\n        <div class=\"w-full flex items-center relative group cursor-pointer h-10 px-10\">\n            <style>\n                .turt-d { transition: 1.5s linear; }\n                .line-d { transition: 1.5s linear; width: 0px; }\n                .group:hover .turt-d { transform: translateX(400px); }\n                .group:hover .line-d { width: 400px; }\n            </style>\n            <div class=\"absolute w-20 text-xs font-bold text-slate-500 text-left font-mono\">pendown()</div>\n            <div class=\"line-d h-1 bg-black absolute left-24 z-10\"></div>\n            <div class=\"turt-d absolute left-20 z-20 text-2xl\">\ud83d\udc22</div>\n        </div>\n        \n        <!-- Penup -->\n        <div class=\"w-full flex items-center relative group cursor-pointer h-10 px-10\">\n            <style>\n                .turt-u { transition: 1.5s linear; }\n                .group:hover .turt-u { transform: translateX(400px); }\n            </style>\n            <div class=\"absolute w-20 text-xs font-bold text-blue-500 text-left font-mono\">penup()</div>\n            <!-- NO LINE! -->\n            <div class=\"turt-u absolute left-20 z-20 text-2xl opacity-75 transform -translate-y-2\">\ud83d\udc22</div>\n        </div>\n        <p class=\"absolute bottom-2 w-full text-center text-xs font-bold text-slate-400 animate-pulse\">Hover masing-masing jalur</p>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 3: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Kacamata Kotak (Dua Kotak Terpisah)",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83d\udc53</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kali ini Kakak Pengajar akan memandu menggambar 2 buah kotak yang TERPISAH di layar menggunakan kombinasi <code>goto()</code> dan <code>penup()</code>.</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Bedah Taktik di IDE \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Langkah 1: Kotak Kiri",
        "subtitle": "Kacamata part 1",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-full shadow-2xl border border-slate-700 leading-loose\">\nimport turtle<br>\nt = turtle.Turtle()<br>\nt.shape(\"turtle\")<br>\nt.color(\"blue\")<br>\nt.pensize(5)<br><br>\n<span class=\"text-slate-400\"># Kotak 1</span><br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center\">\n        <div class=\"w-20 h-20 border-4 border-blue-500\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 2: Angkat & Pindah",
        "subtitle": "Trik Anti Garis Bocor",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-full shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400\"># Kotak 1 Selesai...</span><br><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.penup()</span><br>\n<span class=\"text-slate-400\"># Geser 100 pixel ke kanan (koordinat x=100, y=0)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.goto(100, 0)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">t.pendown()</span><br>\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center gap-8\">\n        <div class=\"w-20 h-20 border-4 border-blue-500\"></div>\n        <div class=\"text-3xl animate-pulse\">\ud83d\udc22</div>\n    </div>\n</div>"
    },
    {
        "title": "Langkah 3: Kotak Kanan",
        "subtitle": "Selesai!",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-full shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400\"># ... t.pendown()</span><br><br>\n<span class=\"text-slate-400\"># Gambar Kotak 2 (Copas yang tadi)</span><br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br>\nt.forward(50); t.left(90)<br><br>\nturtle.done()\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex justify-center items-center gap-8\">\n        <div class=\"w-20 h-20 border-4 border-blue-500\"></div>\n        <div class=\"w-20 h-20 border-4 border-blue-500\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 4: Independent \ud83d\udcbb",
        "subtitle": "Menggambar Rumah",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm flex items-start gap-6\">\n        <div class=\"text-5xl\">\ud83c\udfe0</div>\n        <div>\n            <h4 class=\"font-black text-xl text-blue-800 mb-2\">Misi Arsitek:</h4>\n            <p class=\"text-slate-600 font-medium leading-relaxed\">\n                Gabungkan ilmu Kotak dan ilmu Segitiga! Buat program untuk menggambar Rumah sederhana (Badan rumah berupa Kotak, Atapnya berupa Segitiga di atas kotak tersebut).\n            </p>\n            <ul class=\"list-disc pl-5 mt-2 text-sm text-slate-500 font-bold\">\n                <li>Gunakan <code>t.goto()</code> jika perlu memposisikan ulang.</li>\n                <li>Warna tembok dan atap boleh beda!</li>\n            </ul>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Ember Cat: Fill Color \ud83e\udea3",
        "subtitle": "Mewarnai Bagian Dalam",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Turtle memiliki sistem \"Ember Cat\" layaknya Microsoft Paint. Kita bisa mengisi warna bagian dalam sebuah bangun ruang.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\nt.color(\"yellow\")<br><br>\n<span class=\"text-slate-500\"># 1. Umumkan bahwa kamu mau mulai mengisi cat</span><br>\nt.<span class=\"text-yellow-400 font-bold\">begin_fill()</span><br><br>\n<span class=\"text-slate-500\"># 2. Gambar bentuk tertutup (Kotak / Lingkaran)</span><br>\nt.forward(100) ... <span class=\"text-slate-500 italic\"># dan seterusnya</span><br>\n    </div>\n</div>"
    },
    {
        "title": "Tumpahkan Cat: End Fill \ud83c\udfa8",
        "subtitle": "Penyelesaian Warna",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <p class=\"text-lg text-slate-700\">Warna TIDAK AKAN MUNCUL sebelum kura-kura memanggil perintah <code>end_fill()</code>.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose mt-4\">\n<span class=\"text-slate-500\"># 2. ... selesai menggambar bentuk tertutup</span><br><br>\n<span class=\"text-slate-500\"># 3. Tumpahkan catnya! BLUSH!</span><br>\nt.<span class=\"text-yellow-400 font-bold\">end_fill()</span><br>\n    </div>\n    <p class=\"text-sm text-slate-500 font-bold italic mt-2\">*Catatan: Pastikan garis yang kamu gambar saling bersentuhan (tertutup rapat) layaknya di MS Paint.</p>\n</div>"
    },
    {
        "title": "Visualisasi: Fill Color \ud83c\udfac",
        "subtitle": "begin dan end",

        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-slate-50 p-6 rounded-2xl border border-slate-200 flex gap-4 shadow-sm items-center\">\n        <div class=\"w-32 h-20 bg-white border border-slate-400 flex items-center justify-center shrink-0\">\n            <div class=\"w-10 h-10 bg-red-600 rounded-full\"></div>\n        </div>\n        <div>\n            <p class=\"font-bold text-slate-800 text-lg\">Misi: Bendera Jepang Sempurna</p>\n            <p class=\"text-md text-slate-600 mt-1\">Gunakan kombinasi Kotak (hitam/outline) dan Lingkaran Merah Solid di tengahnya.</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Hint Turtle:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Gambar kotaknya dulu (Bisa ukuran 300 x 200).</li>\n            <li>Gunakan <code>t.penup()</code> dan <code>t.goto()</code> menuju titik tengah bendera.</li>\n            <li>Panggil <code>t.color(\"red\")</code> lalu <code>t.begin_fill()</code> dan <code>t.circle(50)</code>.</li>\n        </ul>\n    </div>\n</div>"

    {
        "title": "Challenge 2 \u2b50",
        "subtitle": "Bintang 5 Sudut",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-amber-50 p-6 rounded-2xl border border-amber-200 flex gap-4 shadow-sm items-center\">\n        <div class=\"text-5xl shrink-0\">\u2b50</div>\n        <div>\n            <p class=\"font-bold text-amber-900 text-lg\">Misi: Bintang Emas</p>\n            <p class=\"text-md text-amber-800 mt-1\">Bintang terbentuk dari 5 garis lurus yang memotong. Tantangan ini murni beradu logika rotasi sudut derajat!</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Bocoran Sudut:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Untuk membuat bintang klasik, Turtle harus memutar stirnya (belok) sebesar <b class=\"text-red-500\">144 derajat!</b></li>\n            <li>Cobalah mengetik pola `forward(200)` dan `right(144)` diulang sebanyak 5 kali berurutan. Lihat apa yang terjadi!</li>\n            <li>Extra: Beri warna kuning solid pakai `.begin_fill()`.</li>\n        </ul>\n    </div>\n</div>"

    {
        "title": "Challenge 3 \ud83c\udf04",
        "subtitle": "Pemandangan Custom",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-4 mt-2\">\n    <div class=\"bg-emerald-50 p-5 rounded-2xl border border-emerald-200 flex gap-4 shadow-sm\">\n        <div class=\"text-3xl\">\ud83c\udfa8</div>\n        <div>\n            <p class=\"font-bold text-emerald-900 text-lg\">Misi Akhir: Imajinasi Bebas</p>\n            <p class=\"text-sm text-emerald-800 mt-1\">Gabungkan rumah (Exercise 4), bendera, kotak, dan warna untuk menciptakan pemandangan bebas. (Waktu pengerjaan 15 menit).</p>\n        </div>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Persyaratan Minimum:</p>\n        <ul class=\"list-disc pl-6 text-sm text-slate-700 mt-4 space-y-2 font-medium\">\n            <li>Harus ada minimal 1 matahari/bulan (`circle` warna kuning/putih).</li>\n            <li>Harus ada tanah (`goto` ke bawah layar dan gambar garis panjang horizontal hijau).</li>\n            <li>Terdapat minimal 3 warna (Merah, Kuning, Biru, dll).</li>\n            <li>Kecepatan turtle boleh diset ke paling ngebut (speed 0).</li>\n        </ul>\n    </div>\n</div>"

    {
        "title": "Bosan Mengetik Copas? \ud83d\ude2b",
        "subtitle": "Sihir For Loop",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-6 text-left\">\n    <div class=\"bg-slate-50 p-6 rounded-2xl border border-slate-200\">\n        <p class=\"text-lg text-slate-700 font-medium\">Kalian pasti lelah meng-copas pola `forward` dan `right` berulang-ulang untuk membuat Kotak atau Bintang. Disinilah fitur dasar Python (List & Loop) menyelamatkan hidup kita.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose mt-4 grid grid-cols-2 gap-4\">\n        <div>\n<span class=\"text-red-400\"># Cara Bodoh:</span><br>\nt.fd(100); t.rt(90)<br>\nt.fd(100); t.rt(90)<br>\nt.fd(100); t.rt(90)<br>\nt.fd(100); t.rt(90)<br>\n        </div>\n        <div class=\"border-l border-slate-700 pl-4\">\n<span class=\"text-green-400\"># Cara Pro (Looping):</span><br>\n<span class=\"text-yellow-400 font-bold\">for</span> i <span class=\"text-yellow-400 font-bold\">in</span> range(4):<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.fd(100)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.rt(90)<br>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 5: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Loop & Color Bintang",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm h-[350px] shadow-2xl border border-slate-700 leading-relaxed overflow-y-auto\">\nimport turtle<br>\nt = turtle.Turtle()<br>\nt.speed(5)<br><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">warna = [\"red\", \"blue\", \"green\", \"orange\", \"purple\"]</span><br>\n<br>\n<span class=\"text-yellow-400 bg-yellow-400/10 block p-1 rounded\">for i in range(5):</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-slate-400\"># Ambil warna dari array list pakai index</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.color(warna[i])<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.forward(150)<br>\n&nbsp;&nbsp;&nbsp;&nbsp;t.right(144)<br>\n<br>\nturtle.done()\n    </div>\n    <div class=\"bg-white h-full border-2 border-slate-200 rounded-2xl relative shadow-inner overflow-hidden flex flex-col justify-center items-center gap-4 text-center px-4\">\n        <h4 class=\"font-black text-xl text-blue-800\">Bintang Pelangi</h4>\n        <p class=\"text-sm text-slate-600 font-medium\">Dengan For loop dan List Array, kura-kura bisa mengganti warnanya SECARA OTOMATIS di setiap garis yang dia tarik!</p>\n    </div>\n</div>"
    },
    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Turtle Cheat Sheet",
        "content": "<div class=\"max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-k-blue h-full flex flex-col justify-center mt-4 text-left\">\n    <div class=\"grid grid-cols-3 gap-4\">\n        <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Gerakan Dasar</h4>\n            <ul class=\"text-xs font-mono text-slate-600 space-y-2\">\n                <li>.forward(x) <span class=\"opacity-50\">Maju</span></li>\n                <li>.backward(x) <span class=\"opacity-50\">Mundur</span></li>\n                <li>.right(deg) <span class=\"opacity-50\">Belok Kanan</span></li>\n                <li>.left(deg) <span class=\"opacity-50\">Belok Kiri</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Posisi & Pena</h4>\n            <ul class=\"text-xs font-mono text-slate-600 space-y-2\">\n                <li>.penup() <span class=\"opacity-50\">Angkat Pena</span></li>\n                <li>.pendown() <span class=\"opacity-50\">Turun Pena</span></li>\n                <li>.goto(x, y) <span class=\"opacity-50\">Teleportasi</span></li>\n                <li>.circle(r) <span class=\"opacity-50\">Bikin Lingkaran</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <h4 class=\"font-black text-slate-800 mb-2 border-b pb-2\">Style & Visual</h4>\n            <ul class=\"text-xs font-mono text-slate-600 space-y-2\">\n                <li>.color('red') <span class=\"opacity-50\">Ganti Warna</span></li>\n                <li>.pensize(5) <span class=\"opacity-50\">Tebal Spidol</span></li>\n                <li>.shape('turtle') <span class=\"opacity-50\">Ikon Kursor</span></li>\n                <li>.speed(1-10) <span class=\"opacity-50\">Kecepatan Robot</span></li>\n                <li>.begin_fill() <span class=\"opacity-50\">Mulai Cat Dalam</span></li>\n                <li>.end_fill() <span class=\"opacity-50\">Selesai Cat</span></li>\n            </ul>\n        </div>\n    </div>\n</div>"
