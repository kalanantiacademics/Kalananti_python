        "content": "<div class=\"relative w-full h-[300px] bg-slate-800 rounded-2xl overflow-hidden border-2 border-slate-700 flex items-center mt-4\">\n    <style>\n        @keyframes scanList { 0% { left: 10%; opacity: 1;} 25% { left: 35%; opacity: 1;} 50% { left: 60%; opacity: 1;} 75% { left: 85%; opacity: 1;} 100% { left: 10%; opacity: 0; }}\n        .scanner { position: absolute; width: 60px; height: 120px; border: 4px solid #ef4444; border-radius: 12px; box-shadow: 0 0 20px #ef4444; animation: scanList 4s infinite steps(1); top: 50%; transform: translateY(-50%); z-index: 10;}\n    </style>\n    <div class=\"scanner\"></div>\n    <div class=\"flex w-full justify-around px-8 z-0\">\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center\"><p class=\"text-white font-mono\">08123</p><p class=\"text-slate-400 text-xs\">Index 0</p></div>\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center\"><p class=\"text-white font-mono\">08564</p><p class=\"text-slate-400 text-xs\">Index 1</p></div>\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center\"><p class=\"text-white font-mono\">08999</p><p class=\"text-slate-400 text-xs\">Index 2</p></div>\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center\"><p class=\"text-white font-mono\">08111</p><p class=\"text-slate-400 text-xs\">Index 3</p></div>\n    </div>\n    <p class=\"absolute bottom-4 left-1/2 -translate-x-1/2 text-red-400 text-sm font-bold bg-slate-900 px-4 py-2 rounded-full\">Lama! Komputer mengecek dari awal</p>\n</div>"
    },
    {
        "title": "Visualisasi: Mencari di Dictionary \u2705",
        "subtitle": "Langsung Tepat Sasaran!",
        "content": "<div class=\"relative w-full h-[300px] bg-slate-800 rounded-2xl overflow-hidden border-2 border-slate-700 flex items-center justify-center mt-4\">\n    <style>\n        @keyframes directHit { 0% { transform: scale(3) translateY(-50px); opacity: 0;} 30% { transform: scale(1) translateY(0); opacity: 1;} 100% { transform: scale(1) translateY(0); opacity: 1; box-shadow: 0 0 30px #22c55e;} }\n        .target-box { animation: directHit 2s infinite ease-out; border: 4px solid #22c55e; }\n    </style>\n    <div class=\"flex gap-6 z-0\">\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center opacity-30\"><p class=\"text-slate-300 font-bold\">Andi</p><p class=\"text-slate-400 font-mono text-sm\">08123</p></div>\n        <div class=\"bg-slate-900 p-4 rounded-xl text-center target-box relative z-10\"><div class=\"absolute -top-3 -right-3 text-2xl\">\ud83c\udfaf</div><p class=\"text-green-400 font-bold text-xl\">Budi</p><p class=\"text-white font-mono text-lg mt-2\">08564</p></div>\n        <div class=\"bg-slate-700 p-4 rounded-xl text-center opacity-30\"><p class=\"text-slate-300 font-bold\">Cici</p><p class=\"text-slate-400 font-mono text-sm\">08999</p></div>\n    </div>\n    <p class=\"absolute bottom-4 left-1/2 -translate-x-1/2 text-green-400 text-sm font-bold bg-slate-900 px-4 py-2 rounded-full shadow-[0_0_15px_#22c55e]\">Ajaib! Langsung melompat ke target</p>\n</div>"
    },
    {
        "title": "Konsep 1: Dictionary \ud83d\udcd6",
        "subtitle": "Buku Kamus Komputer",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-center mt-6\">\n    <div class=\"text-7xl\">\ud83d\uddc2\ufe0f</div>\n    <div class=\"bg-white p-8 border-2 border-slate-200 rounded-3xl shadow-lg text-left\">\n        <p class=\"text-xl text-slate-700 mb-6 leading-relaxed\">Dalam bahasa komputer, struktur data ini sering disebut <b>Hash Map</b> atau <b>Dictionary</b>.</p>\n        <p class=\"text-lg text-slate-700\">Dictionary menyimpan data tidak secara berurutan dengan index (0,1,2), melainkan secara <b>berpasangan</b>: Sebuah label (Kunci) dan Isinya (Nilai).</p>\n    </div>\n</div>"
    },
    {
        "title": "Syntax Dasar Dictionary \ud83d\udee0\ufe0f",
        "subtitle": "Cara Membuatnya",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 mt-4\">\n    <p class=\"text-slate-600 text-lg\">Jika List pakai kurung siku <code>[]</code>, Dictionary pakai kurung kurawal <code>{}</code>.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-3xl font-mono text-lg shadow-2xl border-2 border-slate-700 leading-loose text-left\">\n        <span class=\"text-slate-400\"># nama_variabel = { \"Key\": \"Value\" }</span><br><br>\n        kontak = <span class=\"text-yellow-400 font-bold\">{</span><br>\n        &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"Andi\"</span> <span class=\"text-red-400 font-bold\">:</span> <span class=\"text-blue-300\">\"08123\"</span>,<br>\n        &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"Budi\"</span> <span class=\"text-red-400 font-bold\">:</span> <span class=\"text-blue-300\">\"08564\"</span><br>\n        <span class=\"text-yellow-400 font-bold\">}</span>\n    </div>\n    <p class=\"text-sm text-slate-500 font-bold italic mt-4\">*Setiap pasangan dipisahkan oleh tanda titik dua ( : ), dan antar pasangan dipisah oleh koma ( , ).</p>\n</div>"
    },
    {
        "title": "Konsep 2: Key & Value \ud83d\udd11",
        "subtitle": "Pasangan Tak Terpisahkan",
        "content": "<div class=\"grid grid-cols-2 gap-8 items-center max-w-4xl mx-auto mt-6\">\n    <div class=\"text-center bg-emerald-50 p-8 rounded-3xl border-2 border-emerald-200 shadow-sm relative overflow-hidden\">\n        <div class=\"absolute -right-4 -top-4 text-8xl opacity-10\">\ud83d\udd11</div>\n        <h4 class=\"font-black text-emerald-800 text-2xl mb-4 relative z-10\">KEY (Kunci)</h4>\n        <p class=\"text-md text-emerald-700 font-medium relative z-10\">Sebagai \"Label\" atau \"Nama\" pengganti index angka.</p>\n        <div class=\"mt-4 bg-emerald-200 text-emerald-900 font-mono py-2 rounded-lg relative z-10 font-bold\">\"Andi\"</div>\n    </div>\n    <div class=\"text-center bg-sky-50 p-8 rounded-3xl border-2 border-sky-200 shadow-sm relative overflow-hidden\">\n        <div class=\"absolute -right-4 -top-4 text-8xl opacity-10\">\ud83d\udc8e</div>\n        <h4 class=\"font-black text-sky-800 text-2xl mb-4 relative z-10\">VALUE (Nilai)</h4>\n        <p class=\"text-md text-sky-700 font-medium relative z-10\">Isi data yang sebenarnya ingin kita simpan.</p>\n        <div class=\"mt-4 bg-sky-200 text-sky-900 font-mono py-2 rounded-lg relative z-10 font-bold\">\"08123\"</div>\n    </div>\n</div>"
    },
    {
        "title": "Aturan Pembuatan KEY \u2696\ufe0f",
        "subtitle": "Harus Unik!",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-red-50 border-2 border-red-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udeab</div>\n        <p class=\"text-lg text-red-900 font-medium leading-relaxed\"><b>Key tidak boleh kembar (Duplikat).</b> Bayangkan ada 2 rumah dengan alamat yang sama persis, tukang pos pasti bingung!</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose relative\">\n        <div class=\"absolute right-4 top-4 bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold font-sans animate-pulse\">JANGAN DITIRU!</div>\nkontak = {<br>\n&nbsp;&nbsp;&nbsp;&nbsp;\"Andi\" : \"111\",<br>\n&nbsp;&nbsp;&nbsp;&nbsp;\"Budi\" : \"222\",<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-red-400 border-b-2 border-red-400\">\"Andi\"</span> : \"333\" <span class=\"text-slate-500\"># DUPLIKAT! Yang ini akan menimpa \"Andi\" pertama.</span><br>\n}\n    </div>\n</div>"
    },
    {
        "title": "Aturan Pembuatan VALUE \u2696\ufe0f",
        "subtitle": "Bebas Merdeka!",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-blue-50 border-2 border-blue-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udd4a\ufe0f</div>\n        <p class=\"text-lg text-blue-900 font-medium leading-relaxed\">Berbeda dengan Key, <b>Value boleh duplikat dan boleh tipe data apa saja</b> (String, Integer, List, atau bahkan Dictionary lain!).</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose\">\nhero = {<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"nama\"</span>: <span class=\"text-yellow-300\">\"Gatotkaca\"</span>, <span class=\"text-slate-500\"># Value String</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"level\"</span>: <span class=\"text-blue-400\">99</span>, <span class=\"text-slate-500\"># Value Integer</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"terbang\"</span>: <span class=\"text-purple-400\">True</span>, <span class=\"text-slate-500\"># Value Boolean</span><br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\">\"senjata\"</span>: [<span class=\"text-yellow-300\">\"Tinju\"</span>, <span class=\"text-yellow-300\">\"Petir\"</span>] <span class=\"text-slate-500\"># Value berupa List!</span><br>\n}\n    </div>\n</div>"
    },
    {
        "title": "Mini Quiz \u23f1\ufe0f",
        "subtitle": "Mana yang Key, mana yang Value?",
        "content": "<div class=\"max-w-3xl mx-auto text-center space-y-8 mt-6\">\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-2xl shadow-xl border-2 border-slate-700\">\n        \"umur\" <span class=\"text-red-500\">:</span> 15\n    </div>\n    <div class=\"grid grid-cols-2 gap-8 mt-8\">\n        <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-left\">\n            <p class=\"font-bold text-slate-800 text-xl mb-4 text-center\">\"umur\" itu apa?</p>\n            <div class=\"flex flex-col gap-2\">\n                <button onclick=\"showMiniFeedback('q2-fb1', 'BENAR! Dia ada di sebelah kiri titik dua.', 'success')\" class=\"p-3 border rounded-xl hover:bg-slate-50 font-bold\">Key</button>\n                <button onclick=\"showMiniFeedback('q2-fb1', 'Salah! Value ada di sebelah kanan.', 'error')\" class=\"p-3 border rounded-xl hover:bg-slate-50 font-bold\">Value</button>\n            </div>\n            <div id=\"q2-fb1\" class=\"mt-2 min-h-[40px] text-sm flex items-center justify-center\"></div>\n        </div>\n        <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm text-left\">\n            <p class=\"font-bold text-slate-800 text-xl mb-4 text-center\">15 itu apa?</p>\n            <div class=\"flex flex-col gap-2\">\n                <button onclick=\"showMiniFeedback('q2-fb2', 'Salah! Key ada di sebelah kiri.', 'error')\" class=\"p-3 border rounded-xl hover:bg-slate-50 font-bold\">Key</button>\n                <button onclick=\"showMiniFeedback('q2-fb2', 'BENAR! Isinya (nilainya) adalah 15.', 'success')\" class=\"p-3 border rounded-xl hover:bg-slate-50 font-bold\">Value</button>\n            </div>\n            <div id=\"q2-fb2\" class=\"mt-2 min-h-[40px] text-sm flex items-center justify-center\"></div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Mengakses Data Dictionary \ud83c\udfaf",
        "subtitle": "Langsung panggil namanya",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 mt-6\">\n    <div class=\"text-center bg-blue-50 p-6 rounded-3xl border-2 border-blue-200 shadow-sm mb-6\">\n        <p class=\"text-lg text-blue-900 font-medium\">Kalau di List kita panggil pakai index angka <code>[0]</code>, di Dictionary kita panggil pakai <b>Key-nya</b> <code>[\"nama_key\"]</code>.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose text-left\">\nkontak = {\"Andi\": \"081\", \"Budi\": \"082\"}<br>\n<br>\n<span class=\"text-slate-500\"># Tolong print nomor telepon Budi!</span><br>\nprint(kontak<span class=\"text-yellow-400 font-bold\">[\"Budi\"]</span>)<br>\n<div class=\"mt-4 bg-slate-800 text-slate-300 px-4 py-2 rounded-lg border border-slate-600 inline-block text-sm\">\nOutput: 082\n</div>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Mari Bedah Kode Bersama",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83d\udd0d</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Sekarang kita akan membedah proses pembuatan Dictionary secara perlahan. Perhatikan penjelasan Kakak pengajar baik-baik ya!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Lanjut ke langkah pertama \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 1: Inisialisasi",
        "subtitle": "Membuat Kamus Terjemahan",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block\">kamus = {<br>\n&nbsp;&nbsp;\"cat\": \"Kucing\",<br>\n&nbsp;&nbsp;\"dog\": \"Anjing\"<br>\n}</span>\n<span class=\"opacity-20 block mt-2\">print(kamus[\"cat\"])</span>\n<span class=\"opacity-20 block mt-2\">kamus[\"bird\"] = \"Burung\"</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Kita membuat dictionary bernama <code>kamus</code> untuk menerjemahkan Inggris ke Indonesia.</p>\n            <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n                <p class=\"text-xs font-bold text-slate-500 mb-2 uppercase\">Isinya:</p>\n                <p class=\"text-sm font-mono text-slate-800\">Key: \"cat\" \u27a1\ufe0f Value: \"Kucing\"</p>\n                <p class=\"text-sm font-mono text-slate-800\">Key: \"dog\" \u27a1\ufe0f Value: \"Anjing\"</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 2: Mengakses Data",
        "subtitle": "Mencari Terjemahan",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"opacity-20 block\">kamus = {<br>\n&nbsp;&nbsp;\"cat\": \"Kucing\",<br>\n&nbsp;&nbsp;\"dog\": \"Anjing\"<br>\n}</span>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">print(kamus[\"cat\"])</span>\n<span class=\"opacity-20 block mt-2\">kamus[\"bird\"] = \"Burung\"</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Untuk mencari apa bahasa Indonesianya \"cat\", kita cukup kurung siku nama kuncinya: <code>kamus[\"cat\"]</code>.</p>\n            <div class=\"bg-blue-50 p-4 rounded-xl border border-blue-200\">\n                <p class=\"text-xs font-bold text-blue-500 mb-2 uppercase\">Output di layar:</p>\n                <p class=\"text-lg font-mono text-blue-900 font-bold\">Kucing</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 3: Modifikasi Kamus",
        "subtitle": "Menambah/Update Data",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"opacity-20 block\">kamus = {<br>\n&nbsp;&nbsp;\"cat\": \"Kucing\",<br>\n&nbsp;&nbsp;\"dog\": \"Anjing\"<br>\n}</span>\n<span class=\"opacity-20 block mt-2\">print(kamus[\"cat\"])</span>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">kamus[\"bird\"] = \"Burung\"<br>print(kamus)</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Untuk <b>menambah</b> kosa kata baru, cukup tuliskan Key baru lalu isi valuenya dengan <code>=</code>.</p>\n            <p class=\"text-xs text-slate-500 italic\">*Jika Key-nya sudah ada, maka valuenya akan ter-update (tertimpa).</p>\n            <div class=\"bg-slate-100 p-3 rounded-xl border border-slate-300 text-xs font-mono break-all\">\n                Output: {'cat': 'Kucing', 'dog': 'Anjing', 'bird': 'Burung'}\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Waktunya Live Python! \ud83d\udc0d",
        "subtitle": "Independent Exercise",
        "content": "<div class=\"text-center space-y-8 max-w-3xl mx-auto mt-8\">\n    <div class=\"text-7xl text-green-500 animate-pulse\">\ud83d\udcbb</div>\n    <h3 class=\"text-3xl font-black text-slate-800\">Giliran Kalian Mencoba!</h3>\n    <p class=\"text-lg text-slate-600\">Di dua slide selanjutnya, kerjakan latihan mandiri menggunakan editor PyScript yang sudah tertanam di layar.</p>\n    <div class=\"inline-block bg-slate-900 text-white px-6 py-3 rounded-full font-bold uppercase tracking-widest text-sm shadow-xl\">\n        Tekan SHIFT + ENTER untuk Run Code\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Ambil Data Raport",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 h-[400px]\">\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col\">\n        <h4 class=\"font-black text-2xl text-slate-800\">Tugasmu:</h4>\n        <p class=\"text-md text-slate-600 flex-1\">Di kotak sebelah kanan ada dictionary nilai ujian. Tulis kode untuk melakukan <code>print()</code> terhadap nilai mata pelajaran <b>Sains</b>.</p>\n        <div>\n            <button onclick=\"toggleReveal('ans-ex2')\" class=\"w-full px-4 py-3 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl font-bold text-sm text-slate-700 transition-colors shadow-sm\">Bocoran Jawaban \ud83d\ude48</button>\n            <div id=\"ans-ex2\" class=\"hidden mt-4 bg-green-50 p-4 border border-green-200 rounded-xl text-sm text-green-800 font-mono shadow-inner\">\n                print(raport[\"Sains\"])\n            </div>\n        </div>\n    </div>\n    <div class=\"border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative h-full bg-[#1e1e1e]\">\n        <py-repl class=\"h-full w-full text-sm\">raport = {\n    \"Matematika\": 90,\n    \"Sains\": 95,\n    \"Sejarah\": 80\n}\n# Tulis print kamu di baris bawah ini:\n</py-repl>\n    </div>\n</div>"
    },
    {
        "title": "Exercise 3: Independent \ud83d\udcbb",
        "subtitle": "Update Kontak",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 h-[400px]\">\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col\">\n        <h4 class=\"font-black text-2xl text-slate-800\">Tugasmu:</h4>\n        <p class=\"text-md text-slate-600 flex-1\">\n            1. Budi ganti nomor jadi \"08999\". Update valuenya!<br>\n            2. Tambahkan kontak baru: Key \"Cici\" dengan nomor \"08777\".<br>\n            3. Print dictionary <code>kontak</code> untuk memastikan perubahannya.\n        </p>\n        <div>\n            <button onclick=\"toggleReveal('ans-ex3')\" class=\"w-full px-4 py-3 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl font-bold text-sm text-slate-700 transition-colors shadow-sm\">Bocoran Jawaban \ud83d\ude48</button>\n            <div id=\"ans-ex3\" class=\"hidden mt-4 bg-green-50 p-4 border border-green-200 rounded-xl text-sm text-green-800 font-mono shadow-inner\">\n                kontak[\"Budi\"] = \"08999\"<br>kontak[\"Cici\"] = \"08777\"<br>print(kontak)\n            </div>\n        </div>\n    </div>\n    <div class=\"border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative h-full bg-[#1e1e1e]\">\n        <py-repl class=\"h-full w-full text-sm\">kontak = {\"Andi\": \"08123\", \"Budi\": \"08555\"}\n\n# Update Budi dan Tambah Cici di bawah ini:\n\n\n# Print hasil akhirnya:\n</py-repl>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan: Bahaya KeyError \ud83d\udea8",
        "subtitle": "Memanggil hantu",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-center mt-6\">\n    <div class=\"text-7xl\">\ud83d\udc7b</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Apa yang terjadi kalau kita memanggil <b>Key yang tidak ada</b> di dalam dictionary?\n    </p>\n    <div class=\"bg-slate-900 text-red-400 p-8 rounded-2xl font-mono text-lg shadow-xl border-2 border-red-900 inline-block text-left\">\nkamus = {\"kucing\": \"cat\"}<br>\nprint(kamus[\"anjing\"])<br><br>\n<span class=\"bg-red-500/20 px-2 py-1 rounded text-red-300 font-bold\">KeyError: 'anjing'</span>\n    </div>\n    <p class=\"text-sm text-slate-500 font-bold mt-4\">Program langsung mati total (Error)!</p>\n</div>"
    },
    {
        "title": "Solusi: Method get() \ud83d\udee1\ufe0f",
        "subtitle": "Memanggil dengan aman",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"flex items-center gap-6 bg-green-50 p-6 rounded-3xl border-2 border-green-200 shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udee1\ufe0f</div>\n        <p class=\"text-lg text-green-900 font-medium\">Agar program tidak mati saat Key tidak ditemukan, gunakan method <code>.get()</code>. Ia akan mereturn <code>None</code> (kosong) daripada Error.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\nkamus = {\"kucing\": \"cat\"}<br>\n<br>\n<span class=\"text-slate-500\"># Memanggil dengan aman</span><br>\nhasil = kamus.<span class=\"text-yellow-400 font-bold\">get</span>(\"anjing\")<br>\nprint(hasil)<br>\n<div class=\"mt-4 bg-slate-800 text-slate-300 px-4 py-2 rounded-lg border border-slate-600 inline-block text-sm\">\nOutput: None\n</div>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan 2: Menghapus Data \ud83d\uddd1\ufe0f",
        "subtitle": "del vs pop",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 text-left mt-6\">\n    <div class=\"bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200\">\n        <h4 class=\"font-black text-2xl text-red-600 mb-4 font-mono\">del</h4>\n        <p class=\"text-md text-slate-600 mb-6\">Membasmi item tanpa sisa. Singkatan dari Delete.</p>\n        <div class=\"bg-slate-900 p-4 rounded-xl text-green-400 font-mono text-sm\">\n            <span class=\"text-red-400 font-bold\">del</span> kontak[\"Andi\"]\n        </div>\n    </div>\n    <div class=\"bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200\">\n        <h4 class=\"font-black text-2xl text-orange-500 mb-4 font-mono\">.pop()</h4>\n        <p class=\"text-md text-slate-600 mb-6\">Mencabut dan mengembalikan value-nya agar bisa disimpan.</p>\n        <div class=\"bg-slate-900 p-4 rounded-xl text-green-400 font-mono text-sm\">\n            isi = kontak.<span class=\"text-orange-400 font-bold\">pop</span>(\"Andi\")<br>\n            print(isi) <span class=\"text-slate-500\"># 08123</span>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi pop() \ud83c\udf88",
        "subtitle": "Mencabut pasangan data",
        "content": "<div class=\"max-w-4xl mx-auto flex flex-col items-center mt-8 space-y-8\">\n    <style>\n        @keyframes popUp { 0% { transform: scale(1) translateY(0); opacity: 1;} 50% { transform: scale(1.2) translateY(-40px); opacity: 0.8;} 100% { transform: scale(0.5) translateY(-100px); opacity: 0;} }\n        .popping { animation: popUp 2s infinite ease-in; }\n    </style>\n    <div class=\"flex gap-4 p-8 bg-slate-100 rounded-3xl border-2 border-slate-300\">\n        <div class=\"bg-white border-2 border-slate-200 p-4 rounded-xl text-center shadow-sm w-32\">\n            <p class=\"font-bold text-slate-800\">Andi</p><hr class=\"my-2\"><p class=\"text-sm font-mono text-slate-500\">081</p>\n        </div>\n        <div class=\"bg-white border-2 border-blue-400 p-4 rounded-xl text-center shadow-lg popping w-32\">\n            <p class=\"font-bold text-blue-800\">Budi</p><hr class=\"my-2 border-blue-200\"><p class=\"text-sm font-mono text-blue-600\">082</p>\n        </div>\n        <div class=\"bg-white border-2 border-slate-200 p-4 rounded-xl text-center shadow-sm w-32\">\n            <p class=\"font-bold text-slate-800\">Cici</p><hr class=\"my-2\"><p class=\"text-sm font-mono text-slate-500\">083</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 px-6 py-3 rounded-xl shadow-lg border border-slate-700\">\n        <code class=\"text-green-400 font-mono\">kontak.pop(\"Budi\")</code>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan 3: Ambil Semua! \ud83d\uded2",
        "subtitle": "Methods Khusus Extract Data",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-6\">\ud83d\udce6</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Bagaimana kalau kita ingin melihat SEMUA daftar Key? Atau SEMUA daftar Value? Atau KEDUANYA sekaligus?\n    </p>\n    <p class=\"text-md text-slate-500 font-medium mt-4\">Dictionary punya 3 fungsi ajaib untuk melakukannya.</p>\n</div>"
    },
    {
        "title": "Fungsi 1: .keys() \ud83d\udd11",
        "subtitle": "Keluarkan semua label",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udddd\ufe0f</div>\n        <p class=\"text-lg text-slate-700 font-medium\">Mengembalikan list yang isinya HANYA semua Key (Kunci) yang ada di dalam dictionary.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700\">\nkamus = {\"A\": \"Apel\", \"B\": \"Bebek\"}<br><br>\nprint(kamus.<span class=\"text-yellow-400 font-bold\">keys</span>())<br>\n<span class=\"text-slate-500\"># Output: dict_keys(['A', 'B'])</span>\n    </div>\n</div>"
    },
    {
        "title": "Fungsi 2: .values() \ud83d\udc8e",
        "subtitle": "Keluarkan semua isi",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udc8e</div>\n        <p class=\"text-lg text-slate-700 font-medium\">Mengembalikan list yang isinya HANYA semua Value (Nilai) yang ada di dalam dictionary.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700\">\nkamus = {\"A\": \"Apel\", \"B\": \"Bebek\"}<br><br>\nprint(kamus.<span class=\"text-cyan-400 font-bold\">values</span>())<br>\n<span class=\"text-slate-500\"># Output: dict_values(['Apel', 'Bebek'])</span>\n    </div>\n</div>"
    },
    {
        "title": "Fungsi 3: .items() \ud83d\udd17",
        "subtitle": "Keluarkan pasangannya",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"flex items-center gap-6 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udd17</div>\n        <p class=\"text-lg text-slate-700 font-medium\">Mengembalikan list yang berisi pasangan Key dan Value dalam bentuk Tuple <code>(Key, Value)</code>.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700\">\nkamus = {\"A\": \"Apel\", \"B\": \"Bebek\"}<br><br>\nprint(kamus.<span class=\"text-fuchsia-400 font-bold\">items</span>())<br>\n<span class=\"text-slate-500\"># Output: dict_items([('A', 'Apel'), ('B', 'Bebek')])</span>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Ekstrak Data \ud83d\udc40",
        "subtitle": "Keys vs Values vs Items",
        "content": "<div class=\"max-w-4xl mx-auto mt-6\">\n    <div class=\"flex justify-center gap-6 mb-8\">\n        <div class=\"bg-slate-800 p-4 rounded-xl text-white border border-slate-600 flex shadow-lg\">\n            <div class=\"bg-slate-600 px-3 py-1 font-bold rounded-l text-yellow-300\">ID</div><div class=\"bg-slate-700 px-3 py-1 rounded-r\">\"001\"</div>\n        </div>\n        <div class=\"bg-slate-800 p-4 rounded-xl text-white border border-slate-600 flex shadow-lg\">\n            <div class=\"bg-slate-600 px-3 py-1 font-bold rounded-l text-yellow-300\">Name</div><div class=\"bg-slate-700 px-3 py-1 rounded-r\">\"Zeta\"</div>\n        </div>\n    </div>\n    <div class=\"grid grid-cols-3 gap-6 text-center text-sm font-mono mt-8\">\n        <div class=\"bg-white p-6 rounded-2xl shadow-md border-t-4 border-yellow-400\">\n            <h4 class=\"font-black text-slate-800 mb-4\">.keys()</h4>\n            <p class=\"text-slate-600 bg-slate-100 p-2 rounded\">['ID', 'Name']</p>\n        </div>\n        <div class=\"bg-white p-6 rounded-2xl shadow-md border-t-4 border-cyan-400\">\n            <h4 class=\"font-black text-slate-800 mb-4\">.values()</h4>\n            <p class=\"text-slate-600 bg-slate-100 p-2 rounded\">['001', 'Zeta']</p>\n        </div>\n        <div class=\"bg-white p-6 rounded-2xl shadow-md border-t-4 border-fuchsia-400\">\n            <h4 class=\"font-black text-slate-800 mb-4\">.items()</h4>\n            <p class=\"text-slate-600 bg-slate-100 p-2 rounded\">[('ID', '001'), ('Name', 'Zeta')]</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan 4: Looping \ud83d\udd04",
        "subtitle": "Mengulang isi Dictionary",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-6 animate-spin-slow\">\ud83d\udd04</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Data di dictionary biasanya sangat banyak (bisa ratusan). Kita butuh alat bantu <b>Perulangan (Looping)</b> menggunakan <code>for</code> loop untuk membaca datanya satu-satu secara otomatis.\n    </p>\n</div>"
    },
    {
        "title": "Looping Standar (Keys) \ud83d\udd04",
        "subtitle": "Membaca Kunci",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 shadow-sm text-blue-900\">\n        Jika kita melakukan <code>for</code> loop langsung pada dictionary-nya, komputer secara default HANYA akan mengambil <b>Key-nya</b> saja.\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\nkamus = {\"A\": \"Apel\", \"B\": \"Bebek\"}<br>\n<br>\n<span class=\"text-yellow-400 font-bold\">for</span> kunci <span class=\"text-yellow-400 font-bold\">in</span> kamus:<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(kunci)<br>\n<br>\n<span class=\"text-slate-500 bg-slate-800 px-2 py-1 rounded block mt-2\"># Output:<br># A<br># B</span>\n    </div>\n</div>"
    },
    {
        "title": "Looping Items \ud83d\udd17",
        "subtitle": "Baca Key dan Value sekaligus",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-6\">\n    <div class=\"bg-purple-50 p-6 rounded-2xl border-2 border-purple-200 shadow-sm text-purple-900\">\n        Gunakan <code>.items()</code> jika ingin menarik <b>Key dan Value-nya</b> secara bersamaan dalam perulangan. Kita siapkan 2 variabel!\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\nkamus = {\"A\": \"Apel\", \"B\": \"Bebek\"}<br>\n<br>\n<span class=\"text-yellow-400 font-bold\">for</span> kunci, isi <span class=\"text-yellow-400 font-bold\">in</span> kamus.<span class=\"text-fuchsia-400 font-bold\">items</span>():<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(kunci, \"artinya\", isi)<br>\n<br>\n<span class=\"text-slate-500 bg-slate-800 px-2 py-1 rounded block mt-2\"># Output:<br># A artinya Apel<br># B artinya Bebek</span>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan 5: Nested Dictionary \ud83e\ude86",
        "subtitle": "Kamus di dalam Kamus",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-2\">\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200\">\n        <h4 class=\"font-black text-2xl text-slate-800 mb-4\">Data Super Kompleks</h4>\n        <p class=\"text-md text-slate-600 leading-relaxed\">Seringkali Value dari sebuah dictionary BUKANLAH string/angka, melainkan Dictionary lain yang bersarang di dalamnya.</p>\n        <p class=\"text-sm font-bold text-blue-600 bg-blue-50 p-4 rounded-xl\">Ini banyak dipakai di industri IT (format data JSON) untuk mengirim data antar server!</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-6 rounded-3xl font-mono text-xs shadow-2xl border-2 border-slate-700 leading-loose\">\ndata_murid = {<br>\n&nbsp;&nbsp;<span class=\"text-green-400\">\"Andi\"</span>: {<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-blue-300\">\"umur\"</span>: 15,<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-blue-300\">\"kelas\"</span>: \"10A\"<br>\n&nbsp;&nbsp;},<br>\n&nbsp;&nbsp;<span class=\"text-green-400\">\"Budi\"</span>: {<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-blue-300\">\"umur\"</span>: 16,<br>\n&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-blue-300\">\"kelas\"</span>: \"11B\"<br>\n&nbsp;&nbsp;}<br>\n}<br>\n<br>\n<span class=\"text-slate-400\"># Panggil umur Budi</span><br>\nprint(data_murid[<span class=\"text-yellow-300\">\"Budi\"</span>][<span class=\"text-yellow-300\">\"umur\"</span>]) <span class=\"text-slate-500\"># 16</span>\n    </div>\n</div>"
    },
    {
        "title": "Tarik Nafas Dulu \ud83e\uddd8",
        "subtitle": "Are you ready?",
        "content": "<div class=\"text-center space-y-8 mt-10\">\n    <div class=\"text-8xl mb-8 animate-bounce\">\ud83c\udfc1</div>\n    <p class=\"text-2xl text-slate-800 font-bold max-w-3xl mx-auto leading-relaxed\">Kita sudah menamatkan Dictionary (Membuat, Mengakses, Methods, Looping, dan Nested).</p>\n    <div class=\"bg-amber-100 border-2 border-amber-300 p-6 rounded-2xl max-w-xl mx-auto shadow-md\">\n        <p class=\"text-lg text-amber-900 font-medium\">Di 3 slide berikutnya, ada 3 tantangan rahasia yang harus kalian pecahkan sendiri di komputer kalian. Siap?</p>\n    </div>\n</div>"

    {
        "title": "Challenge 1 \ud83d\udc09",
        "subtitle": "Pokedex Pokemon",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-red-50 p-6 rounded-2xl border border-red-200 flex gap-4 shadow-sm\">\n        <div class=\"text-4xl\">\ud83d\udcf1</div>\n        <div>\n            <p class=\"font-bold text-red-900 text-lg\">Cerita:</p>\n            <p class=\"text-md text-red-800 mt-1\">Alat Pokedex kamu mendeteksi sebuah Pokemon. Kamu punya data elemen setiap pokemon dalam sebuah Dictionary.</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-yellow-400 p-6 rounded-2xl font-mono text-lg shadow-inner border border-slate-700\">\n        pokedex = {\"Pikachu\": \"Listrik\", \"Charmander\": \"Api\", \"Squirtle\": \"Air\"}\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Misi Kamu:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Tulis kode untuk mengambil elemen dari <b>\"Charmander\"</b> dari dalam dictionary.</li>\n            <li>Simpan hasil tersebut ke dalam variabel <code>elemen_musuh</code>.</li>\n            <li>Gunakan <code>print()</code> untuk menampilkannya ke layar!</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Challenge 2 \ud83d\uded2",
        "subtitle": "Kasir Supermarket",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-6 mt-2\">\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 flex gap-4 shadow-sm\">\n        <div class=\"text-4xl\">\ud83e\uddfe</div>\n        <div>\n            <p class=\"font-bold text-indigo-900 text-lg\">Cerita:</p>\n            <p class=\"text-md text-indigo-800 mt-1\">Kamu bertugas mengelola harga barang di supermarket. Harga telur naik dan ada stok barang baru yang datang!</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-yellow-400 p-6 rounded-2xl font-mono text-lg shadow-inner border border-slate-700\">\n        harga = {\"Susu\": 15000, \"Telur\": 25000, \"Roti\": 10000}\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Misi Kamu:</p>\n        <ul class=\"list-disc pl-6 text-md text-slate-700 mt-4 space-y-3 font-medium\">\n            <li>Update (ubah) harga \"Telur\" menjadi <b>28000</b>.</li>\n            <li>Tambahkan barang baru: Key <b>\"Keju\"</b> dengan harga <b>20000</b>.</li>\n            <li>Hapus \"Roti\" dari daftar harga menggunakan perintah `del` atau `.pop()`.</li>\n            <li>Print kondisi akhir dictionary <code>harga</code>.</li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Challenge 3 \ud83c\udf93",
        "subtitle": "Rapor Kelas Bintang",
        "content": "<div class=\"max-w-4xl mx-auto text-left space-y-4 mt-2\">\n    <div class=\"bg-emerald-50 p-5 rounded-2xl border border-emerald-200 flex gap-4 shadow-sm\">\n        <div class=\"text-3xl\">\ud83d\udcca</div>\n        <div>\n            <p class=\"font-bold text-emerald-900\">Cerita:</p>\n            <p class=\"text-sm text-emerald-800 mt-1\">Sekolah menyimpan nilai dalam bentuk <b>Nested Dictionary</b> (kamus di dalam kamus).</p>\n        </div>\n    </div>\n    <div class=\"bg-slate-900 text-yellow-400 p-5 rounded-2xl font-mono text-sm shadow-inner border border-slate-700\">\n        rapor = {<br>\n        &nbsp;&nbsp;\"Siti\": {\"Math\": 90, \"Sains\": 85},<br>\n        &nbsp;&nbsp;\"Tono\": {\"Math\": 75, \"Sains\": 80}<br>\n        }\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-md\">\n        <p class=\"font-black text-blue-800 text-xl flex items-center gap-2\"><span>\ud83c\udfaf</span> Misi Kamu:</p>\n        <ol class=\"list-decimal pl-6 text-md text-slate-700 mt-4 space-y-2 font-medium\">\n            <li>Tulis kode untuk memanggil nilai Sains milik Tono dan print ke layar.</li>\n            <li>Tono ternyata mencontek! Ubah nilai Sains milik Tono di dalam dictionary menjadi <b>0</b>.</li>\n            <li>Print kembali dictionary <code>rapor</code> untuk memastikan nilai Tono sudah hancur.</li>\n        </ol>\n    </div>\n</div>"

    {

    {

        "title": "3. capitalize() & title() \ud83d\udc54",
        "subtitle": "Rapi & Formal",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 text-left mt-6\">\n    <div class=\"bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200\">\n        <h4 class=\"font-black text-2xl text-purple-600 mb-4 font-mono\">.capitalize()</h4>\n        <p class=\"text-sm text-slate-600 mb-6\">Hanya mengubah huruf PERTAMA pada keseluruhan kalimat menjadi besar.</p>\n        <div class=\"bg-slate-900 p-4 rounded-xl text-green-400 font-mono text-sm leading-loose\">\n            t = \"halo dunia ini luas\"<br>\n            print(t.<span class=\"text-purple-400 font-bold\">capitalize()</span>)<br>\n            <span class=\"text-slate-500\"># Halo dunia ini luas</span>\n        </div>\n    </div>\n    <div class=\"bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200\">\n        <h4 class=\"font-black text-2xl text-orange-500 mb-4 font-mono\">.title()</h4>\n        <p class=\"text-sm text-slate-600 mb-6\">Mengubah awalan huruf PADA SETIAP KATA menjadi besar (Mirip Judul).</p>\n        <div class=\"bg-slate-900 p-4 rounded-xl text-green-400 font-mono text-sm leading-loose\">\n            t = \"halo dunia ini luas\"<br>\n            print(t.<span class=\"text-orange-400 font-bold\">title()</span>)<br>\n            <span class=\"text-slate-500\"># Halo Dunia Ini Luas</span>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Mesin Pengubah Bentuk \ud83c\udfed",
        "subtitle": "Bermain dengan Method",
        "content": "<div class=\"max-w-4xl mx-auto text-center mt-6 p-8 bg-slate-100 rounded-3xl border-4 border-slate-300\">\n    <style>\n        .text-machine { transition: 0.5s; }\n    </style>\n    <div class=\"bg-white p-6 rounded-2xl shadow-inner border-2 border-slate-200 mb-8 overflow-hidden h-24 flex justify-center items-center\">\n        <span id=\"machine-output\" class=\"text-4xl font-black text-slate-800 text-machine font-mono tracking-wider\">hAlO kODeR, aPa kAbaR?</span>\n    </div>\n    <div class=\"grid grid-cols-4 gap-4\">\n        <button onclick=\"document.getElementById('machine-output').innerText = 'HALO KODER, APA KABAR?'\" class=\"p-4 bg-red-500 text-white rounded-xl shadow-lg font-bold hover:scale-105 transition hover:bg-red-600 font-mono\">.upper()</button>\n        <button onclick=\"document.getElementById('machine-output').innerText = 'halo koder, apa kabar?'\" class=\"p-4 bg-blue-500 text-white rounded-xl shadow-lg font-bold hover:scale-105 transition hover:bg-blue-600 font-mono\">.lower()</button>\n        <button onclick=\"document.getElementById('machine-output').innerText = 'Halo koder, apa kabar?'\" class=\"p-4 bg-purple-500 text-white rounded-xl shadow-lg font-bold hover:scale-105 transition hover:bg-purple-600 font-mono text-sm\">.capitalize()</button>\n        <button onclick=\"document.getElementById('machine-output').innerText = 'Halo Koder, Apa Kabar?'\" class=\"p-4 bg-orange-500 text-white rounded-xl shadow-lg font-bold hover:scale-105 transition hover:bg-orange-600 font-mono\">.title()</button>\n    </div>\n    <button onclick=\"document.getElementById('machine-output').innerText = 'hAlO kODeR, aPa kAbaR?'\" class=\"mt-8 text-sm text-slate-500 underline font-bold\">Reset ke Asli</button>\n</div>"
    },
    {
        "title": "Apa Gunanya Di Dunia Nyata? \ud83c\udf0d",
        "subtitle": "Menghadapi User Manusia",
        "content": "<div class=\"text-center space-y-6 mt-4\">\n    <p class=\"text-lg text-slate-700\">User (manusia) itu seringkali mengetik sembarangan. Contoh saat program minta ketik 'YA':</p>\n    <div class=\"flex justify-center gap-4 my-6\">\n        <div class=\"bg-red-50 text-red-700 px-4 py-2 rounded-xl border border-red-200 font-mono font-bold shadow-sm\">\"Ya\"</div>\n        <div class=\"bg-red-50 text-red-700 px-4 py-2 rounded-xl border border-red-200 font-mono font-bold shadow-sm\">\"YA\"</div>\n        <div class=\"bg-red-50 text-red-700 px-4 py-2 rounded-xl border border-red-200 font-mono font-bold shadow-sm\">\"yA\"</div>\n        <div class=\"bg-red-50 text-red-700 px-4 py-2 rounded-xl border border-red-200 font-mono font-bold shadow-sm\">\"ya\"</div>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-xl font-mono text-sm inline-block text-left shadow-xl border-2 border-slate-700 max-w-xl mx-auto leading-loose\">\n        <span class=\"text-slate-500\"># Tanpa .lower(), program if-else kita akan bocor!</span><br>\n        jawaban = input(\"Lanjut? \")<br>\n        if jawaban == \"ya\":<br>\n        &nbsp;&nbsp;&nbsp;&nbsp;print(\"Oke!\")\n    </div>\n    <p class=\"text-md text-slate-600 font-medium\">Jika user mengetik <code class=\"font-bold\">\"YA\"</code>, if-else di atas akan menganggapnya False (karena <code class=\"font-bold\">\"YA\"</code> tidak sama dengan <code class=\"font-bold\">\"ya\"</code>). Gawat kan?</p>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Membersihkan Input",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83e\uddf9</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Mari kita lihat bagaimana method Case menyelamatkan program If-Else kita dari input user yang berantakan.</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Bedah Kode di Sebelah \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 1: Menerima Input",
        "subtitle": "Tanpa Filter",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">jawaban = input(\"Apakah kamu setuju? (ya/tidak): \")</span>\n<span class=\"opacity-20 block mt-2\">jawaban_bersih = jawaban.lower()</span>\n<span class=\"opacity-20 block mt-2\">if jawaban_bersih == \"ya\":<br>&nbsp;&nbsp;print(\"Bagus!\")<br>else:<br>&nbsp;&nbsp;print(\"Sayang sekali\")</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Pertama, kita meminta input dari user. Misal user iseng mengetik dengan gaya alay: <b>\"Ya\"</b> atau <b>\"YA\"</b>.</p>\n            <div class=\"bg-red-50 p-4 rounded-xl border border-red-200 mt-4\">\n                <p class=\"text-xs font-bold text-red-600 mb-2 uppercase\">Nilai Variabel:</p>\n                <p class=\"text-sm font-mono text-red-900\">jawaban = \"Ya\"</p>\n            </div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 2: Filter .lower()",
        "subtitle": "Menyeragamkan Bentuk",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"opacity-20 block\">jawaban = input(\"Apakah kamu setuju? (ya/tidak): \")</span>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">jawaban_bersih = jawaban.lower()</span>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block mt-2\">if jawaban_bersih == \"ya\":<br>&nbsp;&nbsp;print(\"Bagus!\")<br>else:<br>&nbsp;&nbsp;print(\"Sayang sekali\")</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">Apapun yang user ketik (\"Ya\", \"YA\", \"yA\"), akan langsung kita **paksa** menjadi kecil semua dengan <code>.lower()</code>.</p>\n            <p class=\"text-sm text-slate-600 mt-2\">Karena sudah dijamin huruf kecil, maka pengecekan <code>if jawaban_bersih == \"ya\"</code> akan berjalan mulus 100% tanpa takut bocor!</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Waktunya Live Python! \ud83d\udc0d",
        "subtitle": "Independent Exercise",
        "content": "<div class=\"text-center space-y-8 max-w-3xl mx-auto mt-8\">\n    <div class=\"text-7xl text-green-500 animate-pulse\">\ud83d\udcbb</div>\n    <h3 class=\"text-3xl font-black text-slate-800\">Giliran Kalian Mencoba!</h3>\n    <p class=\"text-lg text-slate-600\">Di slide selanjutnya, praktikkan penggunaan case method langsung di dalam mini editor PyScript.</p>\n    <div class=\"inline-block bg-slate-900 text-white px-6 py-3 rounded-full font-bold uppercase tracking-widest text-sm shadow-xl\">\n        Tekan SHIFT + ENTER untuk Run Code\n    </div>\n</div>"
    },
    {
        "title": "Exercise 2: Independent \ud83d\udcbb",
        "subtitle": "Mesin Kasir Pemaksa",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 h-[400px]\">\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col\">\n        <h4 class=\"font-black text-2xl text-slate-800\">Tugasmu:</h4>\n        <p class=\"text-md text-slate-600 flex-1\">Di kanan ada variabel <code>nama_toko</code> yang isinya berantakan (typo). Tulis ulang nama toko tersebut ke dalam variabel <code>nama_rapi</code> menggunakan method <code>.upper()</code> atau <code>.title()</code> agar terlihat resmi!</p>\n        <div>\n            <button onclick=\"toggleReveal('ans-ex1')\" class=\"w-full px-4 py-3 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl font-bold text-sm text-slate-700 transition-colors shadow-sm\">Bocoran Jawaban \ud83d\ude48</button>\n            <div id=\"ans-ex1\" class=\"hidden mt-4 bg-green-50 p-4 border border-green-200 rounded-xl text-sm text-green-800 font-mono shadow-inner\">\n                nama_rapi = nama_toko.title()<br>print(nama_rapi)\n            </div>\n        </div>\n    </div>\n    <div class=\"border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative h-full bg-[#1e1e1e]\">\n        <py-repl class=\"h-full w-full text-sm\">nama_toko = \"waRung MaKan pak buDI\"\n\n# Ubah ke Format Title Case (Awalan huruf besar):\nnama_rapi = \n\nprint(nama_rapi)\n</py-repl>\n    </div>\n</div>"
    },
    {
        "title": "Konsep 3: Potong & Sambung \ud83e\udde9",
        "subtitle": "Split and Join",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-6 flex justify-center gap-4\"><span class=\"animate-bounce\">\u2702\ufe0f</span> <span class=\"animate-bounce delay-150\">\ud83e\uddea</span></div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed font-medium\">\n        Ini adalah dua jurus paling sering digunakan saat kita memproses data (misal: Data CSV, Excel, log server). Memecah sebuah kalimat panjang menjadi serpihan kata, dan menggabungkannya kembali.\n    </p>\n</div>"
    },
    {
        "title": "Method: .split() \u2702\ufe0f",
        "subtitle": "Memecah String menjadi List",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-rose-50 border-2 border-rose-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udca5</div>\n        <p class=\"text-lg text-rose-900 font-medium\"><code>.split()</code> akan <b>meledakkan</b> sebuah String menjadi kepingan-kepingan <b>List</b>. Secara default (jika dikosongi), ia akan memecah berdasarkan spasi.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nkalimat = \"Aku Belajar Python\"<br><br>\npecahan = kalimat.<span class=\"text-rose-400 font-bold\">split()</span><br>\nprint(pecahan)<br>\n<span class=\"text-slate-500 mt-2 block\"># Output: ['Aku', 'Belajar', 'Python']</span>\n    </div>\n</div>"
    },
    {
        "title": "Parameter .split(\"...\") \ud83c\udfaf",
        "subtitle": "Menentukan pisau potongnya",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <p class=\"text-lg text-slate-700\">Kita bisa memasukkan \"pisau\" pemotong spesifik di dalam kurung. Contoh paling nyata: Memecah daftar buah yang dipisahkan tanda koma.</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\ndata_excel = \"Apel,Mangga,Jeruk\"<br><br>\n<span class=\"text-slate-500\"># Potong setiap kali ketemu karakter koma (,)</span><br>\ndaftar_buah = data_excel.split(<span class=\"text-yellow-400 font-bold\">\",\"</span>)<br>\nprint(daftar_buah)<br>\n<span class=\"text-green-400 mt-2 block font-bold\"># Output: ['Apel', 'Mangga', 'Jeruk']</span>\n    </div>\n</div>"
    },
    {
        "title": "Method: .join() \ud83e\uddea",
        "subtitle": "Menyambung List menjadi String",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-cyan-50 border-2 border-cyan-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83e\uddf2</div>\n        <p class=\"text-lg text-cyan-900 font-medium\">Kebalikan dari Split. <code>.join()</code> digunakan untuk merangkai isi sebuah List/Array kembali menjadi satu kalimat utuh (String).</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nlist_kata = ['Aku', 'Belajar', 'Python']<br><br>\n<span class=\"text-slate-500\"># \"lem\".join(list_yang_mau_disambung)</span><br>\nkalimat = <span class=\"text-yellow-400 font-bold\">\" \"</span>.<span class=\"text-cyan-400 font-bold\">join(list_kata)</span><br>\nprint(kalimat)<br>\n<span class=\"text-slate-500 mt-2 block\"># Output: \"Aku Belajar Python\"</span>\n    </div>\n</div>"
    },
    {
        "title": "Lem Penyambung .join() \ud83d\udd17",
        "subtitle": "Pilih jenis lem-nya",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <p class=\"text-lg text-slate-700\">Tanda kutip di depan <code>.join</code> adalah <b>lem/penyambungnya</b>. Kita bisa ganti lemnya pakai spasi, strip, bintang, atau bahkan tanpa spasi sama sekali (kosong).</p>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose\">\ndata = [\"19\", \"08\", \"1945\"]<br><br>\n<span class=\"text-slate-500\"># Lem dengan garis miring (Format Tanggal)</span><br>\ntgl = <span class=\"text-yellow-400 font-bold\">\"/\"</span>.join(data) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\"># 19/08/1945</span><br><br>\n<span class=\"text-slate-500\"># Lem dengan strip</span><br>\nstrip = <span class=\"text-yellow-400 font-bold\">\"-\"</span>.join(data) &nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\"># 19-08-1945</span><br><br>\n<span class=\"text-slate-500\"># Tanpa spasi/lem sama sekali (menempel rapat)</span><br>\nrapat = <span class=\"text-yellow-400 font-bold\">\"\"</span>.join(data) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"text-green-400\"># 19081945</span><br>\n    </div>\n</div>"
    },
    {
        "title": "Mantra Bolak-Balik \ud83e\ude84",
        "subtitle": "Kombinasi Split dan Join",
        "content": "<div class=\"max-w-4xl mx-auto text-center mt-6 p-8 bg-slate-50 rounded-3xl border-2 border-slate-200\">\n    <div class=\"bg-blue-100 text-blue-900 p-4 rounded-xl font-mono font-bold border-2 border-blue-300 inline-block text-xl\">\"A_B_C\"</div>\n    \n    <div class=\"flex justify-center my-6 relative\">\n        <div class=\"border-l-4 border-dashed border-red-400 h-16 ml-10\"></div>\n        <p class=\"absolute top-1/2 -translate-y-1/2 left-[calc(50%+20px)] text-sm font-bold text-red-600 bg-red-50 px-2 py-1 rounded\">.split(\"_\")</p>\n    </div>\n\n    <div class=\"flex justify-center gap-4\">\n        <div class=\"bg-slate-800 text-white px-6 py-2 rounded-lg font-mono font-bold shadow-lg border border-slate-600\">['A']</div>\n        <div class=\"bg-slate-800 text-white px-6 py-2 rounded-lg font-mono font-bold shadow-lg border border-slate-600\">['B']</div>\n        <div class=\"bg-slate-800 text-white px-6 py-2 rounded-lg font-mono font-bold shadow-lg border border-slate-600\">['C']</div>\n    </div>\n\n    <div class=\"flex justify-center my-6 relative\">\n        <div class=\"border-l-4 border-dashed border-green-400 h-16 ml-10\"></div>\n        <p class=\"absolute top-1/2 -translate-y-1/2 left-[calc(50%+20px)] text-sm font-bold text-green-600 bg-green-50 px-2 py-1 rounded\">\" \".join(...)</p>\n    </div>\n\n    <div class=\"bg-green-100 text-green-900 p-4 rounded-xl font-mono font-bold border-2 border-green-300 inline-block text-xl\">\"A B C\"</div>\n</div>"
    },
    {
        "title": "Konsep 4: Membersihkan Debu \ud83e\uddf9",
        "subtitle": "Strip Whitespace",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-6\">\ud83c\udf2c\ufe0f</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Saat kamu copy-paste teks dari internet, kadang tidak sengaja terbawa banyak spasi di awal atau di akhir teks. Spasi yang tidak kasat mata ini bisa merusak program komputer!\n    </p>\n</div>"
    },
    {
        "title": "Method: .strip() \u2702\ufe0f",
        "subtitle": "Cukur spasi berlebih",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83e\ude92</div>\n        <p class=\"text-lg text-slate-700 font-medium\"><code>.strip()</code> berfungsi memangkas habis semua \"Whitespace\" (Spasi kosong, Tab, Enter/Newline) yang ada di KIRI dan KANAN string.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\ninput_kotor = <span class=\"bg-white/20 px-1 rounded\">\" &nbsp;&nbsp;Hello World &nbsp;&nbsp;&nbsp;\"</span><br><br>\nbersih = input_kotor.<span class=\"text-yellow-400 font-bold\">strip()</span><br>\nprint(bersih)<br>\n<span class=\"text-green-400 mt-2 block font-bold\"># Output: \"Hello World\"</span>\n    </div>\n    <p class=\"text-sm font-bold text-red-500 italic\">*Ingat: Strip HANYA membersihkan spasi di pinggir ujung, BUKAN spasi di tengah kata!</p>\n</div>"
    },
    {
        "title": "Visualisasi .strip() \ud83d\udca8",
        "subtitle": "Mesin Vakum Tepi",
        "content": "<div class=\"max-w-4xl mx-auto text-center mt-12 p-8 bg-slate-800 rounded-3xl border-2 border-slate-700 relative overflow-hidden group\">\n    <style>\n        .dust { position: absolute; font-size: 20px; transition: 1s ease-in-out; }\n        .group:hover .dust { transform: scale(0) rotate(180deg); opacity: 0; }\n        .group:hover .clean-text { transform: scale(1.2); text-shadow: 0 0 20px #22c55e;}\n    </style>\n    <div class=\"dust\" style=\"top: 20%; left: 10%;\">\u2601\ufe0f</div>\n    <div class=\"dust\" style=\"top: 60%; left: 15%;\">\ud83d\udca8</div>\n    <div class=\"dust\" style=\"top: 30%; right: 10%;\">\u2601\ufe0f</div>\n    <div class=\"dust\" style=\"top: 70%; right: 15%;\">\ud83d\udca8</div>\n    \n    <div class=\"flex justify-center items-center h-24\">\n        <div class=\"bg-white/10 px-8 py-4 rounded font-mono text-white tracking-[0.5em] clean-text transition-all duration-1000\">\"   PYTHON   \"</div>\n    </div>\n    \n    <div class=\"mt-8 text-yellow-400 font-bold font-mono\">.strip()</div>\n    <p class=\"mt-4 text-slate-400 text-sm\">Hover kotak ini untuk menyedot spasi/debu pinggiran!</p>\n</div>"
    },
    {
        "title": "Konsep 5: Mencari & Mengganti \ud83d\udd0d",
        "subtitle": "Replace",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-6 animate-pulse\">\ud83e\udd10</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed\">\n        Pernah main game online dan ketika kalian mengetik kata kasar, kata itu otomatis berubah menjadi bintang `***`? Itu adalah hasil kerja operasi String <b>Replace</b>.\n    </p>\n</div>"
    },
    {
        "title": "Method: .replace() \ud83d\udd04",
        "subtitle": "Tukar Guling Teks",
        "content": "<div class=\"max-w-4xl mx-auto space-y-6 text-left mt-4\">\n    <div class=\"flex items-center gap-6 p-6 bg-indigo-50 border-2 border-indigo-200 rounded-3xl shadow-sm\">\n        <div class=\"text-5xl\">\ud83d\udd04</div>\n        <p class=\"text-lg text-indigo-900 font-medium\">Syntax: <code>.replace(\"Yang_Dicari\", \"Penggantinya\")</code>. Method ini akan memindai keseluruhan teks dan mengganti SEMUA kata yang cocok.</p>\n    </div>\n    <div class=\"bg-slate-900 text-white p-8 rounded-2xl font-mono text-lg shadow-xl border border-slate-700 leading-loose\">\nchat = \"Dasar kamu jelek dan jelek banget!\"<br><br>\n<span class=\"text-slate-500\"># Sensor kata \"jelek\" jadi \"*****\"</span><br>\nsensor = chat.<span class=\"text-indigo-400 font-bold\">replace(\"jelek\", \"*****\")</span><br>\nprint(sensor)<br>\n<span class=\"text-green-400 mt-2 block font-bold\"># Output: \"Dasar kamu ***** dan ***** banget!\"</span>\n    </div>\n</div>"

    {
        "title": "Exercise 2: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Membangun Chat Filter",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83e\udd16</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Kita akan menggabungkan fitur <code>.lower()</code> dan <code>.replace()</code> untuk membuat bot sensor chat yang kuat (Anti tembus huruf besar/kecil)!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Lihat Caranya \u27a1\ufe0f\n    </div>\n</div>"

        "subtitle": "Kombinasi Method Berantai",
        "content": "<div class=\"max-w-5xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-xs h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-slate-400 block\"># Input licik dari user</span><br>\npesan = \"Dasar KaMu boDOH\"<br>\n<br>\n<span class=\"text-slate-400 block\"># 1. Turunkan semua jadi huruf kecil dulu</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block\">pesan_kecil = pesan.lower()</span><br>\n<br>\n<span class=\"text-slate-400 block\"># 2. Baru kita ganti kata kasarnya</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded block\">pesan_aman = pesan_kecil.replace(\"bodoh\", \"****\")</span><br>\n<br>\nprint(pesan_aman)\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan Taktik:</h4>\n        <div class=\"space-y-4\">\n            <p class=\"text-sm text-slate-600\">User sengaja mengetik \"boDOH\" agar sistem sensor kita gagal (Sistem mencari kata \"bodoh\" kecil semua).</p>\n            <p class=\"text-sm text-slate-600 border-l-4 border-orange-400 pl-3\">Taktiknya: Kita paksa dulu semua input menjadi huruf kecil dengan <code>.lower()</code>. Setelah teksnya seragam, barulah aman untuk di-<code>.replace()</code>!</p>\n            <div class=\"bg-green-50 p-3 rounded-xl border border-green-200 text-xs font-mono font-bold text-green-800\">\n                Output: dasar kamu ****\n            </div>\n        </div>\n    </div>\n</div>"

    {
        "title": "Bonus Method Cepat \ud83d\ude80",
        "subtitle": "Fungsi berguna lainnya",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-6 mt-6\">\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow text-left\">\n        <h4 class=\"font-bold text-lg text-slate-800 mb-2\">.find(\"x\")</h4>\n        <p class=\"text-sm text-slate-600 mb-2\">Mencari kata di index ke berapa.</p>\n        <code class=\"bg-slate-100 px-2 rounded text-xs text-blue-600\">\"halo\".find(\"a\") # Hasil: 1</code>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow text-left\">\n        <h4 class=\"font-bold text-lg text-slate-800 mb-2\">.count(\"x\")</h4>\n        <p class=\"text-sm text-slate-600 mb-2\">Menghitung jumlah huruf/kata muncul.</p>\n        <code class=\"bg-slate-100 px-2 rounded text-xs text-blue-600\">\"haah\".count(\"a\") # Hasil: 2</code>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow text-left\">\n        <h4 class=\"font-bold text-lg text-slate-800 mb-2\">.startswith(\"x\")</h4>\n        <p class=\"text-sm text-slate-600 mb-2\">Mengecek apakah diawali huruf x (True/False).</p>\n        <code class=\"bg-slate-100 px-2 rounded text-xs text-blue-600\">\"http\".startswith(\"ht\") # True</code>\n    </div>\n    <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow text-left\">\n        <h4 class=\"font-bold text-lg text-slate-800 mb-2\">.endswith(\"x\")</h4>\n        <p class=\"text-sm text-slate-600 mb-2\">Mengecek apakah diakhiri huruf x (True/False).</p>\n        <code class=\"bg-slate-100 px-2 rounded text-xs text-blue-600\">\"file.jpg\".endswith(\".jpg\") # True</code>\n    </div>\n</div>"

    {
        "title": "Summary \ud83d\udcdd",
        "subtitle": "Cheat Sheet String Methods",
        "content": "<div class=\"max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-k-blue h-full flex flex-col justify-center mt-4\">\n    <div class=\"grid grid-cols-2 gap-6 text-left\">\n        <div class=\"bg-slate-50 p-5 rounded-2xl border border-slate-100\">\n            <h4 class=\"font-black text-xl text-slate-800 mb-2 border-b pb-2\">\ud83d\udd20 Text Casing</h4>\n            <ul class=\"space-y-2 text-sm font-mono text-slate-600 mt-2\">\n                <li>.upper() <span class=\"text-xs text-slate-400\"># BESAR</span></li>\n                <li>.lower() <span class=\"text-xs text-slate-400\"># kecil</span></li>\n                <li>.title() <span class=\"text-xs text-slate-400\"># Judul Buku</span></li>\n                <li>.capitalize() <span class=\"text-xs text-slate-400\"># Awal saja</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-2xl border border-slate-100\">\n            <h4 class=\"font-black text-xl text-slate-800 mb-2 border-b pb-2\">\u2702\ufe0f Pecah & Sambung</h4>\n            <ul class=\"space-y-2 text-sm font-mono text-slate-600 mt-2\">\n                <li>.split(\",\") <span class=\"text-xs text-slate-400\"># Pecah jadi List</span></li>\n                <li>\",\".join(L) <span class=\"text-xs text-slate-400\"># Sambung List</span></li>\n            </ul>\n        </div>\n        <div class=\"bg-slate-50 p-5 rounded-2xl border border-slate-100 col-span-2\">\n            <h4 class=\"font-black text-xl text-slate-800 mb-2 border-b pb-2\">\ud83e\uddf9 Cukur & Tukar</h4>\n            <ul class=\"space-y-2 text-sm font-mono text-slate-600 mt-2\">\n                <li>.strip() <span class=\"text-xs text-slate-400\"># Buang spasi kiri-kanan batas kata</span></li>\n                <li>.replace(\"A\", \"B\") <span class=\"text-xs text-slate-400\"># Ganti semua huruf/kata A dengan B</span></li>\n            </ul>\n        </div>\n    </div>\n</div>"

    {
