<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Level 2 - Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], display: ['Orbitron', 'sans-serif'] },
                    colors: {
                        'k-blue': '#265E9B',
                        'k-blue-d': '#1A4576',
                        'k-yellow': '#F9C013',
                        'k-yellow-d': '#D9A40A',
                        'k-green': '#339D9D',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #e8f2ff;
            --bg2: #dbeeff;
            --sky: #cfe5ff;
            --nebula1: rgba(38,94,155,0.10);
            --nebula2: rgba(249,192,19,0.10);
            --card: rgba(255,255,255,0.94);
            --card-b: rgba(180,215,255,0.85);
            --nav: rgba(255,255,255,0.92);
            --nav-b: rgba(180,215,255,0.90);
            --text: #1a4576;
            --muted: #4d7daf;
            --chip: #ffffff;
            --chip-b: #cde0f8;
            --chip-t: #265E9B;
            --stars: 0.12;
        }

        html[data-theme="dark"] {
            --bg: #06101f;
            --bg2: #0d1e3e;
            --sky: #0a1830;
            --nebula1: rgba(82,188,255,0.18);
            --nebula2: rgba(249,192,19,0.15);
            --card: rgba(14,30,60,0.82);
            --card-b: rgba(140,190,255,0.22);
            --nav: rgba(6,14,30,0.90);
            --nav-b: rgba(120,170,255,0.22);
            --text: #ffffff;
            --muted: #b0c9e8;
            --chip: rgba(255,255,255,0.12);
            --chip-b: rgba(140,190,255,0.28);
            --chip-t: #cce0ff;
            --stars: 0.45;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, var(--nebula1), transparent 36%),
                radial-gradient(circle at 88% 12%, var(--nebula2), transparent 32%),
                radial-gradient(circle at 50% 105%, rgba(51,157,157,0.14), transparent 34%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg2) 50%, var(--sky) 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed; inset: 0;
            pointer-events: none; z-index: -20;
            opacity: var(--stars);
            background-image:
                radial-gradient(circle at 14% 24%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
                radial-gradient(circle at 78% 68%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
                radial-gradient(circle at 56% 38%, rgba(255,255,255,0.60) 0 1px, transparent 1.4px),
                radial-gradient(circle at 30% 82%, rgba(255,255,255,0.50) 0 1px, transparent 1.3px);
            background-size: 250px 250px, 320px 320px, 210px 210px, 280px 280px;
        }

        .topnav {
            background: var(--nav);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--nav-b);
        }
        .planet-card { 
            background: var(--card); 
            border: 1.5px solid var(--card-b); 
            backdrop-filter: blur(12px); 
            box-shadow: 0 20px 40px -20px rgba(2,8,26,0.85);
        }
        .chip { background: var(--chip); border: 1.5px solid var(--chip-b); color: var(--chip-t); }

        .slide-transition { transition: opacity 0.4s ease, transform 0.4s ease; }
        .meeting-tab { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        .meeting-tab:hover { background: rgba(255,255,255,0.05); border-color: var(--card-b); transform: translateX(4px); }
        .meeting-tab.active { background: linear-gradient(90deg, rgba(38,94,155,0.2), transparent); border-left: 3px solid var(--chip-t); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        #mission-loader {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        #mission-loader.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-rocket { width: 140px; height: auto; object-fit: contain; animation: loaderFloat 2.5s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(249,192,19,0.5)); }
        @keyframes loaderFloat { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-30px) rotate(8deg); } }
        .loader-bar { width: 280px; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-top: 40px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .loader-progress { position: absolute; inset: 0; background: linear-gradient(90deg, #F9C013, #FFD700); width: 0%; animation: loaderFill 2s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        @keyframes loaderFill { 0% { width: 0%; } 100% { width: 100%; } }

        @keyframes simpleFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-15px) rotate(3deg); } }

        #welcomeOverlay { position: fixed; inset: 0; background: var(--bg); opacity: 0.95; backdrop-filter: blur(20px); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        .delay-500ms { animation-delay: 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-3d { 
            position: relative; transition: all 0.2s;
            box-shadow: 0 6px 0 #1A4576, 0 15px 30px -5px rgba(38, 94, 155, 0.4); border: none; cursor: pointer;
        }
        .btn-3d:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1A4576, 0 20px 40px -10px rgba(38, 94, 155, 0.5); }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #1A4576, 0 5px 10px -2px rgba(38, 94, 155, 0.3); }

    </style>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />

</head>

        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/c08a7aed-567f-4e37-988c-1423a5b92643.png" style="position: absolute; left: 0; top: 72%; width: min(30vw, 240px); opacity: 0.6; transform-origin: left center; transform: translateX(-34%);" alt="">

                </button>
                <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/828072b7-9198-4367-bce2-134b9fc8b486.png"

                <div class="h-6 w-[1.5px] bg-[var(--card-b)] hidden md:block mx-2"></div>
                <div class="hidden md:flex flex-col">
                    <p class="text-[9px] font-black text-muted uppercase tracking-[0.2em] mb-0.5">Petualangan Kodemu</p>
                    <h2 class="font-black text-k-blue text-sm">Python L2 <span class="text-muted/40 mx-2">/</span> Mission Control</h2>

            <div class="w-24"></div>

        <div class="flex-1 flex overflow-hidden p-4 sm:p-6 md:p-8 gap-6 md:gap-8 max-w-[1600px] mx-auto w-full">

            <aside id="sidebar" class="fixed lg:relative left-0 top-0 h-full w-80 lg:w-72 planet-card rounded-[2.5rem] flex-shrink-0 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out z-50 lg:z-auto shadow-2xl">

<!-- Data & Script -->
    <script>
        // --- Configuration ---
        const totalMeetings = 12;
        let currentMeeting = 1;
        let currentSlide = 1;

        // --- Data Structure ---

        // --- Welcome Logic from Level 2 ---
        const welcomeMessage = document.getElementById('welcomeMessage');
        const meetingSelectionSection = document.getElementById('meetingSelectionSection');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const displayTeacherName = document.getElementById('displayTeacherName');
        const teacherInputSection = document.getElementById('teacherInputSection');
        const welcomeBackSection = document.getElementById('welcomeBackSection');

        function checkTeacherName() {
            let teacher = localStorage.getItem("teacherName");
            if (teacher) {
                if(teacherInputSection) teacherInputSection.classList.add('hidden');
                if(welcomeBackSection) welcomeBackSection.classList.remove('hidden');
                if(displayTeacherName) displayTeacherName.innerText = teacher;
            } else {
                if(teacherInputSection) teacherInputSection.classList.remove('hidden');
                if(welcomeBackSection) welcomeBackSection.classList.add('hidden');
            }
        }

        window.startClass = function() {
            const name = document.getElementById('teacherName') ? document.getElementById('teacherName').value : '';
            const hobby = document.getElementById('teacherHobby') ? document.getElementById('teacherHobby').value : '';
            const food = document.getElementById('teacherFood') ? document.getElementById('teacherFood').value : '';
            
            if (name.trim()) {
                localStorage.setItem("teacherName", name);
                localStorage.setItem("teacherHobby", hobby || "Ngoding 💻");
                localStorage.setItem("teacherFood", food || "Nasi Goreng 🍛");
                showMeetingSelection();
            } else {
                alert("Mohon masukkan nama kakak pengajar dulu ya! 😊");
            }
        }

        window.enterClass = function() { showMeetingSelection(); }

        window.resetTeacher = function() {
            localStorage.removeItem("teacherName");
            localStorage.removeItem("teacherHobby");
            localStorage.removeItem("teacherFood");
            if(document.getElementById('teacherName')) document.getElementById('teacherName').value = "";
            if(document.getElementById('teacherHobby')) document.getElementById('teacherHobby').value = "";
            if(document.getElementById('teacherFood')) document.getElementById('teacherFood').value = "";
            checkTeacherName();
        }

        function showMeetingSelection() {
            if(teacherInputSection) teacherInputSection.classList.add('hidden');
            if(welcomeBackSection) welcomeBackSection.classList.add('hidden');
            if(welcomeMessage) welcomeMessage.classList.add('hidden');
            if(meetingSelectionSection) meetingSelectionSection.classList.remove('hidden');
            
            const grid = document.getElementById('meetingGrid');
            if(grid) {
                grid.innerHTML = '';
                for (let i = 1; i <= 12; i++) {
                    const btn = document.createElement('button');
                    const isLocked = !meetingData[i] || (i > 1 && meetingData[i].length === 1 && meetingData[i][0].content.includes("Soon"));
                    
                    let topic = "Belum tersedia";
                    if (!isLocked) {
                        const mainSlide = meetingData[i].find(s => s.title.startsWith(`Meeting ${i}:`)) || meetingData[i][0];
                        if (mainSlide) {
                            const titleParts = mainSlide.title.split(': ');
                            if (titleParts.length > 1) {
                                topic = titleParts[1];
                            } else {
                                topic = mainSlide.subtitle || "Klik untuk mulai";
                            }
                        }
                    }

                    btn.className = `p-6 rounded-3xl transition-all duration-300 flex flex-col items-center justify-center gap-3 border ${!isLocked ? 'planet-card border-[var(--card-b)] hover:-translate-y-2 hover:shadow-2xl cursor-pointer hover:border-k-yellow' : 'bg-[var(--bg2)] border-[var(--card-b)] opacity-50 cursor-not-allowed'}`;
                    btn.innerHTML = `
                        <span class="text-3xl font-display font-black ${!isLocked ? 'text-[var(--text)]' : 'text-muted'}">MISI ${i}</span>
                        <span class="text-[10px] text-center font-bold uppercase tracking-widest ${!isLocked ? 'text-k-blue' : 'text-muted/60'} mt-1">${topic}</span>
                    `;
                    if (!isLocked) btn.onclick = () => selectMeeting(i);
                    grid.appendChild(btn);
                }
            }
        }

        function selectMeeting(id) {
            currentMeeting = id;
            currentSlide = 1;
            if(welcomeOverlay) welcomeOverlay.style.opacity = '0';
            setTimeout(() => {
                if(welcomeOverlay) welcomeOverlay.style.display = 'none';
                const mainContent = document.getElementById('mainContent');
                if(mainContent) {
                    mainContent.classList.remove('hidden');
                    setTimeout(() => {
                        mainContent.classList.remove('opacity-0');
                        renderSidebar();
                        renderSlide();
                    }, 50);
                }
            }, 1000);
        }
        
        checkTeacherName();

        // Placeholder data logic, content to be filled later
        const meetingData = {
            1: [
    {
        "title": "Meeting 1: Advanced Lists & Slicing \ud83d\udccb",
        "subtitle": "Misi Baru Dimulai",
        "content": "<div class=\"text-center space-y-6 max-w-3xl mx-auto\">\n    <div class=\"text-7xl mb-6\">\ud83d\ude80</div>\n    <div id=\"instructor-name-container\"></div>\n    <p class=\"text-xl text-slate-600 mt-4\">Selamat datang di Level 2! Di level ini, kita akan menjadi pengontrol data tingkat lanjut. Bersiaplah untuk misi-misi yang lebih menantang!</p>\n</div>"
    },
    {
        "title": "Pemanasan Level 1 \ud83d\udd25",
        "subtitle": "Mari Kita Ingat Kembali",
        "content": "<div class=\"text-center space-y-6 max-w-3xl mx-auto\">\n    <div class=\"text-6xl mb-6\">\ud83e\udde0</div>\n    <p class=\"text-lg text-slate-600\">Sebelum masuk ke materi baru, mari kita test ingatanmu tentang apa yang sudah dipelajari di Level 1. Siap?</p>\n    <button onclick=\"nextSlide()\" class=\"btn-3d bg-k-blue text-white px-8 py-4 rounded-xl font-bold uppercase tracking-widest mt-8\">Mulai Flashback!</button>\n</div>"
    },
    {
        "title": "Flashback 1: Print & Variables \ud83d\udda8\ufe0f",
        "subtitle": "Menyimpan dan Menampilkan",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6\">\n    <div class=\"bg-slate-900 text-green-400 p-5 rounded-xl font-mono text-sm shadow-lg\">\nnama_hero = \"Iron Man\"<br>\nprint(\"Hero kita adalah\", nama_hero)\n    </div>\n    <div class=\"bg-white p-5 rounded-xl border border-slate-200 text-center\">\n        <p class=\"font-bold text-slate-700\">Apa output dari kode di atas?</p>\n        <div class=\"flex justify-center gap-4 mt-4\">\n            <button onclick=\"showMiniFeedback('fb1-fb', 'Salah, cek lagi teksnya!', 'error')\" class=\"px-4 py-2 border rounded-lg hover:bg-slate-50\">Hero kita adalah nama_hero</button>\n            <button onclick=\"showMiniFeedback('fb1-fb', 'Tepat! Variabel akan diganti dengan isinya.', 'success')\" class=\"px-4 py-2 border rounded-lg hover:bg-slate-50\">Hero kita adalah Iron Man</button>\n        </div>\n        <div id=\"fb1-fb\" class=\"mt-4 min-h-[40px]\"></div>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 2: Data Types \ud83e\uddec",
        "subtitle": "Jenis-jenis Data",
        "content": "<div class=\"max-w-3xl mx-auto\">\n    <div class=\"grid grid-cols-3 gap-4 text-center\">\n        <div class=\"bg-blue-50 p-4 rounded-xl border border-blue-200\">\n            <div class=\"text-2xl mb-2\">\"A\"</div>\n            <h4 class=\"font-bold text-blue-800\">String</h4>\n            <p class=\"text-xs text-slate-500\">Teks / Karakter</p>\n        </div>\n        <div class=\"bg-green-50 p-4 rounded-xl border border-green-200\">\n            <div class=\"text-2xl mb-2\">99</div>\n            <h4 class=\"font-bold text-green-800\">Integer</h4>\n            <p class=\"text-xs text-slate-500\">Angka Bulat</p>\n        </div>\n        <div class=\"bg-yellow-50 p-4 rounded-xl border border-yellow-200\">\n            <div class=\"text-2xl mb-2\">True</div>\n            <h4 class=\"font-bold text-yellow-800\">Boolean</h4>\n            <p class=\"text-xs text-slate-500\">Benar / Salah</p>\n        </div>\n    </div>\n    <div class=\"mt-8 bg-slate-900 p-4 rounded-xl text-center shadow-lg\">\n        <p class=\"text-white font-mono\">skor = 10.5</p>\n        <p class=\"text-yellow-400 text-sm mt-2\">Ini tipe data apa? (Jawab: Float / Desimal)</p>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 3: Input \ud83c\udfa4",
        "subtitle": "Menerima Jawaban User",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6\">\n    <div class=\"bg-slate-900 text-green-400 p-5 rounded-xl font-mono text-sm shadow-lg\">\numur = input(\"Berapa umurmu? \")<br>\numur_angka = int(umur)\n    </div>\n    <div class=\"bg-red-50 p-5 rounded-xl border border-red-200 text-center\">\n        <h4 class=\"font-bold text-red-800 mb-2\">Ingat!</h4>\n        <p class=\"text-sm text-red-600\">Semua yang dimasukkan lewat <code>input()</code> awalnya berupa <b>String</b>. Harus diubah ke <code>int()</code> jika ingin dihitung!</p>\n    </div>\n</div>"
    },
    {
        "title": "Flashback 4: Basic Math \ud83e\uddee",
        "subtitle": "Operasi Matematika",
        "content": "<div class=\"max-w-3xl mx-auto\">\n    <table class=\"w-full text-left bg-white rounded-xl overflow-hidden shadow-lg border-collapse\">\n        <tr class=\"bg-slate-100 text-slate-700\">\n            <th class=\"p-4 border-b\">Operator</th>\n            <th class=\"p-4 border-b\">Fungsi</th>\n            <th class=\"p-4 border-b font-mono\">Contoh</th>\n        </tr>\n        <tr><td class=\"p-4 border-b font-mono text-lg text-center\">+</td><td class=\"p-4 border-b\">Tambah</td><td class=\"p-4 border-b font-mono text-sm\">5 + 2 = 7</td></tr>\n        <tr><td class=\"p-4 border-b font-mono text-lg text-center\">-</td><td class=\"p-4 border-b\">Kurang</td><td class=\"p-4 border-b font-mono text-sm\">5 - 2 = 3</td></tr>\n        <tr><td class=\"p-4 border-b font-mono text-lg text-center\">*</td><td class=\"p-4 border-b\">Kali</td><td class=\"p-4 border-b font-mono text-sm\">5 * 2 = 10</td></tr>\n        <tr><td class=\"p-4 border-b font-mono text-lg text-center\">/</td><td class=\"p-4 border-b\">Bagi</td><td class=\"p-4 border-b font-mono text-sm\">5 / 2 = 2.5</td></tr>\n    </table>\n</div>"
    },
    {
        "title": "Flashback 5: If-Else \ud83d\udea6",
        "subtitle": "Percabangan Logika",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6\">\n    <div class=\"bg-slate-900 text-green-400 p-5 rounded-xl font-mono text-sm shadow-lg leading-relaxed\">\nuang = 5000<br>\nif uang > 10000:<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(\"Bisa beli bakso\")<br>\nelse:<br>\n&nbsp;&nbsp;&nbsp;&nbsp;print(\"Beli permen aja\")\n    </div>\n    <p class=\"text-center text-slate-600 font-bold bg-white p-3 rounded-lg border\">Perhatikan indentasi (spasi menjorok ke dalam)! Tanpa itu, kodemu akan Error.</p>\n</div>"
    },
    {
        "title": "Babak Baru: Lebih Banyak Data! \ud83d\udce6",
        "subtitle": "Kelemahan Variabel Biasa",
        "content": "<div class=\"text-center space-y-6\">\n    <p class=\"text-lg text-slate-700\">Sejauh ini, 1 variabel hanya bisa menyimpan 1 data.</p>\n    <div class=\"bg-slate-900 text-red-400 p-4 rounded-lg font-mono text-sm inline-block text-left shadow-lg\">\nmurid1 = \"Andi\"<br>\nmurid2 = \"Budi\"<br>\nmurid3 = \"Cici\"<br>\n...<br>\nmurid100 = \"Zeta\"\n    </div>\n    <p class=\"text-xl font-bold text-red-600 mt-4\">Bayangkan kalau ada 1000 murid! Kita butuh cara yang lebih baik.</p>\n</div>"
    },
    {
        "title": "Analogi: Kamar vs Laci Lemari \ud83d\uddc4\ufe0f",
        "subtitle": "Penggunaan Sehari-hari",
        "content": "<div class=\"grid grid-cols-2 gap-8 items-center max-w-4xl mx-auto\">\n    <div class=\"text-center bg-red-50 p-6 rounded-2xl border border-red-200\">\n        <h4 class=\"font-bold text-red-800 text-lg mb-4\">Variabel Biasa</h4>\n        <div class=\"text-6xl animate-pulse\">\ud83c\udf2a\ufe0f</div>\n        <p class=\"text-sm text-red-600 mt-4 font-bold\">Kamar Berantakan</p>\n        <p class=\"text-xs text-red-500 mt-2\">Barang berserakan di lantai. Susah dicarinya!</p>\n    </div>\n    <div class=\"text-center bg-green-50 p-6 rounded-2xl border border-green-200\">\n        <h4 class=\"font-bold text-green-800 text-lg mb-4\">List</h4>\n        <div class=\"text-6xl animate-bounce\">\ud83d\uddc4\ufe0f</div>\n        <p class=\"text-sm text-green-600 mt-4 font-bold\">Laci Terorganisir</p>\n        <p class=\"text-xs text-green-500 mt-2\">Setiap laci ada isinya dan ada nomornya berurutan.</p>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi: Tanpa List \u274c",
        "subtitle": "Chaos di Memori Komputer",
        "content": "<div class=\"relative w-full h-[300px] bg-slate-800 rounded-xl overflow-hidden border-2 border-slate-700\">\n    <style>\n        @keyframes floatRandom { 0% { transform: translate(0,0); } 50% { transform: translate(20px,-20px); } 100% { transform: translate(0,0); } }\n        .data-blob { position: absolute; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: monospace; border: 1px solid rgba(255,255,255,0.3); animation: floatRandom 3s infinite ease-in-out; }\n    </style>\n    <div class=\"data-blob\" style=\"top: 20%; left: 10%; animation-delay: 0s;\">Andi</div>\n    <div class=\"data-blob\" style=\"top: 60%; left: 30%; animation-delay: 0.5s;\">Budi</div>\n    <div class=\"data-blob\" style=\"top: 10%; left: 70%; animation-delay: 1s;\">Cici</div>\n    <div class=\"data-blob\" style=\"top: 70%; left: 80%; animation-delay: 1.5s;\">Deni</div>\n    <div class=\"data-blob\" style=\"top: 40%; left: 50%; animation-delay: 2s;\">Eka</div>\n    <p class=\"absolute bottom-4 left-1/2 -translate-x-1/2 text-slate-400 text-sm font-bold uppercase tracking-widest\">Data tersebar acak di memori</p>\n</div>"
    },
    {
        "title": "Visualisasi: Dengan List \u2705",
        "subtitle": "Keteraturan di Memori",
        "content": "<div class=\"relative w-full h-[300px] bg-slate-800 rounded-xl overflow-hidden border-2 border-slate-700 flex flex-col items-center justify-center\">\n    <div class=\"flex gap-4 p-6 bg-slate-900 rounded-xl border border-green-500/50 shadow-[0_0_30px_rgba(34,197,94,0.3)]\">\n        <div class=\"text-center\"><div class=\"w-20 h-20 bg-green-500/20 border-2 border-green-400 rounded-lg flex items-center justify-center text-white font-mono text-lg\">Andi</div><div class=\"text-green-400 text-sm mt-3 font-bold\">Index 0</div></div>\n        <div class=\"text-center\"><div class=\"w-20 h-20 bg-green-500/20 border-2 border-green-400 rounded-lg flex items-center justify-center text-white font-mono text-lg\">Budi</div><div class=\"text-green-400 text-sm mt-3 font-bold\">Index 1</div></div>\n        <div class=\"text-center\"><div class=\"w-20 h-20 bg-green-500/20 border-2 border-green-400 rounded-lg flex items-center justify-center text-white font-mono text-lg\">Cici</div><div class=\"text-green-400 text-sm mt-3 font-bold\">Index 2</div></div>\n        <div class=\"text-center\"><div class=\"w-20 h-20 bg-green-500/20 border-2 border-green-400 rounded-lg flex items-center justify-center text-white font-mono text-lg\">Deni</div><div class=\"text-green-400 text-sm mt-3 font-bold\">Index 3</div></div>\n    </div>\n    <p class=\"absolute bottom-4 left-1/2 -translate-x-1/2 text-green-400 text-sm font-bold uppercase tracking-widest\">Data tersusun rapi berurutan</p>\n</div>"
    },
    {
        "title": "Konsep 1: List di Memori \ud83d\udcbb",
        "subtitle": "Bahasa Komputernya: Array",
        "content": "<div class=\"max-w-3xl mx-auto space-y-8 text-center mt-4\">\n    <div class=\"text-6xl\">\ud83d\udcbe</div>\n    <div class=\"bg-white p-6 border rounded-xl shadow-sm text-left\">\n        <p class=\"text-lg text-slate-700 mb-4\">Dalam bahasa komputer, List adalah sekumpulan data yang dialokasikan di <b>memori secara berdekatan (contiguous memory)</b>.</p>\n        <p class=\"text-lg text-slate-700\">Setiap data memiliki alamat spesifik berurutan. Alamat ini kita sebut sebagai <b>Index</b>.</p>\n    </div>\n</div>"
    },
    {
        "title": "Syntax Dasar List \ud83d\udee0\ufe0f",
        "subtitle": "Cara membuat List di Python",
        "content": "<div class=\"max-w-2xl mx-auto space-y-6\">\n    <p class=\"text-slate-600\">Untuk membuat list, kita menggunakan kurung siku <code>[ ]</code> dan memisahkan setiap item dengan koma <code>,</code>.</p>\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-xl font-mono text-sm shadow-lg leading-relaxed\">\n<span class=\"text-slate-500\"># Membuat List yang berisi teks (String)</span><br>\ntas = [\"Buku\", \"Pensil\", \"Penghapus\"]<br><br>\n<span class=\"text-slate-500\"># Membuat List yang berisi angka (Integer)</span><br>\nnilai = [90, 85, 100, 75]<br><br>\nprint(tas)\n    </div>\n</div>"
    },
    {
        "title": "Konsep 2: Index \ud83d\udccd",
        "subtitle": "Nomor Urut Pintu Laci",
        "content": "<div class=\"text-center space-y-8 max-w-3xl mx-auto mt-4\">\n    <div class=\"text-6xl\">\ud83d\udd22</div>\n    <p class=\"text-lg text-slate-700\">Untuk mengambil isi list, kita tidak memanggil namanya secara berulang, melainkan lewat <b>nomor urutnya (Index)</b>.</p>\n    <div class=\"bg-blue-50 p-8 rounded-2xl border border-blue-200 shadow-inner\">\n        <p class=\"font-mono text-4xl text-blue-900 font-bold\">tas<span class=\"text-red-500\">[0]</span></p>\n        <p class=\"text-sm text-blue-700 mt-4\">\"Tolong ambilkan barang di dalam laci 'tas' pada urutan ke-0\"</p>\n    </div>\n</div>"
    },
    {
        "title": "Kenapa Mulai dari 0? \ud83e\udd2f",
        "subtitle": "Rahasia Programmer",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"text-left space-y-4\">\n        <h4 class=\"text-xl font-black text-slate-800\">Bukan 1, 2, 3... Tapi 0, 1, 2!</h4>\n        <p class=\"text-sm text-slate-600\">Dalam ilmu komputer, Index sebenarnya mengukur <b>Offset (Jarak)</b> dari titik awal memori.</p>\n        <p class=\"text-sm text-slate-600\">Barang pertama jaraknya 0 langkah dari posisi awal. Barang kedua jaraknya 1 langkah dari awal. Oleh karena itu, mulainya selalu dari 0 (Zero-indexed).</p>\n    </div>\n    <div class=\"bg-slate-900 p-6 rounded-2xl text-center shadow-2xl\">\n        <div class=\"flex justify-start mb-2 ml-4\">\n            <span class=\"w-16 text-center text-red-400 font-mono text-xs font-bold bg-red-900/50 py-1 rounded\">Start Ptr</span>\n        </div>\n        <div class=\"flex justify-start border-l-4 border-red-500 ml-12 relative\">\n            <div class=\"absolute -left-2 top-0 w-4 h-4 bg-red-500 rounded-full\"></div>\n            <div class=\"w-20 py-4 border-b-2 border-green-500 text-green-400 font-mono text-sm border-l-2 pl-2\">+0 langkah</div>\n            <div class=\"w-20 py-4 border-b-2 border-green-500 text-green-400 font-mono text-sm border-l-2 pl-2\">+1 langkah</div>\n            <div class=\"w-20 py-4 border-b-2 border-green-500 text-green-400 font-mono text-sm border-l-2 pl-2\">+2 langkah</div>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Animasi Interaktif: Buka Laci \ud83d\uddc4\ufe0f",
        "subtitle": "Arahkan mouse/sentuh laci",
        "content": "<div class=\"max-w-3xl mx-auto flex justify-center gap-6 mt-8\">\n    <style>\n        .drawer { width: 120px; height: 140px; background: #1e293b; border-radius: 16px; position: relative; cursor: pointer; border: 2px solid #334155; transition: all 0.3s; perspective: 1000px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }\n        .drawer-front { position: absolute; inset: 0; background: #475569; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: bottom; border-top: 1px solid #64748b; }\n        .drawer:hover .drawer-front { transform: rotateX(-60deg); opacity: 0.3; }\n        .drawer-item { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; z-index: 1; transform: translateY(20px); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }\n        .drawer:hover .drawer-item { transform: translateY(-20px); opacity: 1; }\n    </style>\n    <div class=\"drawer\">\n        <div class=\"drawer-item\">\ud83c\udf4e</div>\n        <div class=\"drawer-front\"><div class=\"w-10 h-2 bg-slate-800 rounded-full mb-4 shadow-inner\"></div><span class=\"text-white font-mono text-sm font-bold\">Index 0</span></div>\n    </div>\n    <div class=\"drawer\">\n        <div class=\"drawer-item\">\ud83c\udf4c</div>\n        <div class=\"drawer-front\"><div class=\"w-10 h-2 bg-slate-800 rounded-full mb-4 shadow-inner\"></div><span class=\"text-white font-mono text-sm font-bold\">Index 1</span></div>\n    </div>\n    <div class=\"drawer\">\n        <div class=\"drawer-item\">\ud83c\udf47</div>\n        <div class=\"drawer-front\"><div class=\"w-10 h-2 bg-slate-800 rounded-full mb-4 shadow-inner\"></div><span class=\"text-white font-mono text-sm font-bold\">Index 2</span></div>\n    </div>\n</div>\n<div class=\"text-center mt-12 bg-blue-50 p-4 rounded-xl border max-w-lg mx-auto\">\n    <p class=\"text-slate-600 font-mono text-sm\">Contoh: <code>print(buah[1])</code> akan menampilkan \ud83c\udf4c</p>\n</div>"
    },
    {
        "title": "Quiz Waktu Terbatas \u23f1\ufe0f",
        "subtitle": "Tebak Indexnya!",
        "content": "<div class=\"max-w-2xl mx-auto text-center space-y-6\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-xl font-mono text-sm shadow-xl text-left border-2 border-slate-700\">\nhewan = [\"Kucing\", \"Anjing\", \"Burung\", \"Ikan\", \"Katak\"]<br>\nprint(hewan[3])\n    </div>\n    <p class=\"font-black text-slate-800 text-2xl uppercase tracking-wider mt-8\">Apa yang diprint?</p>\n    <div class=\"grid grid-cols-2 gap-4 mt-6\">\n        <button onclick=\"showMiniFeedback('q1-fb', 'Salah! Kucing itu index 0', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold transition-all hover:scale-105\">Kucing</button>\n        <button onclick=\"showMiniFeedback('q1-fb', 'Salah! Burung itu index 2', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold transition-all hover:scale-105\">Burung</button>\n        <button onclick=\"showMiniFeedback('q1-fb', 'Tepat Sekali! Ikan ada di urutan ke-4, yang berarti index ke-3.', 'success')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold transition-all hover:scale-105\">Ikan</button>\n        <button onclick=\"showMiniFeedback('q1-fb', 'Salah! Katak itu index 4', 'error')\" class=\"p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 font-bold transition-all hover:scale-105\">Katak</button>\n    </div>\n    <div id=\"q1-fb\" class=\"min-h-[60px] mt-6 flex items-center justify-center\"></div>\n</div>"
    },
    {
        "title": "Exercise 1: Guided \ud83d\udc68\u200d\ud83c\udfeb",
        "subtitle": "Mari Bedah Kode Bersama",
        "content": "<div class=\"text-center space-y-6 mt-10\">\n    <div class=\"text-7xl mb-8 animate-bounce\">\ud83d\udd0d</div>\n    <p class=\"text-xl text-slate-700 max-w-2xl mx-auto font-medium\">Sekarang kita akan membedah sebuah kode secara perlahan. Kakak pengajar akan menjelaskan tiap barisnya. Perhatikan baik-baik ya!</p>\n    <div class=\"inline-block bg-blue-100 text-blue-800 px-6 py-3 rounded-full font-bold uppercase tracking-widest mt-12 border border-blue-200 shadow-sm\">\n        Lanjut ke langkah pertama \u27a1\ufe0f\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 1: Inisialisasi",
        "subtitle": "Membuat List",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded\">inventory = [\"Pedang\", \"Perisai\", \"Ramuan\"]</span><br>\n<span class=\"opacity-20\">print(\"Isi tas:\", inventory)</span><br>\n<span class=\"opacity-20\">inventory[1] = \"Armor\"</span><br>\n<span class=\"opacity-20\">print(\"Tas update:\", inventory)</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan Guru:</h4>\n        <div class=\"space-y-3\">\n            <p class=\"text-sm text-slate-600\">Di baris ini kita membuat variabel bernama <code>inventory</code>. Karena memakai kurung siku <code>[]</code>, komputer tahu ini adalah sebuah <b>List</b>.</p>\n            <p class=\"text-sm text-slate-600\">List ini langsung diisi 3 String:</p>\n            <ul class=\"list-disc pl-5 text-sm font-mono text-slate-500\">\n                <li>Index 0 = \"Pedang\"</li>\n                <li>Index 1 = \"Perisai\"</li>\n                <li>Index 2 = \"Ramuan\"</li>\n            </ul>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 2: Menampilkan",
        "subtitle": "Cek Isi List",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"opacity-20\">inventory = [\"Pedang\", \"Perisai\", \"Ramuan\"]</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded\">print(\"Isi tas:\", inventory)</span><br>\n<span class=\"opacity-20\">inventory[1] = \"Armor\"</span><br>\n<span class=\"opacity-20\">print(\"Tas update:\", inventory)</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan Guru:</h4>\n        <p class=\"text-sm text-slate-600\">Kita bisa melakukan <code>print()</code> langsung pada list. Nanti di layar akan keluar persis lengkap dengan kurung sikunya.</p>\n        <div class=\"bg-slate-100 p-4 rounded-xl border border-slate-200 mt-4\">\n            <p class=\"text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider\">Output Terminal:</p>\n            <p class=\"text-sm font-mono text-slate-800\">Isi tas: ['Pedang', 'Perisai', 'Ramuan']</p>\n        </div>\n    </div>\n</div>"
    },
    {
        "title": "Guided Step 3: Modifikasi Item",
        "subtitle": "List Bersifat Mutable",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm h-full flex flex-col justify-center shadow-2xl border border-slate-700 leading-loose\">\n<span class=\"opacity-20\">inventory = [\"Pedang\", \"Perisai\", \"Ramuan\"]</span><br>\n<span class=\"opacity-20\">print(\"Isi tas:\", inventory)</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded\">inventory[1] = \"Armor\"</span><br>\n<span class=\"text-yellow-400 bg-yellow-400/10 p-1 rounded\">print(\"Tas update:\", inventory)</span>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-black text-xl text-blue-800 flex items-center gap-2\"><span>\ud83d\udc68\u200d\ud83c\udfeb</span> Penjelasan Guru:</h4>\n        <p class=\"text-sm text-slate-600\">List di Python bersifat <b>Mutable</b> (bisa diubah isinya). Kita tunjuk index 1 (Perisai), lalu ubah isinya dengan \"Armor\". Perisai lama tertimpa dan hilang!</p>\n        <div class=\"bg-slate-100 p-4 rounded-xl border border-slate-200 mt-4\">\n            <p class=\"text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider\">Output Terminal Akhir:</p>\n            <p class=\"text-sm font-mono text-slate-800\">Tas update: ['Pedang', 'Armor', 'Ramuan']</p>\n        </div>\n    </div>\n</div>"

    {

    {
        "title": "Lanjutan: Slicing List \ud83d\udd2a",
        "subtitle": "Mengiris Data",
        "content": "<div class=\"text-center space-y-8 max-w-3xl mx-auto mt-8\">\n    <div class=\"text-7xl mb-6\">\ud83c\udf70</div>\n    <h3 class=\"text-3xl font-black text-slate-800\">Bagaimana kalau mau ambil banyak data sekaligus?</h3>\n    <p class=\"text-lg text-slate-600 bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n        Misalnya, kamu mau mengambil juara 1 sampai 3 dari list yang berisi 10 nama pemenang. Tentu repot kalau dipanggil satu-satu (index 0, index 1, index 2).\n        <br><br>Kita bisa pakai teknik super bernama <b>Slicing</b> (Memotong).\n    </p>\n</div>"
    },
    {
        "title": "Analogi Slicing \ud83c\udf5e",
        "subtitle": "Memotong Roti Tawar",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 items-center mt-6\">\n    <div class=\"bg-amber-50 p-8 rounded-3xl border-2 border-amber-200 text-center shadow-lg transform hover:scale-105 transition-transform\">\n        <div class=\"text-6xl mb-6\">\ud83c\udf5e \ud83d\udd2a \ud83e\udd6a</div>\n        <p class=\"text-md text-amber-800 font-bold bg-white/50 p-3 rounded-lg inline-block\">Mendapatkan potongan tengah</p>\n    </div>\n    <div class=\"text-left space-y-6 bg-white p-8 rounded-3xl shadow-sm border border-slate-200\">\n        <h4 class=\"font-bold text-xl text-slate-800\">Konsep Memotong</h4>\n        <p class=\"text-md text-slate-600\">Bayangkan list itu sebongkah roti tawar yang belum dipotong. Index adalah garis-garis tempat kamu akan meletakkan pisau.</p>\n        <p class=\"text-md text-slate-600\">Untuk mendapatkan beberapa potong roti di tengah, kamu butuh tahu <b>dimana pisau masuk (start)</b> dan <b>dimana pisau keluar (stop)</b>.</p>\n    </div>\n</div>"
    },
    {
        "title": "Syntax Slicing \u2702\ufe0f",
        "subtitle": "[start : stop]",
        "content": "<div class=\"max-w-4xl mx-auto text-center space-y-8 mt-4\">\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-3xl shadow-2xl inline-block border-2 border-slate-700\">\n        list<span class=\"text-yellow-400 font-bold\">[</span> <span class=\"text-blue-400\">start</span> <span class=\"text-white\">:</span> <span class=\"text-red-400\">stop</span> <span class=\"text-yellow-400 font-bold\">]</span>\n    </div>\n    <div class=\"text-left bg-blue-50 p-8 rounded-2xl border-2 border-blue-200 shadow-md\">\n        <p class=\"font-black text-xl text-blue-900 mb-4 flex items-center gap-2\"><span class=\"text-2xl\">\u2b50</span> Aturan Emas Slicing:</p>\n        <ul class=\"list-none text-md text-blue-800 space-y-4\">\n            <li class=\"flex gap-3\"><span class=\"bg-blue-200 text-blue-800 px-2 py-1 rounded font-bold text-xs h-fit mt-1\">START</span> Index awal yang <b>ikut terambil</b> (inklusif).</li>\n            <li class=\"flex gap-3\"><span class=\"bg-blue-200 text-blue-800 px-2 py-1 rounded font-bold text-xs h-fit mt-1\">STOP</span> Index akhir batas potongan. Item ini <b>TIDAK ikut terambil</b> (eksklusif). Pemotongan berhenti TEPAT SEBELUM index ini.</li>\n            <li class=\"flex gap-3\"><span class=\"bg-blue-200 text-blue-800 px-2 py-1 rounded font-bold text-xs h-fit mt-1\">TITIK DUA</span> Dipisahkan dengan tanda titik dua <code>:</code></li>\n        </ul>\n    </div>\n</div>"
    },
    {
        "title": "Visualisasi Slicing \ud83d\udc40",
        "subtitle": "Contoh: buah[1:4]",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 mt-6\">\n    <div class=\"flex flex-wrap justify-center gap-4 relative p-8 bg-slate-50 rounded-3xl border-2 border-slate-200\">\n        <!-- The highlight box for the slice -->\n        <div class=\"absolute inset-y-0 bg-blue-200/40 rounded-xl border-4 border-blue-400 z-0 shadow-inner\" style=\"left: 23%; right: 23%; top: 1rem; bottom: 1rem;\"></div>\n        \n        <div class=\"text-center z-10\"><div class=\"w-20 h-24 rounded-xl bg-white border-2 border-slate-200 flex items-center justify-center text-4xl opacity-40\">\ud83c\udf4e</div><div class=\"font-bold font-mono text-slate-400 mt-2\">0</div></div>\n        <div class=\"text-center z-10 relative\"><div class=\"absolute -top-3 left-1/2 -translate-x-1/2 text-[10px] font-black bg-blue-600 text-white px-2 py-1 rounded-full shadow-lg z-20\">START</div><div class=\"w-20 h-24 rounded-xl bg-blue-500 text-white border-2 border-blue-600 shadow-xl flex items-center justify-center text-4xl transform scale-110\">\ud83c\udf4a</div><div class=\"font-bold font-mono text-blue-600 mt-2\">1</div></div>\n        <div class=\"text-center z-10\"><div class=\"w-20 h-24 rounded-xl bg-blue-500 text-white border-2 border-blue-600 shadow-xl flex items-center justify-center text-4xl transform scale-110\">\ud83e\udd6d</div><div class=\"font-bold font-mono text-blue-600 mt-2\">2</div></div>\n        <div class=\"text-center z-10\"><div class=\"w-20 h-24 rounded-xl bg-blue-500 text-white border-2 border-blue-600 shadow-xl flex items-center justify-center text-4xl transform scale-110\">\ud83c\udf4c</div><div class=\"font-bold font-mono text-blue-600 mt-2\">3</div></div>\n        <div class=\"text-center z-10 relative\"><div class=\"absolute -top-3 left-1/2 -translate-x-1/2 text-[10px] font-black bg-red-500 text-white px-2 py-1 rounded-full shadow-lg z-20 whitespace-nowrap\">STOP (Batas)</div><div class=\"w-20 h-24 rounded-xl bg-white border-2 border-slate-200 flex items-center justify-center text-4xl opacity-40 border-l-4 border-l-red-500\">\ud83c\udf47</div><div class=\"font-bold font-mono text-slate-400 mt-2\">4</div></div>\n    </div>\n    <div class=\"text-center\">\n        <p class=\"text-2xl font-mono bg-slate-900 text-green-400 p-4 rounded-xl inline-block shadow-lg border border-slate-700\">buah<span class=\"text-yellow-400 font-bold\">[1:4]</span></p>\n    </div>\n</div>"
    },
    {
        "title": "Shortcut Slicing \u26a1",
        "subtitle": "Tidak perlu tulis semuanya",
        "content": "<div class=\"max-w-4xl mx-auto grid grid-cols-2 gap-8 text-left mt-6\">\n    <div class=\"p-8 bg-white border border-slate-200 rounded-3xl shadow-lg relative overflow-hidden\">\n        <div class=\"absolute top-0 right-0 bg-slate-100 px-4 py-2 rounded-bl-xl font-bold text-slate-400 text-sm\">Awal</div>\n        <h4 class=\"font-black text-blue-600 mb-4 font-mono text-3xl\">[:stop]</h4>\n        <p class=\"text-md text-slate-600 mb-6 leading-relaxed\">Kalau <code>start</code> dikosongkan, komputer akan memotong otomatis dari <b>paling awal (index 0)</b>.</p>\n        <code class=\"block text-sm bg-slate-900 text-green-400 p-4 rounded-xl font-mono\">buah[:3]<br><span class=\"text-slate-500\"># Sama dengan buah[0:3]</span></code>\n    </div>\n    <div class=\"p-8 bg-white border border-slate-200 rounded-3xl shadow-lg relative overflow-hidden\">\n        <div class=\"absolute top-0 right-0 bg-slate-100 px-4 py-2 rounded-bl-xl font-bold text-slate-400 text-sm\">Akhir</div>\n        <h4 class=\"font-black text-purple-600 mb-4 font-mono text-3xl\">[start:]</h4>\n        <p class=\"text-md text-slate-600 mb-6 leading-relaxed\">Kalau <code>stop</code> dikosongkan, komputer akan memotong terus sampai <b>paling ujung list</b>.</p>\n        <code class=\"block text-sm bg-slate-900 text-green-400 p-4 rounded-xl font-mono\">buah[2:]<br><span class=\"text-slate-500\"># Mulai dr index 2 smp akhir</span></code>\n    </div>\n</div>"
    },
    {
        "title": "Lanjutan 2: List Methods \u2699\ufe0f",
        "subtitle": "Alat-alat canggih bawaan list",
        "content": "<div class=\"text-center space-y-8 mt-6\">\n    <div class=\"text-7xl mb-6 animate-pulse\">\ud83e\uddf0</div>\n    <p class=\"text-xl text-slate-700 max-w-3xl mx-auto font-medium\">\n        Selain mengambil dan memotong isi list, kita juga bisa mengubah isinya dengan fungsi khusus yang disebut <b>Methods</b>.\n    </p>\n    <div class=\"bg-indigo-50 p-6 rounded-2xl border border-indigo-200 max-w-2xl mx-auto\">\n        <p class=\"text-indigo-800 text-md\">Ibarat kotak perkakas otomatis, list di Python punya obeng, palu, dan tang sendiri untuk menambah, menghapus, atau merapikan data!</p>\n    </div>\n</div>"
    },
    {
        "title": "Method 1: append() \u2795",
        "subtitle": "Masuk antrian belakang",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-4\">\n    <div class=\"flex items-center gap-6 bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 shadow-sm\">\n        <div class=\"text-5xl bg-white p-4 rounded-xl shadow-sm\">\ud83d\udeb6\u200d\u2642\ufe0f\ud83d\udeb6\u200d\u2640\ufe0f \u27a1\ufe0f \ud83d\udeb6</div>\n        <p class=\"text-lg text-blue-900 font-medium leading-relaxed\">Fungsi <code>.append()</code> menambahkan <b>satu item baru</b> tepat di posisi paling belakang dari List (seperti antrian kasir).</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-8 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\ntas = [\"Buku\"]<br>\ntas.<span class=\"text-yellow-400 font-bold\">append</span>(\"Pensil\")<br>\nprint(tas)<br>\n<span class=\"text-slate-500 bg-slate-800 px-2 py-1 rounded\"># Output: ['Buku', 'Pensil']</span>\n    </div>\n</div>"
    },
    {
        "title": "Method 2: insert() \ud83e\udd77",
        "subtitle": "Nyempil di tengah",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-4\">\n    <div class=\"flex items-center gap-6 bg-purple-50 p-6 rounded-2xl border-2 border-purple-200 shadow-sm\">\n        <div class=\"text-5xl bg-white p-4 rounded-xl shadow-sm\">\ud83d\udeb6\u200d\u2642\ufe0f \ud83e\udd77 \ud83d\udeb6\u200d\u2640\ufe0f</div>\n        <p class=\"text-lg text-purple-900 font-medium leading-relaxed\">Fungsi <code>.insert(index, item)</code> menambahkan item baru di <b>index (posisi) tertentu</b>. Item lama yang ada di index tersebut akan geser ke belakang.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose\">\nantrian = [\"Andi\", \"Budi\"]<br>\n<span class=\"text-yellow-400\"># Minta \"Zeta\" nyempil di index 1</span><br>\nantrian.<span class=\"text-blue-400 font-bold\">insert</span>(1, \"Zeta\")<br>\nprint(antrian)<br>\n<span class=\"text-slate-500 bg-slate-800 px-2 py-1 rounded\"># Output: ['Andi', 'Zeta', 'Budi']</span>\n    </div>\n</div>"
    },
    {
        "title": "Append vs Insert \ud83e\udd4a",
        "subtitle": "Kapan pakai yang mana?",
        "content": "<div class=\"grid grid-cols-2 gap-8 max-w-4xl mx-auto text-center mt-6\">\n    <div class=\"p-8 bg-white border-2 border-blue-100 rounded-3xl shadow-lg relative\">\n        <div class=\"absolute top-0 right-0 bg-blue-500 text-white px-3 py-1 rounded-bl-xl font-bold text-xs\">CEPAT \u26a1</div>\n        <h4 class=\"font-black text-2xl text-blue-600 mb-6 font-mono\">.append()</h4>\n        <div class=\"h-24 flex items-end justify-center mb-6 text-5xl\">\u27a1\ufe0f \ud83d\udce6</div>\n        <p class=\"text-md text-slate-600\">Sangat cepat! Komputer tidak perlu menggeser data lain. Cukup taruh data baru di buntut list.</p>\n    </div>\n    <div class=\"p-8 bg-white border-2 border-purple-100 rounded-3xl shadow-lg relative\">\n        <div class=\"absolute top-0 right-0 bg-orange-500 text-white px-3 py-1 rounded-bl-xl font-bold text-xs\">BERAT \ud83d\udc22</div>\n        <h4 class=\"font-black text-2xl text-purple-600 mb-6 font-mono\">.insert()</h4>\n        <div class=\"h-24 flex items-end justify-center mb-6 text-5xl relative\">\n            \ud83d\udce6 <span class=\"text-3xl absolute bottom-0 left-1/2 -translate-x-1/2 bg-white px-1\">\u2b05\ufe0f</span> \ud83d\udce6\n        </div>\n        <p class=\"text-md text-slate-600\">Proses lebih berat (kalau datanya jutaan). Karena <b>semua data di belakangnya</b> harus mundur 1 langkah.</p>\n    </div>\n</div>"
    },
    {
        "title": "Method 3: pop() \ud83c\udf88",
        "subtitle": "Ambil dan Buang",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-4\">\n    <div class=\"flex items-center gap-6 bg-red-50 p-6 rounded-2xl border-2 border-red-200 shadow-sm\">\n        <div class=\"text-5xl bg-white p-4 rounded-xl shadow-sm\">\ud83d\udce4</div>\n        <p class=\"text-lg text-red-900 font-medium leading-relaxed\">Fungsi <code>.pop()</code> menghapus item dari ujung belakang (atau berdasar index) dan <b>mengembalikan nilai item tersebut</b> agar bisa disimpan di variabel lain.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-sm shadow-xl border border-slate-700 leading-loose\">\nkartu = [\"AS\", \"King\", \"Queen\"]<br>\ndibuang = kartu.<span class=\"text-red-400 font-bold\">pop</span>() <span class=\"text-slate-500\"># Ambil yg teratas (Queen)</span><br>\nprint(\"Sisa kartu:\", kartu)<br>\nprint(\"Yang dibuang:\", dibuang)<br>\n<div class=\"mt-4 p-3 bg-slate-800 rounded border border-slate-600 text-slate-300\">\n# Sisa kartu: ['AS', 'King']<br>\n# Yang dibuang: Queen\n</div>\n    </div>\n</div>"
    },
    {
        "title": "Method 4: remove() \ud83d\uddd1\ufe0f",
        "subtitle": "Hapus Berdasarkan Nama",
        "content": "<div class=\"max-w-4xl mx-auto space-y-8 text-left mt-4\">\n    <div class=\"flex items-center gap-6 bg-orange-50 p-6 rounded-2xl border-2 border-orange-200 shadow-sm\">\n        <div class=\"text-5xl bg-white p-4 rounded-xl shadow-sm\">\ud83c\udfaf</div>\n        <p class=\"text-lg text-orange-900 font-medium leading-relaxed\">Fungsi <code>.remove(nama_item)</code> akan mencari item yang nilainya sama persis, lalu menghapusnya.</p>\n    </div>\n    <div class=\"bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-md shadow-xl border border-slate-700 leading-loose relative\">\n        <div class=\"absolute right-4 top-4 bg-yellow-400/20 text-yellow-400 px-3 py-1 border border-yellow-400 rounded-lg text-xs font-bold font-sans\">AWAS ERROR!</div>\ntas = [\"Buku\", \"Sampah\", \"Pensil\", \"Sampah\"]<br>\ntas.<span class=\"text-orange-400 font-bold\">remove</span>(\"Sampah\")<br>\nprint(tas)<br>\n<span class=\"text-slate-500 bg-slate-800 px-2 py-1 rounded\"># Output: ['Buku', 'Pensil', 'Sampah']</span>\n    </div>\n    <p class=\"text-sm text-slate-500 font-bold bg-slate-100 p-4 rounded-xl border-l-4 border-slate-400\">\ud83d\udca1 Catatan: Dia hanya menghapus 1 item pertama yang ia temukan dari kiri. Jika item tidak ada, program akan ERROR!</p>\n</div>"
    },
    {

        "subtitle": "Bikin Rapi Otomatis",
