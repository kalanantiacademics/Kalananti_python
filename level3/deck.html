<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Level 3 - Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], display: ['Orbitron', 'sans-serif'] },
                    colors: {
                        'k-blue': '#265E9B',
                        'k-blue-d': '#1A4576',
                        'k-yellow': '#F9C013',
                        'k-yellow-d': '#D9A40A',
                        'k-green': '#339D9D',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #e8f2ff;
            --bg2: #dbeeff;
            --sky: #cfe5ff;
            --nebula1: rgba(38,94,155,0.10);
            --nebula2: rgba(249,192,19,0.10);
            --card: rgba(255,255,255,0.94);
            --card-b: rgba(180,215,255,0.85);
            --nav: rgba(255,255,255,0.92);
            --nav-b: rgba(180,215,255,0.90);
            --text: #1a4576;
            --muted: #4d7daf;
            --chip: #ffffff;
            --chip-b: #cde0f8;
            --chip-t: #265E9B;
            --stars: 0.12;
        }

        html[data-theme="dark"] {
            --bg: #06101f;
            --bg2: #0d1e3e;
            --sky: #0a1830;
            --nebula1: rgba(82,188,255,0.18);
            --nebula2: rgba(249,192,19,0.15);
            --card: rgba(14,30,60,0.82);
            --card-b: rgba(140,190,255,0.22);
            --nav: rgba(6,14,30,0.90);
            --nav-b: rgba(120,170,255,0.22);
            --text: #ffffff;
            --muted: #b0c9e8;
            --chip: rgba(255,255,255,0.12);
            --chip-b: rgba(140,190,255,0.28);
            --chip-t: #cce0ff;
            --stars: 0.45;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, var(--nebula1), transparent 36%),
                radial-gradient(circle at 88% 12%, var(--nebula2), transparent 32%),
                radial-gradient(circle at 50% 105%, rgba(51,157,157,0.14), transparent 34%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg2) 50%, var(--sky) 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed; inset: 0;
            pointer-events: none; z-index: -20;
            opacity: var(--stars);
            background-image:
                radial-gradient(circle at 14% 24%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
                radial-gradient(circle at 78% 68%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
                radial-gradient(circle at 56% 38%, rgba(255,255,255,0.60) 0 1px, transparent 1.4px),
                radial-gradient(circle at 30% 82%, rgba(255,255,255,0.50) 0 1px, transparent 1.3px);
            background-size: 250px 250px, 320px 320px, 210px 210px, 280px 280px;
        }

        .topnav {
            background: var(--nav);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--nav-b);
        }
        .planet-card { 
            background: var(--card); 
            border: 1.5px solid var(--card-b); 
            backdrop-filter: blur(12px); 
            box-shadow: 0 20px 40px -20px rgba(2,8,26,0.85);
        }
        .chip { background: var(--chip); border: 1.5px solid var(--chip-b); color: var(--chip-t); }

        .slide-transition { transition: opacity 0.4s ease, transform 0.4s ease; }
        .meeting-tab { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        .meeting-tab:hover { background: rgba(255,255,255,0.05); border-color: var(--card-b); transform: translateX(4px); }
        .meeting-tab.active { background: linear-gradient(90deg, rgba(38,94,155,0.2), transparent); border-left: 3px solid var(--chip-t); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        #mission-loader {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        #mission-loader.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-rocket { width: 140px; height: auto; object-fit: contain; animation: loaderFloat 2.5s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(249,192,19,0.5)); }
        @keyframes loaderFloat { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-30px) rotate(8deg); } }
        .loader-bar { width: 280px; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-top: 40px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .loader-progress { position: absolute; inset: 0; background: linear-gradient(90deg, #F9C013, #FFD700); width: 0%; animation: loaderFill 2s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        @keyframes loaderFill { 0% { width: 0%; } 100% { width: 100%; } }

        @keyframes simpleFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-15px) rotate(3deg); } }

        #welcomeOverlay { position: fixed; inset: 0; background: var(--bg); opacity: 0.95; backdrop-filter: blur(20px); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        .delay-500ms { animation-delay: 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-3d { 
            position: relative; transition: all 0.2s;
            box-shadow: 0 6px 0 #1A4576, 0 15px 30px -5px rgba(38, 94, 155, 0.4); border: none; cursor: pointer;
        }
        .btn-3d:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1A4576, 0 20px 40px -10px rgba(38, 94, 155, 0.5); }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #1A4576, 0 5px 10px -2px rgba(38, 94, 155, 0.3); }

    
        /* --- Mock Window Normalized Components --- */
        .mock-window {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #1e1e1e;
            font-family: 'Space Grotesk', sans-serif;
            margin: 1rem auto;
            text-align: left;
        }
        .mock-window.light-mode {
            background: #f8f9fa;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .mock-window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #2b2b2b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .mock-window.light-mode .mock-window-header {
            background: #e2e8f0;
            border-bottom: 1px solid #cbd5e1;
        }
        .mock-window-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #cbd5e1;
        }
        .mock-window.light-mode .mock-window-title {
            color: #334155;
        }
        .mock-window-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .win-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .win-close { background: #ff5f56; border: 1px solid #e0443e; }
        .win-min { background: #ffbd2e; border: 1px solid #dea123; }
        .win-max { background: #27c93f; border: 1px solid #1aab29; }
        .mock-window-content {
            padding: 16px;
            position: relative;
        }
        .mock-window-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(38, 94, 155, 0.15);
            color: #2563eb;
            border: 1px solid rgba(37, 99, 235, 0.25);
            margin-bottom: 10px;
        }
        html[data-theme="dark"] .mock-window-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

    </style>
</head>

<!-- Data & Script -->
    <script>
        // --- Configuration ---
        const totalMeetings = 12;
        let currentMeeting = 1;
        let currentSlide = 1;

        // --- Data Structure ---

        // --- Welcome Logic from Level 3 ---
        const welcomeMessage = document.getElementById('welcomeMessage');
        const meetingSelectionSection = document.getElementById('meetingSelectionSection');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const displayTeacherName = document.getElementById('displayTeacherName');
        const teacherInputSection = document.getElementById('teacherInputSection');
        const welcomeBackSection = document.getElementById('welcomeBackSection');

        function checkTeacherName() {
            let teacher = localStorage.getItem("teacherName");
            if (teacher) {
                if(teacherInputSection) teacherInputSection.classList.add('hidden');
                if(welcomeBackSection) welcomeBackSection.classList.remove('hidden');
                if(displayTeacherName) displayTeacherName.innerText = teacher;
            } else {
                if(teacherInputSection) teacherInputSection.classList.remove('hidden');
                if(welcomeBackSection) welcomeBackSection.classList.add('hidden');
            }
        }

        window.startClass = function() {
            const name = document.getElementById('teacherName') ? document.getElementById('teacherName').value : '';
            const hobby = document.getElementById('teacherHobby') ? document.getElementById('teacherHobby').value : '';
            const food = document.getElementById('teacherFood') ? document.getElementById('teacherFood').value : '';
            
            if (name.trim()) {
                localStorage.setItem("teacherName", name);
                localStorage.setItem("teacherHobby", hobby || "Ngoding 💻");
                localStorage.setItem("teacherFood", food || "Nasi Goreng 🍛");
                showMeetingSelection();
            } else {
                alert("Mohon masukkan nama kakak pengajar dulu ya! 😊");
            }
        }

        window.enterClass = function() { showMeetingSelection(); }

        window.resetTeacher = function() {
            localStorage.removeItem("teacherName");
            localStorage.removeItem("teacherHobby");
            localStorage.removeItem("teacherFood");
            if(document.getElementById('teacherName')) document.getElementById('teacherName').value = "";
            if(document.getElementById('teacherHobby')) document.getElementById('teacherHobby').value = "";
            if(document.getElementById('teacherFood')) document.getElementById('teacherFood').value = "";
            checkTeacherName();
        }

        function showMeetingSelection() {
            if(teacherInputSection) teacherInputSection.classList.add('hidden');
            if(welcomeBackSection) welcomeBackSection.classList.add('hidden');
            if(welcomeMessage) welcomeMessage.classList.add('hidden');
            if(meetingSelectionSection) meetingSelectionSection.classList.remove('hidden');
            
            const grid = document.getElementById('meetingGrid');
            if(grid) {
                grid.innerHTML = '';
                for (let i = 1; i <= 12; i++) {
                    const btn = document.createElement('button');
                    const isLocked = !meetingData[i] || (i > 1 && meetingData[i].length === 1 && meetingData[i][0].content.includes("Soon"));
                    
                    let topic = "Belum tersedia";
                    if (!isLocked) {
                        const mainSlide = meetingData[i].find(s => s.title.startsWith(`Meeting ${i}:`)) || meetingData[i][0];
                        if (mainSlide) {
                            const titleParts = mainSlide.title.split(': ');
                            if (titleParts.length > 1) {

        // --- DOM Elements ---
        const els = {
            meetingNav: document.getElementById('meetingNav'),
            slideContainer: document.getElementById('slideContainer'),
            slideTitle: document.getElementById('slideTitle'),
            slideSubtitle: document.getElementById('slideSubtitle'),
            slideContent: document.getElementById('slideContent'),
            meetingTag: document.getElementById('meetingTag'),
            slideCounter: document.getElementById('slideCounter'),
            progressBar: document.getElementById('progressBar'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            hamburgerBtn: document.getElementById('hamburgerBtn'),
            closeSidebarBtn: document.getElementById('closeSidebarBtn'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            mainScrollArea: document.getElementById('mainScrollArea')
        };

        // --- Initialization ---
        function init() {
            if (typeof checkTeacherName === 'function') {
                checkTeacherName();
            }
            renderSidebar();
            renderSlide();
        }

        // --- Core Functions ---

        // --- Instructor Name Logic ---
        function saveInstructorName() {
            const input = document.getElementById('instructorInput');
            if (input && input.value.trim() !== "") {
                localStorage.setItem('kalananti_instructor_name', input.value.trim());
                renderInstructorName();
            }
        }

        function resetInstructorName() {
            localStorage.removeItem('kalananti_instructor_name');
            renderInstructorName();
        }

        function renderInstructorName() {
            const container = document.getElementById('instructor-name-container');
            if (!container) return;

            const storedName = localStorage.getItem('kalananti_instructor_name');

            if (storedName) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <h3 class="text-3xl font-extrabold text-slate-800 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-green-500">
                            Halo, saya Kak ${storedName}!
                        </h3>
                        <button onclick="resetInstructorName()" class="text-xs text-slate-800/50 hover:text-red-400 underline transition-colors">
                            Ganti Nama
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex flex-col items-center gap-3">
                        <label class="text-slate-600 font-medium">Siapa nama Kakak?</label>
                        <div class="flex gap-2">
                            <input type="text" id="instructorInput" placeholder="Ketik nama di sini..." 
                                class="border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none w-64 text-center"
                                onkeypress="if(event.key === 'Enter') saveInstructorName()">
                            <button onclick="saveInstructorName()" class="bg-blue-600 text-slate-800 px-4 py-2 rounded-lg hover:bg-blue-700 transition-all font-bold shadow-md">
                                Simpan
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function showMiniFeedback(targetId, message, type = 'success') {
            const target = document.getElementById(targetId);
            if (!target) return;

            const styles = {
                success: 'bg-green-50 border-green-200 text-green-800',
                warn: 'bg-yellow-50 border-yellow-200 text-yellow-800',
                error: 'bg-red-50 border-red-200 text-red-800'
            };

            target.className = `rounded-xl border p-3 text-sm font-semibold ${styles[type] || styles.success}`;
            target.textContent = message;
        }

        function toggleReveal(targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;
            target.classList.toggle('hidden');
        }

        function renderSidebar() {
            els.meetingNav.innerHTML = '';
            for (let i = 1; i <= totalMeetings; i++) {
                const btn = document.createElement('button');
                const isActive = (i === currentMeeting);
                
                const isLocked = !meetingData[i];
                
                const baseClasses = "w-full text-left p-4 rounded-2xl transition-all duration-300 flex items-center gap-4 meeting-tab";
                const activeClasses = "active";
                const inactiveClasses = isLocked 
                    ? "opacity-40 cursor-not-allowed bg-transparent text-muted" 
                    : "hover:bg-white/5 text-[var(--text)]";
                
                btn.className = `${baseClasses} ${isActive ? activeClasses : inactiveClasses}`;
                if (!isLocked) btn.onclick = () => switchMeeting(i);
                
                const circleClass = isActive 
                    ? "bg-gradient-to-br from-k-blue to-k-blue-d text-white shadow-lg shadow-k-blue/40 border border-k-blue/50" 
                    : "bg-[var(--bg2)] text-muted border border-[var(--card-b)]";

                const mainSlide = meetingData[i] ? (meetingData[i].find(s => s.title.startsWith(`Meeting ${i}:`)) || meetingData[i][0]) : null;
                
                let topic = "Belum tersedia";
                if (mainSlide) {
                    const titleParts = mainSlide.title.split(': ');
                    if (titleParts.length > 1) {
                         topic = titleParts[1]; 
                    } else {
                        topic = mainSlide.subtitle || "Klik untuk mulai";
                    }
                }

                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-sm font-black transition-all duration-300 ${circleClass} font-display">
                        ${i}
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="text-[14px] font-black truncate uppercase tracking-wider ${isActive ? 'text-[var(--text)]' : (isLocked ? 'text-muted' : 'text-[var(--text)]/80')}">Misi ${i}</div>
                        <div class="text-[10px] font-bold uppercase tracking-widest truncate ${isActive ? 'text-k-blue' : (isLocked ? 'text-muted/60' : 'text-muted')} mt-1">${topic}</div>
                    </div>
                    ${isActive ? '<span class="text-k-yellow font-bold ml-2 text-xl">✦</span>' : ''}
                `;
                
                els.meetingNav.appendChild(btn);
            }
        }

        function switchMeeting(meetNum) {
            currentMeeting = meetNum;
            currentSlide = 1;
            renderSidebar();
            renderSlide();
            closeSidebar(); // On mobile
        }

        function renderSlide() {
             // Animate Out
            els.slideContainer.style.opacity = '0';
            els.slideContainer.style.transform = 'translateY(10px) scale(0.98)';

            setTimeout(() => {
                // Update Content
                const slides = meetingData[currentMeeting];
                const slide = slides[currentSlide - 1];

                els.meetingTag.textContent = `Meeting ${currentMeeting}`; // Update tag
                els.slideTitle.textContent = slide.title;
                els.slideSubtitle.textContent = slide.subtitle;
                els.slideContent.innerHTML = slide.content;

                // Update Footer
                els.slideCounter.textContent = `Slide ${currentSlide} / ${slides.length}`;
                
                // Update Progress Bar
                const progressPercent = (currentSlide / slides.length) * 100;
                els.progressBar.style.width = `${progressPercent}%`;

                // Update Buttons
                els.prevBtn.disabled = (currentSlide === 1);
                els.nextBtn.disabled = (currentSlide === slides.length);

                // Animate In
                els.slideContainer.style.opacity = '1';
                els.slideContainer.style.transform = 'translateY(0) scale(1)';

                // Render Instructor Name if applicable
                if (currentMeeting === 1 && currentSlide === 1) {
                    renderInstructorName();
                }
                
                // Reset Scroll
                els.mainScrollArea.scrollTop = 0;

            }, 300);
        }

        function nextSlide() {
            const slides = meetingData[currentMeeting];
            if (currentSlide < slides.length) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                renderSlide();
            }
        }

        // --- Sidebar Logic ---
        function openSidebar() {
            els.sidebar.classList.remove('-translate-x-full');
            els.sidebarOverlay.classList.remove('hidden');
            setTimeout(() => els.sidebarOverlay.classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            els.sidebar.classList.add('-translate-x-full');
            els.sidebarOverlay.classList.add('hidden');
        }

        // --- Event Listeners ---
        els.nextBtn.addEventListener('click', nextSlide);
        els.prevBtn.addEventListener('click', prevSlide);
        
        els.hamburgerBtn.addEventListener('click', openSidebar);
        els.closeSidebarBtn.addEventListener('click', closeSidebar);
        els.sidebarOverlay.addEventListener('click', closeSidebar);

        // Keyboard Nav
        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement?.tagName?.toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea') return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Start
        init();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('mission-loader');
                if (loader) loader.classList.add('loaded');
            }, 1500);
        });
    </script>
</body>
</html>
